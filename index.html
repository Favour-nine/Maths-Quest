<script>/* =========================================================
   LESSONS — "Learn first, then practise"
   Each lesson: big idea → key words → method → worked example
   (revealed step by step) → wrong vs right → "your turn" (fill
   the gap) → quick check → practice.
   pg = pages in the student's revision guide.
   ========================================================= */
const B = (n, d) => `<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const LESSONS = {
/* ---------------- NUMBER ---------------- */
negatives: { pg: '6', yt: 'negative numbers',
  big: 'Negative numbers are numbers below zero — like temperatures in winter or money you owe.',
  words: [['Negative', 'less than zero, written with a minus sign, e.g. −4'], ['Number line', 'a line with numbers in order — left is smaller, right is bigger']],
  how: ['Adding a positive → move RIGHT on the number line.', 'Subtracting a positive → move LEFT.', 'Two signs next to each other? Same signs (+ + or − −) → +. Different signs (+ − or − +) → −.', 'Multiplying or dividing: same signs → positive answer; different signs → negative answer.'],
  ex: { q: 'Work out −3 − (−7)', s: [['Two signs together: − and −', 'They are the same, so they become +'], ['−3 + 7', 'Start at −3 on the number line'], ['Move 7 to the right → 4', 'Adding means moving right']], a: '4' },
  ex2: { q: 'Work out −6 × 4 and −20 ÷ −5', s: [['6 × 4 = 24; signs different → −24', 'One negative, one positive'], ['20 ÷ 5 = 4; signs the same → +4', 'Two negatives make a positive']], a: '−24 and 4' },
  wr: { wrong: '−5 − 3 = −2', right: '−5 − 3 = −8', why: 'Subtracting moves you LEFT — further below zero, not back towards it.' },
  gap: { q: 'Work out 2 − (−6)', lines: ['− − becomes +', '2 + 6 = ▢'], a: 8 } },

rounding: { pg: '7–9', yt: 'rounding significant figures',
  big: 'Rounding makes numbers simpler while keeping them close to the real value. Estimating uses rounded numbers so you can check an answer quickly.',
  words: [['Decimal place (d.p.)', 'digits after the decimal point'], ['Significant figure (s.f.)', 'counting from the FIRST digit that is not zero'], ['Decider', 'the digit straight after the last one you keep']],
  how: ['Find the last digit you are keeping.', 'Look at the next digit — the decider.', '5 or more → round UP. 4 or less → leave it.', 'Fill any gaps before the decimal point with zeros.'],
  ex: { q: 'Round 0.004 682 to 2 significant figures', s: [['Skip the zeros at the start: first s.f. is 4', 'Zeros at the front are not significant'], ['Keep 4 and 6 → decider is 8', '8 is 5 or more, so round up'], ['0.0047', 'The 6 becomes 7']], a: '0.0047' },
  ex2: { q: 'Estimate 48.7 × 3.12 ÷ 0.51', s: [['Round to 1 s.f.: 50 × 3 ÷ 0.5', 'Each number to one significant figure'], ['50 × 3 = 150', 'Multiply first'], ['150 ÷ 0.5 = 300', 'Dividing by a half doubles it']], a: '300' },
  wr: { wrong: '7 352 to 1 s.f. = 7', right: '7 352 to 1 s.f. = 7 000', why: 'Fill the places with zeros — the number must stay about the same size.' },
  gap: { q: 'Round 3.6457 to 2 decimal places', lines: ['Keep 3.64, decider is 5', '5 or more → round up', 'Answer = ▢'], a: 3.65 } },

'factors-primes': { pg: '11–13', yt: 'prime factor decomposition HCF LCM',
  big: 'Every whole number can be built by multiplying prime numbers together — like LEGO bricks for numbers.',
  words: [['Multiple', 'the number\'s times table (multiples of 4: 4, 8, 12…)'], ['Factor', 'divides into the number exactly (factors of 12: 1, 2, 3, 4, 6, 12)'], ['Prime', 'has exactly 2 factors: 1 and itself (2, 3, 5, 7, 11…)'], ['HCF / LCM', 'Highest Common Factor / Lowest Common Multiple']],
  how: ['Factor tree: split the number into two factors.', 'Circle any prime. Keep splitting the others.', 'Stop when every branch ends in a prime. Multiply them all, in order.', 'HCF: multiply the primes BOTH numbers share. LCM: the smallest number in both times tables.'],
  ex: { q: 'Write 60 as a product of prime factors', s: [['60 = 6 × 10', 'Any factor pair works'], ['6 = 2 × 3 and 10 = 2 × 5', 'Split until every branch is prime'], ['60 = 2 × 2 × 3 × 5 = 2² × 3 × 5', 'Index form: collect the repeats']], a: '2² × 3 × 5' },
  ex2: { q: 'Find the HCF and LCM of 12 and 18', s: [['Factors of 12: 1, 2, 3, 4, 6, 12. Factors of 18: 1, 2, 3, 6, 9, 18', 'List them'], ['HCF = 6', 'Biggest in both lists'], ['Multiples: 12, 24, 36… and 18, 36… → LCM = 36', 'First number in both times tables']], a: 'HCF 6, LCM 36' },
  wr: { wrong: '1 is a prime number', right: '1 is NOT prime', why: 'A prime needs exactly TWO different factors. 1 only has one.' },
  gap: { q: 'Find the LCM of 4 and 6', lines: ['Multiples of 4: 4, 8, 12, 16', 'Multiples of 6: 6, 12, 18', 'LCM = ▢'], a: 12 } },

fractions: { pg: '14–15', yt: 'adding fractions',
  big: 'A fraction is a part of a whole. The bottom says how many equal pieces; the top says how many you have.',
  words: [['Numerator', 'the top number'], ['Denominator', 'the bottom number'], ['Equivalent', 'fractions worth the same, e.g. ½ = 2/4'], ['Mixed number', 'a whole number and a fraction, e.g. 2¼']],
  how: ['Add/subtract: make the denominators the SAME first, then add/subtract the tops only.', 'Multiply: top × top, bottom × bottom.', 'Divide: Keep the first, Flip the second, Change ÷ to × (KFC).', 'Mixed numbers: turn into top-heavy fractions first. Always simplify at the end.'],
  ex: { q: `Work out ${B(2, 3)} + ${B(1, 4)}`, s: [['Common denominator: 12', '3 and 4 both go into 12'], [`${B(2, 3)} = ${B(8, 12)} and ${B(1, 4)} = ${B(3, 12)}`, 'Multiply top AND bottom by the same number'], [`${B(8, 12)} + ${B(3, 12)} = ${B(11, 12)}`, 'Add the tops only — the bottom stays 12']], a: B(11, 12) },
  ex2: { q: `Work out ${B(3, 5)} ÷ ${B(2, 7)}`, s: [[`Keep ${B(3, 5)}, flip ${B(2, 7)} → ${B(7, 2)}`, 'KFC'], [`${B(3, 5)} × ${B(7, 2)} = ${B(21, 10)}`, 'Top × top, bottom × bottom'], [`= 2${B(1, 10)}`, '21 ÷ 10 = 2 remainder 1']], a: `2${B(1, 10)}` },
  wr: { wrong: `${B(1, 2)} + ${B(1, 3)} = ${B(2, 5)}`, right: `${B(1, 2)} + ${B(1, 3)} = ${B(3, 6)} + ${B(2, 6)} = ${B(5, 6)}`, why: 'Never add the bottoms. Make them the same first.' },
  gap: { q: `Work out ${B(3, 4)} × ${B(2, 5)}`, lines: ['Tops: 3 × 2 = 6', 'Bottoms: 4 × 5 = 20', `${B(6, 20)} simplifies to ${B(3, '▢')}`], a: 10 } },

decimals: { pg: '4–5', yt: 'multiplying decimals',
  big: 'Decimals are another way of writing fractions of tenths, hundredths and thousandths.',
  words: [['Decimal place', 'a position after the point: tenths, hundredths, thousandths'], ['Place value', 'what a digit is worth because of where it sits']],
  how: ['× 10, 100, 1000 → digits move 1, 2, 3 places LEFT (bigger).', '÷ 10, 100, 1000 → digits move RIGHT (smaller).', 'Multiplying decimals: ignore the points, multiply, then put back the TOTAL number of decimal places.', 'Dividing by a decimal: multiply both numbers by 10 (or 100) until you are dividing by a whole number.'],
  ex: { q: 'Work out 0.6 × 0.07', s: [['6 × 7 = 42', 'Ignore the decimal points'], ['0.6 has 1 d.p., 0.07 has 2 d.p. → 3 d.p. in total', 'Count them all'], ['42 → 0.042', 'Put 3 decimal places back']], a: '0.042' },
  ex2: { q: 'Work out 3.6 ÷ 0.4', s: [['× 10 both: 36 ÷ 4', 'Now we divide by a whole number'], ['36 ÷ 4 = 9', 'Same answer as the original']], a: '9' },
  wr: { wrong: '0.3 × 0.2 = 0.6', right: '0.3 × 0.2 = 0.06', why: 'Two decimal places in the question → two in the answer.' },
  gap: { q: 'Work out 2.4 ÷ 0.3', lines: ['× 10 both: 24 ÷ 3', 'Answer = ▢'], a: 8 } },

recurring: { pg: '16–17', yt: 'recurring decimals to fractions',
  big: 'Some fractions turn into decimals that repeat forever. A dot over the digits shows which part repeats.',
  words: [['Recurring', 'repeating forever, e.g. 0.333…'], ['Dot notation', '0.3̇ means 0.333…; 0.1̇2̇ means 0.121212…']],
  how: ['Fraction → decimal: divide the top by the bottom.', 'Recurring decimal → fraction: call it x.', 'Multiply by 10 (one digit repeats) or 100 (two digits repeat) so the repeating parts line up.', 'Subtract to make the repeating part vanish, then solve for x and simplify.'],
  ex: { q: 'Write 0.2̇7̇ as a fraction', s: [['x = 0.272727…', 'Name it'], ['100x = 27.272727…', 'Two digits repeat → × 100'], ['100x − x = 99x = 27', 'The repeating tails cancel'], [`x = ${B(27, 99)} = ${B(3, 11)}`, 'Divide both by 9']], a: B(3, 11) },
  wr: { wrong: `0.4̇ = ${B(4, 10)}`, right: `0.4̇ = ${B(4, 9)}`, why: '0.4 exactly is 4/10, but 0.444… recurring is 4/9.' },
  gap: { q: 'Write 0.5̇ as a fraction', lines: ['x = 0.555…', '10x = 5.555…', '9x = 5', `x = ${B('▢', 9)}`], a: 5 } },

percentages: { pg: '19–21', yt: 'percentage increase decrease multiplier',
  big: 'Per cent means "out of 100". Percentages are everywhere: sales, pay rises, interest and test scores.',
  words: [['Multiplier', 'the number you multiply by, e.g. +20% → × 1.2, −20% → × 0.8'], ['Original', 'the amount before the change']],
  how: ['Find a %: 10% = ÷ 10, 1% = ÷ 100. Or use a multiplier: 35% → × 0.35.', 'Increase/decrease: multiply by (100 ± %) ÷ 100.', 'Percentage change = change ÷ ORIGINAL × 100.', 'Reverse (finding the original): DIVIDE the new amount by the multiplier.'],
  ex: { q: 'A £60 coat is reduced by 15%. Find the sale price.', s: [['100% − 15% = 85% → multiplier 0.85', 'What is left after the reduction'], ['60 × 0.85 = 51', 'One step!']], a: '£51' },
  ex2: { q: 'After a 20% rise, a price is £84. What was it before?', s: [['New price = 120% of original → × 1.2', 'The rise was 20% of the ORIGINAL'], ['84 ÷ 1.2 = 70', 'Divide to go backwards']], a: '£70' },
  wr: { wrong: 'Original = 84 − 20% of 84 = £67.20', right: 'Original = 84 ÷ 1.2 = £70', why: 'The 20% was of the original, not the new price — so divide by the multiplier.' },
  gap: { q: 'Increase £40 by 25%', lines: ['Multiplier = 1.25', '40 × 1.25 = ▢'], a: 50 } },

ratio: { pg: '24–26', yt: 'sharing in a ratio',
  big: 'A ratio compares amounts. 2 : 3 means "for every 2 of the first there are 3 of the second".',
  words: [['Parts', 'the numbers in the ratio (2 : 3 has 5 parts in total)'], ['Simplest form', 'divide every part by the HCF']],
  how: ['ADD the parts to find the total number of parts.', 'DIVIDE the amount by the total parts to find ONE part.', 'MULTIPLY one part by each number in the ratio.', 'Check: the shares should add up to the amount.'],
  ex: { q: 'Share £45 in the ratio 2 : 7', s: [['2 + 7 = 9 parts', 'Add'], ['45 ÷ 9 = £5 per part', 'Divide'], ['2 × 5 = £10 and 7 × 5 = £35', 'Multiply'], ['Check: 10 + 35 = 45 ✓', 'Always check']], a: '£10 and £35' },
  ex2: { q: 'Red : blue = 3 : 5. There are 12 more blue than red. How many altogether?', s: [['Difference in parts: 5 − 3 = 2 parts', 'The difference is what we know'], ['2 parts = 12 → 1 part = 6', 'Divide'], ['Total = 8 parts × 6 = 48', '3 + 5 = 8 parts']], a: '48' },
  wr: { wrong: 'Share £20 in 1 : 4 → £20 ÷ 4 = £5', right: '1 + 4 = 5 parts → £4 per part → £4 and £16', why: 'Divide by the TOTAL number of parts.' },
  gap: { q: 'Share 30 sweets in the ratio 1 : 2', lines: ['1 + 2 = 3 parts', '30 ÷ 3 = 10 per part', 'Bigger share = 2 × 10 = ▢'], a: 20 } },

proportion: { pg: '27, 58', yt: 'direct and inverse proportion',
  big: 'Direct proportion: both go up together (more pens cost more). Inverse proportion: one goes up, the other goes down (more workers → fewer days).',
  words: [['Unitary method', 'find the value for ONE first'], ['Constant (k)', 'the fixed number linking the two amounts']],
  how: ['Direct: divide to find ONE, then multiply for the amount you need.', 'Inverse: multiply to find the TOTAL, then divide.', 'Higher: write y = kx (or y = kx², y = k/x), use the given values to find k, then use the formula.'],
  ex: { q: '5 notebooks cost £3.50. How much do 8 cost?', s: [['1 notebook = 3.50 ÷ 5 = £0.70', 'Divide for ONE'], ['8 × 0.70 = £5.60', 'Times for EIGHT']], a: '£5.60' },
  ex2: { q: '3 painters take 8 days. How long would 6 painters take?', s: [['Total work = 3 × 8 = 24 painter-days', 'Inverse: multiply first'], ['24 ÷ 6 = 4 days', 'More painters → fewer days']], a: '4 days' },
  wr: { wrong: '6 painters take 16 days', right: '6 painters take 4 days', why: 'More people should finish FASTER — that is inverse proportion.' },
  gap: { q: '4 tickets cost £20. How much do 7 cost?', lines: ['1 ticket = 20 ÷ 4 = £5', '7 tickets = 7 × 5 = ▢'], a: 35 } },

'powers-roots': { pg: '28–29', yt: 'powers and roots',
  big: 'Powers are a shortcut for repeated multiplying. Roots go backwards.',
  words: [['Index / power', 'the small raised number: 5³ means 5 × 5 × 5'], ['Square root √', 'what number × itself gives this?'], ['Reciprocal', '1 ÷ the number (flip a fraction)']],
  how: ['Learn your squares to 15² and cubes 1, 8, 27, 64, 125, 1000.', 'Anything to the power 0 = 1.', 'Square roots of positive numbers have two answers: √25 = ±5.', 'Use BIDMAS — powers come before × and +.'],
  ex: { q: 'Work out 2⁴ + √49 − 3⁰', s: [['2⁴ = 2 × 2 × 2 × 2 = 16', 'Repeated multiplying'], ['√49 = 7', '7 × 7 = 49'], ['3⁰ = 1', 'Power 0 is always 1'], ['16 + 7 − 1 = 22', 'Put it together']], a: '22' },
  wr: { wrong: '4² = 8', right: '4² = 4 × 4 = 16', why: 'The power tells you how many times to multiply the number by ITSELF.' },
  gap: { q: 'Work out 3³', lines: ['3 × 3 × 3', '= ▢'], a: 27 } },

'standard-form': { pg: '30–31', yt: 'standard form',
  big: 'Standard form is a neat way to write really big numbers (like the distance to the Sun) or really tiny ones (like a virus).',
  words: [['Standard form', 'A × 10ⁿ where A is between 1 and 10'], ['Power of 10', 'how many places the decimal point moves']],
  how: ['Put the decimal point after the FIRST non-zero digit — that is A.', 'Count how many places the point moved — that is n.', 'Big number (10 or more) → n is positive. Small number (less than 1) → n is negative.', 'Multiplying: multiply the A\'s, ADD the powers, then fix A if it is 10 or more.'],
  ex: { q: 'Write 0.000 52 in standard form', s: [['A = 5.2', 'Point after the first non-zero digit'], ['The point moves 4 places', '0.00052 → 5.2'], ['Small number → negative power: 5.2 × 10⁻⁴', 'Less than 1 means negative']], a: '5.2 × 10⁻⁴' },
  ex2: { q: 'Work out (4 × 10⁵) × (3 × 10²)', s: [['4 × 3 = 12', 'Multiply the front numbers'], ['10⁵ × 10² = 10⁷', 'Add the powers'], ['12 × 10⁷ = 1.2 × 10⁸', '12 is too big — make it 1.2 and add 1 to the power']], a: '1.2 × 10⁸' },
  wr: { wrong: '45 000 = 45 × 10³', right: '45 000 = 4.5 × 10⁴', why: 'The first number must be between 1 and 10.' },
  gap: { q: 'Write 3 700 000 in standard form', lines: ['A = 3.7', 'Point moves 6 places', '3.7 × 10 to the power ▢'], a: 6 } },

bounds: { pg: '10', yt: 'error intervals',
  big: 'A rounded measurement could really be a little bigger or smaller. Bounds tell you the smallest and largest it could have been.',
  words: [['Lower bound', 'the smallest value that rounds to it'], ['Upper bound', 'the boundary at the top (it would round UP, so use <)'], ['Error interval', 'LB ≤ x < UB']],
  how: ['Halve the unit it was rounded to (nearest 10 → 5).', 'Lower bound = value − half. Upper bound = value + half.', 'Write it as LB ≤ x < UB.', 'Calculations: to make an answer as BIG as possible, use big ÷ small; as small as possible, use small ÷ big.'],
  ex: { q: 'A length is 70 cm to the nearest 10 cm. Write the error interval.', s: [['Half of 10 = 5', 'Halve the unit'], ['70 − 5 = 65 and 70 + 5 = 75', 'Go down and up'], ['65 ≤ l < 75', 'Upper bound uses <']], a: '65 ≤ l < 75' },
  wr: { wrong: 'Nearest 10 → 60 ≤ x < 80', right: '65 ≤ x < 75', why: 'Use HALF the unit, not the whole unit.' },
  gap: { q: '8 kg to the nearest kg', lines: ['Half of 1 = 0.5', 'Lower bound = 8 − 0.5 = ▢'], a: 7.5 } },

surds: { pg: '32', yt: 'simplifying surds',
  big: 'A surd is an exact square root that is not a whole number, like √2. Keeping surds gives EXACT answers.',
  words: [['Surd', 'a root that can\'t be simplified to a whole number, e.g. √3'], ['Rationalise', 'get rid of the surd from the bottom of a fraction']],
  how: ['√(a × b) = √a × √b — find the biggest SQUARE factor.', '√a × √a = a.', 'Expand brackets with surds like normal brackets.', 'Rationalise a/√b: multiply top and bottom by √b.'],
  ex: { q: 'Simplify √48', s: [['48 = 16 × 3', '16 is the biggest square factor'], ['√48 = √16 × √3', 'Split the root'], ['= 4√3', '√16 = 4']], a: '4√3' },
  ex2: { q: `Rationalise ${B(6, '√3')}`, s: [[`× ${B('√3', '√3')}`, 'Multiplying by 1 keeps it the same value'], [B('6√3', 3), '√3 × √3 = 3'], ['= 2√3', '6 ÷ 3 = 2']], a: '2√3' },
  wr: { wrong: '√9 + √16 = √25 = 5', right: '√9 + √16 = 3 + 4 = 7', why: 'You can\'t add inside square roots.' },
  gap: { q: 'Simplify √50', lines: ['50 = 25 × 2', '√50 = ▢√2'], a: 5 } },

/* ---------------- ALGEBRA ---------------- */
simplifying: { pg: '28–29, 35–36', yt: 'collecting like terms',
  big: 'Algebra uses letters for numbers. Simplifying means tidying up so there is less to write.',
  words: [['Term', 'one chunk, e.g. 5x or −3y'], ['Like terms', 'same letters and powers: 4x and 7x'], ['Index laws', 'rules for multiplying and dividing powers']],
  how: ['Circle each term WITH the sign in front of it.', 'Collect like terms: x\'s with x\'s, y\'s with y\'s.', 'xᵃ × xᵇ = xᵃ⁺ᵇ (add). xᵃ ÷ xᵇ = xᵃ⁻ᵇ (subtract). (xᵃ)ᵇ = xᵃᵇ (multiply).', 'With numbers in front: multiply the numbers, then use the index laws.'],
  ex: { q: 'Simplify 5a + 3b − 2a + b', s: [['a terms: 5a − 2a = 3a', 'The − belongs to 2a'], ['b terms: 3b + b = 4b', 'b means 1b'], ['3a + 4b', 'Can\'t combine a and b']], a: '3a + 4b' },
  ex2: { q: 'Simplify 3x⁴ × 5x²', s: [['3 × 5 = 15', 'Multiply the numbers'], ['x⁴ × x² = x⁶', 'Add the powers'], ['15x⁶', 'Put together']], a: '15x⁶' },
  wr: { wrong: '2x + 3y = 5xy', right: '2x + 3y cannot be simplified', why: 'x and y are different letters — unlike terms.' },
  gap: { q: 'Simplify y⁷ ÷ y³', lines: ['Dividing → subtract the powers', '7 − 3 = ▢'], a: 4 } },

expanding: { pg: '36–37', yt: 'expanding double brackets',
  big: 'Expanding means multiplying out brackets to remove them.',
  words: [['Expand', 'multiply out the brackets'], ['FOIL', 'First, Outside, Inside, Last — for two brackets']],
  how: ['Single bracket: multiply EVERY term inside by the term outside.', 'Double brackets: use FOIL or a grid, so you get 4 terms.', 'Collect the two middle x-terms.', 'Squared bracket (x + 3)²: write it as (x + 3)(x + 3) first!'],
  ex: { q: 'Expand (x + 4)(x − 3)', s: [['First: x × x = x²', 'F'], ['Outside: x × −3 = −3x', 'O'], ['Inside: 4 × x = 4x', 'I'], ['Last: 4 × −3 = −12', 'L'], ['x² + x − 12', '−3x + 4x = x']], a: 'x² + x − 12' },
  wr: { wrong: '(x + 5)² = x² + 25', right: '(x + 5)² = x² + 10x + 25', why: 'Write it as two brackets — you missed the two middle terms.' },
  gap: { q: 'Expand 3(2x + 5)', lines: ['3 × 2x = 6x', '3 × 5 = ▢'], a: 15 } },

factorising: { pg: '38, 45–46', yt: 'factorising quadratics',
  big: 'Factorising is expanding backwards — putting brackets back in.',
  words: [['Common factor', 'something that divides every term'], ['Quadratic', 'an expression with x² as the highest power']],
  how: ['Single bracket: take out the HIGHEST common factor (numbers AND letters).', 'x² + bx + c: find two numbers that MULTIPLY to c and ADD to b.', 'Write them in (x  )(x  ).', 'Always check by expanding back out.'],
  ex: { q: 'Factorise x² + 7x + 12', s: [['Multiply to 12, add to 7: 3 and 4', '3 × 4 = 12, 3 + 4 = 7'], ['(x + 3)(x + 4)', 'Put them in brackets'], ['Check: x² + 4x + 3x + 12 ✓', 'Expand to check']], a: '(x + 3)(x + 4)' },
  ex2: { q: 'Factorise x² − 49', s: [['Two squares with a minus: x² and 7²', 'Difference of two squares'], ['(x + 7)(x − 7)', 'One +, one −']], a: '(x + 7)(x − 7)' },
  wr: { wrong: '6x + 9 = 3(2x + 9)', right: '6x + 9 = 3(2x + 3)', why: 'Divide EVERY term by 3.' },
  gap: { q: 'Factorise x² + 5x + 6', lines: ['Multiply to 6, add to 5: 2 and ▢', '(x + 2)(x + 3)'], a: 3 } },

substitution: { pg: '39, 43–44', yt: 'substitution into formulae',
  big: 'Substitution means swapping letters for numbers. Rearranging means getting a different letter on its own.',
  words: [['Formula', 'a rule connecting letters, e.g. A = lw'], ['Subject', 'the letter on its own, e.g. A in A = lw']],
  how: ['Write the formula out first.', 'Replace each letter with its number — put negatives in brackets.', 'Work it out using BIDMAS.', 'Rearranging: undo the operations in REVERSE order, doing the same to both sides.'],
  ex: { q: 'Find v = u + at when u = 5, a = 3, t = 4', s: [['v = 5 + 3 × 4', 'Swap the letters'], ['3 × 4 = 12', 'Multiply first (BIDMAS)'], ['v = 17', '5 + 12']], a: '17' },
  ex2: { q: 'Make t the subject of v = u + at', s: [['v − u = at', 'Subtract u from both sides'], [`t = ${B('v − u', 'a')}`, 'Divide both sides by a']], a: `t = ${B('v − u', 'a')}` },
  wr: { wrong: 'a = −3 → a² = −9', right: 'a² = (−3)² = 9', why: 'Use brackets: negative × negative = positive.' },
  gap: { q: 'Find 2p + q when p = 6, q = −4', lines: ['2 × 6 = 12', '12 + (−4) = ▢'], a: 8 } },

equations: { pg: '40–41', yt: 'solving equations',
  big: 'An equation is a balance. Whatever you do to one side, do to the other — until x is alone.',
  words: [['Solve', 'find the value of the letter'], ['Inverse operation', 'the opposite: + ↔ −, × ↔ ÷']],
  how: ['Expand any brackets. Clear fractions by multiplying.', 'Get the x-terms on one side (move the smaller one).', 'Get the numbers on the other side using inverse operations.', 'Divide to get x on its own. Check by substituting back.'],
  ex: { q: 'Solve 5x − 4 = 2x + 11', s: [['3x − 4 = 11', 'Subtract 2x from both sides'], ['3x = 15', 'Add 4 to both sides'], ['x = 5', 'Divide by 3'], ['Check: 21 = 21 ✓', '5×5−4 and 2×5+11']], a: 'x = 5' },
  ex2: { q: `Solve ${B('x + 3', 4)} = 5`, s: [['x + 3 = 20', 'Multiply both sides by 4'], ['x = 17', 'Subtract 3']], a: 'x = 17' },
  wr: { wrong: '3x + 6 = 21 → 3x = 27', right: '3x + 6 = 21 → 3x = 15', why: 'To undo + 6, SUBTRACT 6.' },
  gap: { q: 'Solve 4x + 3 = 23', lines: ['4x = 20', 'x = ▢'], a: 5 } },

quadratics: { pg: '45–48', yt: 'solving quadratic equations',
  big: 'A quadratic equation has an x² and usually TWO answers. Its graph is a U-shaped curve.',
  words: [['Roots / solutions', 'the x values that make it equal 0'], ['Quadratic formula', 'x = (−b ± √(b² − 4ac)) ÷ 2a'], ['Completing the square', 'writing it as (x + p)² + q']],
  how: ['Rearrange so it = 0.', 'Factorise if you can; each bracket = 0 gives an answer.', 'Watch the signs: (x + 3) = 0 gives x = −3.', 'If it won\'t factorise (or says "to 2 d.p."), use the quadratic formula.'],
  ex: { q: 'Solve x² − x − 12 = 0', s: [['Multiply to −12, add to −1: −4 and 3', 'Factor pairs of 12'], ['(x − 4)(x + 3) = 0', 'Factorise'], ['x − 4 = 0 → x = 4, or x + 3 = 0 → x = −3', 'Each bracket = 0']], a: 'x = 4 or x = −3' },
  ex2: { q: 'Solve x² + 4x − 1 = 0 (2 d.p.)', s: [['a = 1, b = 4, c = −1', 'Read them off'], ['b² − 4ac = 16 + 4 = 20', 'Careful with −4 × 1 × −1'], ['x = (−4 ± √20) ÷ 2', 'Formula'], ['x = 0.24 or x = −4.24', 'Do + and − separately']], a: 'x = 0.24 or −4.24' },
  wr: { wrong: '(x + 5)(x − 2) = 0 → x = 5 or −2', right: 'x = −5 or x = 2', why: 'Set each bracket = 0: x + 5 = 0 gives x = −5.' },
  gap: { q: 'Solve (x − 6)(x + 1) = 0', lines: ['x − 6 = 0 → x = ▢', 'x + 1 = 0 → x = −1'], a: 6 } },

sequences: { pg: '51–52', yt: 'nth term',
  big: 'A sequence is a list of numbers that follows a rule. The nth term is a formula that gives ANY term.',
  words: [['Term', 'one number in the sequence'], ['Common difference', 'how much it goes up/down each time'], ['nth term', 'a rule like 3n + 2 — put in n = 1, 2, 3…']],
  how: ['Find the difference between terms.', 'Write "difference × n", e.g. 4n.', 'Find the zero term: first term − difference.', 'nth term = difference × n + zero term. Check with n = 1.'],
  ex: { q: 'Find the nth term of 7, 11, 15, 19, …', s: [['Difference = +4 → 4n', 'Goes up in 4s'], ['Zero term = 7 − 4 = 3', 'The term before the first'], ['nth term = 4n + 3', 'Check: n = 1 → 7 ✓']], a: '4n + 3' },
  wr: { wrong: '5, 8, 11, … → n + 3', right: '5, 8, 11, … → 3n + 2', why: 'The difference (3) goes in front of n.' },
  gap: { q: 'nth term of 2, 7, 12, 17, …', lines: ['Difference = 5 → 5n', 'Zero term = 2 − 5 = ▢', 'nth term = 5n − 3'], a: -3 } },

inequalities: { pg: '53', yt: 'solving inequalities',
  big: 'An inequality is like an equation, but instead of = it says "bigger than" or "smaller than". The answer is a range of numbers.',
  words: [['<  >', 'less than, greater than'], ['≤  ≥', 'less than or equal to, greater than or equal to'], ['Integer', 'a whole number (can be negative)']],
  how: ['Solve exactly like an equation, keeping the sign.', 'If you multiply or divide by a NEGATIVE, flip the sign.', 'For double inequalities (−3 < 2x + 1 ≤ 7), do the same to all THREE parts.', 'On a number line: open circle for < or >, filled circle for ≤ or ≥.'],
  ex: { q: 'Solve 3x − 5 > 7', s: [['3x > 12', 'Add 5 to both sides'], ['x > 4', 'Divide by 3']], a: 'x > 4' },
  ex2: { q: 'List the integers for −2 < n ≤ 3', s: [['−2 is not included (<)', 'Open end'], ['3 is included (≤)', 'Closed end'], ['−1, 0, 1, 2, 3', 'Whole numbers in between']], a: '−1, 0, 1, 2, 3' },
  wr: { wrong: '−2x < 8 → x < −4', right: '−2x < 8 → x > −4', why: 'Dividing by a negative flips the sign.' },
  gap: { q: 'Solve 2x + 1 ≤ 13', lines: ['2x ≤ 12', 'x ≤ ▢'], a: 6 } },

simultaneous: { pg: '55–56', yt: 'simultaneous equations elimination',
  big: 'Two equations, two unknowns. You need values of x and y that work in BOTH equations at the same time.',
  words: [['Eliminate', 'get rid of one letter by adding or subtracting the equations'], ['Substitute', 'put a value back in to find the other letter']],
  how: ['Line up the equations and label them (1) and (2).', 'Make the number in front of x (or y) the same — multiply if needed.', 'Same Signs Subtract, Different Signs Add (SSS / DSA).', 'Solve, then substitute back to find the other letter. Check in the other equation.'],
  ex: { q: 'Solve 2x + y = 11 and x − y = 1', s: [['The y\'s have different signs → ADD', '+y and −y'], ['3x = 12 → x = 4', 'The y\'s vanish'], ['2(4) + y = 11 → y = 3', 'Substitute'], ['Check: 4 − 3 = 1 ✓', 'Use the other equation']], a: 'x = 4, y = 3' },
  wr: { wrong: 'x + 2y = 8, x + y = 5 → add → 2x + 3y = 13', right: 'Subtract → y = 3, then x = 2', why: 'The x\'s have the SAME sign, so subtract to get rid of them.' },
  gap: { q: 'Solve x + y = 10 and x − y = 4', lines: ['Add: 2x = 14', 'x = 7', 'y = 10 − 7 = ▢'], a: 3 } },

functions: { pg: '—', yt: 'composite and inverse functions',
  big: 'A function is a number machine: f(x) = 2x + 3 takes x, doubles it, then adds 3.',
  words: [['f(4)', 'put 4 into the function'], ['f⁻¹(x)', 'the inverse — the machine run backwards'], ['fg(x)', 'do g FIRST, then f']],
  how: ['f(number): replace x with the number.', 'Inverse: write y = f(x), swap x and y, rearrange to y = …', 'Composite fg(x): put g(x) into f.', 'Order matters: fg is NOT the same as gf.'],
  ex: { q: 'f(x) = 3x − 1. Find f(5) and f⁻¹(x)', s: [['f(5) = 3 × 5 − 1 = 14', 'Substitute'], ['y = 3x − 1 → x = 3y − 1', 'Swap x and y'], [`y = ${B('x + 1', 3)}`, 'Rearrange: + 1, then ÷ 3']], a: `f(5) = 14, f⁻¹(x) = ${B('x + 1', 3)}` },
  wr: { wrong: 'fg(2): do f first', right: 'fg(2): do g first', why: 'Work from the inside out — the function next to x goes first.' },
  gap: { q: 'f(x) = 4x + 2. Find f(3)', lines: ['4 × 3 = 12', '12 + 2 = ▢'], a: 14 } },

'straight-line': { pg: '60–64', yt: 'y=mx+c gradient',
  big: 'Every straight-line graph has an equation y = mx + c. The m tells you how steep it is; the c tells you where it crosses the y-axis.',
  words: [['Gradient (m)', 'steepness: up ÷ across'], ['y-intercept (c)', 'where the line crosses the y-axis'], ['Midpoint', 'the point exactly halfway between two points']],
  how: ['Gradient = change in y ÷ change in x (rise ÷ run).', 'Uphill (left to right) → positive. Downhill → negative.', 'Get y on its own before reading m and c.', 'Parallel → same gradient. Perpendicular → flip and change sign (2 → −½).'],
  ex: { q: 'Find the gradient through (1, 3) and (4, 9)', s: [['Change in y = 9 − 3 = 6', 'Up'], ['Change in x = 4 − 1 = 3', 'Across'], ['6 ÷ 3 = 2', 'Rise ÷ run']], a: '2' },
  ex2: { q: 'Find the equation of the line with gradient 3 through (2, 5)', s: [['y = 3x + c', 'Put m in'], ['5 = 3 × 2 + c → c = −1', 'Substitute the point'], ['y = 3x − 1', 'Write it out']], a: 'y = 3x − 1' },
  wr: { wrong: 'Gradient = change in x ÷ change in y', right: 'Gradient = change in y ÷ change in x', why: 'Steepness is how far UP for each step ACROSS.' },
  gap: { q: 'What is the gradient of y = 5x − 2?', lines: ['Compare with y = mx + c', 'm = ▢'], a: 5 } },

/* ---------------- GEOMETRY ---------------- */
angles: { pg: '76, 97–99', yt: 'angle facts',
  big: 'Angle rules let you find missing angles without measuring — you always give a reason.',
  words: [['Acute / obtuse / reflex', '< 90° / between 90° and 180° / > 180°'], ['Alternate (Z)', 'equal angles in a Z shape between parallel lines'], ['Corresponding (F)', 'equal angles in an F shape'], ['Co-interior (C)', 'angles in a C shape — they add to 180°']],
  how: ['Straight line = 180°. Around a point = 360°.', 'Triangle = 180°. Quadrilateral = 360°.', 'Isosceles triangle: the two base angles are equal.', 'Polygon: exterior angles add to 360°. Interior + exterior = 180°.'],
  ex: { q: 'Find one interior angle of a regular hexagon', s: [['Exterior = 360 ÷ 6 = 60°', 'All exterior angles add to 360°'], ['Interior = 180 − 60 = 120°', 'They sit on a straight line']], a: '120°' },
  wr: { wrong: 'Co-interior angles are equal', right: 'Co-interior angles add up to 180°', why: 'Only alternate and corresponding angles are equal.' },
  gap: { q: 'Two angles in a triangle are 50° and 75°. Find the third.', lines: ['50 + 75 = 125', '180 − 125 = ▢'], a: 55 } },

transformations: { pg: '80–82', yt: 'transformations translation reflection rotation enlargement',
  big: 'There are four ways to move a shape: translate (slide), reflect (flip), rotate (turn) and enlarge (resize).',
  words: [['Column vector', '(top over bottom) = (right/left over up/down)'], ['Centre', 'the fixed point you rotate or enlarge from'], ['Scale factor', 'how many times bigger']],
  how: ['Translation: give the vector.', 'Reflection: give the mirror line (e.g. y = 2, x = −1, y = x).', 'Rotation: give the angle, direction AND centre.', 'Enlargement: give the scale factor AND centre. Multiply distances from the centre.'],
  ex: { q: 'Rotate (3, 1) 90° anticlockwise about (0, 0)', s: [['Rule for 90° anticlockwise: (x, y) → (−y, x)', 'Or use tracing paper'], ['(3, 1) → (−1, 3)', 'Swap and change the sign of the new x']], a: '(−1, 3)' },
  wr: { wrong: 'Reflect (2, 5) in the x-axis → (−2, 5)', right: '(2, −5)', why: 'The x-axis is horizontal, so the point flips up/down — the y changes sign.' },
  gap: { q: 'Translate (4, −2) by 3 right and 5 up', lines: ['x: 4 + 3 = 7', 'y: −2 + 5 = ▢'], a: 3 } },

similar: { pg: '78–79, 82', yt: 'similar shapes area and volume',
  big: 'Similar shapes are exact enlargements of each other: same angles, all sides scaled by the same number.',
  words: [['Scale factor (k)', 'new length ÷ old length'], ['Congruent', 'exactly the same shape AND size']],
  how: ['Match up the corresponding sides.', 'k = new side ÷ matching old side.', 'Multiply (or divide) other sides by k.', 'Higher: areas scale by k², volumes by k³.'],
  ex: { q: 'Two similar triangles: 4 cm becomes 10 cm. Another side is 6 cm. Find the matching side.', s: [['k = 10 ÷ 4 = 2.5', 'Scale factor'], ['6 × 2.5 = 15 cm', 'Multiply']], a: '15 cm' },
  ex2: { q: 'Lengths ratio 1 : 3. Small area = 5 cm². Big area?', s: [['Length SF = 3', 'From the ratio'], ['Area SF = 3² = 9', 'Square it for area'], ['5 × 9 = 45 cm²', 'Multiply']], a: '45 cm²' },
  wr: { wrong: 'Length SF 2 → area doubles', right: 'Length SF 2 → area × 4', why: 'Area grows by the scale factor SQUARED.' },
  gap: { q: 'Side 3 cm becomes 12 cm. Another side is 5 cm.', lines: ['k = 12 ÷ 3 = 4', '5 × 4 = ▢'], a: 20 } },

perimeter: { pg: '83–84', yt: 'perimeter circumference',
  big: 'Perimeter is the distance all the way around the outside of a shape — like a fence round a field.',
  words: [['Perimeter', 'total length of the outside edge'], ['Circumference', 'the perimeter of a circle'], ['π (pi)', '≈ 3.14159…, use the π button']],
  how: ['Mark a starting corner and go round, adding every side.', 'Work out any missing sides first (use the opposite sides).', 'Circle: C = π × diameter (or 2 × π × radius).', 'Semicircle: half the circumference + the diameter.'],
  ex: { q: 'Circumference of a circle with radius 5 cm (1 d.p.)', s: [['Diameter = 2 × 5 = 10 cm', 'Double the radius'], ['C = π × 10 = 31.4159…', 'π × d'], ['31.4 cm', 'Round to 1 d.p.']], a: '31.4 cm' },
  wr: { wrong: 'Semicircle perimeter = πd ÷ 2 only', right: 'πd ÷ 2 + d', why: 'Don\'t forget the straight edge along the bottom.' },
  gap: { q: 'Perimeter of a 7 cm by 4 cm rectangle', lines: ['7 + 4 + 7 + 4', '= ▢'], a: 22 } },

area: { pg: '83–85', yt: 'area of shapes',
  big: 'Area is the amount of flat space inside a shape — measured in squares (cm², m²).',
  words: [['Perpendicular height', 'the height at a right angle (90°) to the base — not the slanted side'], ['Sector', 'a pizza-slice part of a circle']],
  how: ['Rectangle: length × width. Triangle: ½ × base × height.', 'Parallelogram: base × height. Trapezium: ½(a + b) × h.', 'Circle: π × r² (use the RADIUS).', 'Compound shapes: split into simple shapes, then add (or subtract).'],
  ex: { q: 'Area of a trapezium: parallel sides 6 cm and 10 cm, height 4 cm', s: [['a + b = 16', 'Add the parallel sides'], ['16 × 4 = 64', 'Times the height'], ['64 ÷ 2 = 32 cm²', 'Halve it']], a: '32 cm²' },
  ex2: { q: 'Area of a circle with diameter 8 cm (1 d.p.)', s: [['r = 4 cm', 'Halve the diameter!'], ['π × 4² = π × 16 = 50.265…', 'πr²'], ['50.3 cm²', 'Round']], a: '50.3 cm²' },
  wr: { wrong: 'Triangle base 8, height 5 → area 40', right: 'Area = ½ × 8 × 5 = 20', why: 'A triangle is half a rectangle.' },
  gap: { q: 'Triangle: base 10 cm, height 6 cm', lines: ['10 × 6 = 60', '÷ 2 = ▢'], a: 30 } },

'surface-area': { pg: '86–87', yt: 'surface area',
  big: 'Surface area is the total area of all the outside faces of a 3D shape — the wrapping paper you\'d need.',
  words: [['Face', 'a flat surface of a 3D shape'], ['Net', 'the 3D shape unfolded flat']],
  how: ['Sketch the net or list every face.', 'Find the area of each face.', 'Add them up. A cuboid has 3 pairs of matching rectangles.', 'Cylinder: 2 circles (2πr²) + curved rectangle (2πrh).'],
  ex: { q: 'Surface area of a 5 × 3 × 2 cm cuboid', s: [['5×3 = 15, 5×2 = 10, 3×2 = 6', 'The three different faces'], ['15 + 10 + 6 = 31', 'Add one of each'], ['31 × 2 = 62 cm²', 'Each face has a twin']], a: '62 cm²' },
  wr: { wrong: 'Surface area of cuboid = l × w × h', right: 'That is the VOLUME', why: 'Surface area adds the areas of the faces.' },
  gap: { q: 'Surface area of a cube with 3 cm edges', lines: ['One face = 3 × 3 = 9', '6 faces: 6 × 9 = ▢'], a: 54 } },

volume: { pg: '88–89', yt: 'volume of prisms cylinders',
  big: 'Volume is how much 3D space a shape takes up — how much water it could hold. Units are cubed (cm³).',
  words: [['Prism', 'a 3D shape with the same cross-section all the way through'], ['Cross-section', 'the shape you\'d see if you sliced it']],
  how: ['Cuboid: length × width × height.', 'Any prism: area of cross-section × length.', 'Cylinder: πr² × h.', 'Cone/pyramid: ⅓ × base area × height. Sphere: ⁴⁄₃πr³.'],
  ex: { q: 'Volume of a cylinder: radius 3 cm, height 10 cm (1 d.p.)', s: [['Circle area = π × 3² = 28.274…', 'Cross-section'], ['× 10 = 282.74…', 'Times the length'], ['282.7 cm³', 'Round']], a: '282.7 cm³' },
  wr: { wrong: 'Cylinder: π × 6² × h when the diameter is 6', right: 'π × 3² × h', why: 'Use the RADIUS: halve the diameter first.' },
  gap: { q: 'Cuboid 4 × 5 × 2 cm', lines: ['4 × 5 = 20', '20 × 2 = ▢'], a: 40 } },

conversions: { pg: '93–94', yt: 'converting units metric',
  big: 'Converting units means changing how something is measured without changing its real size.',
  words: [['Metric', 'mm, cm, m, km; g, kg; ml, l'], ['Exchange rate', 'how much one currency is worth in another']],
  how: ['Learn: 10 mm = 1 cm, 100 cm = 1 m, 1000 m = 1 km, 1000 g = 1 kg, 1000 ml = 1 l.', 'Big unit → small unit: MULTIPLY. Small → big: DIVIDE.', 'Area: square the factor (1 m² = 10 000 cm²). Volume: cube it (1 m³ = 1 000 000 cm³).', 'Time: 1 h = 60 min, so 0.5 h = 30 min, 0.25 h = 15 min.'],
  ex: { q: 'Convert 3.5 kg to grams', s: [['1 kg = 1000 g', 'Know the fact'], ['kg → g is big → small: multiply', 'More small units'], ['3.5 × 1000 = 3500 g', 'Move digits 3 places']], a: '3500 g' },
  wr: { wrong: '2 m² = 200 cm²', right: '2 m² = 20 000 cm²', why: 'A 1 m square is 100 cm by 100 cm = 10 000 cm².' },
  gap: { q: 'Convert 450 cm to metres', lines: ['cm → m: divide by 100', '450 ÷ 100 = ▢'], a: 4.5 } },

'compound-measures': { pg: '95', yt: 'speed distance time',
  big: 'Compound measures combine two units — like speed (miles PER hour) or density (grams PER cm³).',
  words: [['Speed', 'distance ÷ time'], ['Density', 'mass ÷ volume'], ['Pressure', 'force ÷ area']],
  how: ['Draw the formula triangle (D over S × T; M over D × V; F over P × A).', 'Cover what you want: side by side → multiply; one over the other → divide.', 'Check the units match (hours with km/h).', 'Convert minutes to hours by ÷ 60.'],
  ex: { q: 'A cyclist goes 36 km in 1 hour 30 minutes. Find the speed.', s: [['1 h 30 min = 1.5 hours', 'NOT 1.3!'], ['Speed = 36 ÷ 1.5', 'D ÷ T'], ['= 24 km/h', 'Units: km per hour']], a: '24 km/h' },
  wr: { wrong: '2 h 15 min = 2.15 h', right: '2 h 15 min = 2.25 h', why: '15 minutes is a quarter of an hour.' },
  gap: { q: 'Distance at 50 km/h for 3 hours', lines: ['D = S × T', '50 × 3 = ▢'], a: 150 } },

'circle-theorems': { pg: '100–101', yt: 'circle theorems',
  big: 'Circle theorems are rules about angles inside circles. Spot the shape, use the rule, and state it as your reason.',
  words: [['Chord', 'a straight line joining two points on the circle'], ['Tangent', 'a line that just touches the circle once'], ['Cyclic quadrilateral', 'a 4-sided shape with all corners on the circle']],
  how: ['Angle at the centre = 2 × angle at the circumference.', 'Angle in a semicircle = 90°.', 'Opposite angles in a cyclic quadrilateral add to 180°.', 'Tangent ⟂ radius (90°). Angles in the same segment are equal. Alternate segment theorem.'],
  ex: { q: 'Angle at the circumference is 35°. Find the angle at the centre (same arc).', s: [['Centre = 2 × circumference', 'Theorem'], ['2 × 35 = 70°', 'Double it']], a: '70°' },
  wr: { wrong: 'Cyclic quad: opposite angles are equal', right: 'They add to 180°', why: 'Opposite angles in a cyclic quadrilateral are supplementary.' },
  gap: { q: 'Cyclic quadrilateral: one angle is 110°. Find the opposite angle.', lines: ['They add to 180°', '180 − 110 = ▢'], a: 70 } },

bearings: { pg: '106', yt: 'bearings',
  big: 'Bearings tell you a direction as an angle. Pilots and sailors use them to navigate.',
  words: [['Bearing', 'an angle measured clockwise from North'], ['Three figures', 'always write 3 digits: 045°, not 45°']],
  how: ['Find the word "FROM" — put your pencil on that point.', 'Draw a North line there.', 'Measure CLOCKWISE from North to the line joining the points.', 'Back bearing: add 180° (or subtract 180° if over 180°).'],
  ex: { q: 'The bearing of B from A is 070°. Find the bearing of A from B.', s: [['Turn round: + 180°', 'Opposite direction'], ['70 + 180 = 250°', 'Under 180, so add']], a: '250°' },
  wr: { wrong: 'South-west = 135°', right: 'South-west = 225°', why: 'Go clockwise from North: E 090°, S 180°, SW 225°.' },
  gap: { q: 'Bearing of B from A is 300°. Find A from B.', lines: ['Over 180 → subtract 180', '300 − 180 = ▢'], a: 120 } },

pythagoras: { pg: '109, 114', yt: 'pythagoras theorem',
  big: 'In a right-angled triangle, the two short sides squared add up to the longest side squared: a² + b² = c².',
  words: [['Hypotenuse', 'the longest side — opposite the right angle'], ['Right angle', 'exactly 90°, shown by a small square']],
  how: ['Check it is a right-angled triangle. Find the hypotenuse.', 'Square the two sides you know.', 'Finding the LONGEST side → ADD. Finding a SHORTER side → SUBTRACT.', 'Square root at the end. Does your answer look sensible?'],
  ex: { q: 'Short sides 5 cm and 12 cm. Find the hypotenuse.', s: [['5² + 12² = 25 + 144', 'Longest side → add'], ['= 169', ''], ['√169 = 13 cm', 'Square root']], a: '13 cm' },
  ex2: { q: 'Hypotenuse 10 cm, one side 6 cm. Find the other.', s: [['10² − 6² = 100 − 36', 'Shorter side → subtract'], ['= 64', ''], ['√64 = 8 cm', 'Square root']], a: '8 cm' },
  wr: { wrong: '3² + 4² = 25 → answer 25', right: '√25 = 5', why: 'Always square root at the end.' },
  gap: { q: 'Short sides 6 and 8. Find the hypotenuse.', lines: ['36 + 64 = 100', '√100 = ▢'], a: 10 } },

trigonometry: { pg: '110–113', yt: 'trigonometry sohcahtoa',
  big: 'Trigonometry links the ANGLES and SIDES of a right-angled triangle. Remember SOH CAH TOA.',
  words: [['Opposite (O)', 'the side across from the angle'], ['Adjacent (A)', 'the side next to the angle (not the hypotenuse)'], ['Hypotenuse (H)', 'the longest side']],
  how: ['Label the sides O, A, H from the angle you are using.', 'Tick the two sides involved (the one you know and the one you want).', 'Pick SOH (sin = O/H), CAH (cos = A/H) or TOA (tan = O/A).', 'Missing side: rearrange. Missing angle: use sin⁻¹/cos⁻¹/tan⁻¹. Calculator in DEGREES.'],
  ex: { q: 'Angle 35°, hypotenuse 12 cm. Find the opposite side.', s: [['Have H, want O → SOH', 'O and H'], ['sin 35° = O ÷ 12', 'Write the ratio'], ['O = 12 × sin 35° = 6.88…', 'Multiply'], ['6.9 cm', '1 d.p.']], a: '6.9 cm' },
  ex2: { q: 'Opposite 7 cm, adjacent 9 cm. Find the angle.', s: [['O and A → TOA', 'Pick the ratio'], ['tan θ = 7 ÷ 9', ''], ['θ = tan⁻¹(7 ÷ 9) = 37.9°', 'Inverse button']], a: '37.9°' },
  wr: { wrong: 'x on the bottom: x = 8 × sin 40°', right: 'x = 8 ÷ sin 40°', why: 'When the unknown is on the bottom of the ratio, divide.' },
  gap: { q: 'sin 30° = ½. Hypotenuse 14, find the opposite.', lines: ['O = 14 × sin 30°', '= 14 × ½ = ▢'], a: 7 } },

/* ---------------- STATISTICS ---------------- */
averages: { pg: '123, 130–132', yt: 'mean median mode range',
  big: 'Averages describe a typical value. The range shows how spread out the data is.',
  words: [['Mean', 'add them all up ÷ how many'], ['Median', 'the middle value when IN ORDER'], ['Mode', 'the most common value'], ['Range', 'biggest − smallest']],
  how: ['Always put the data IN ORDER first.', 'Median position = (n + 1) ÷ 2.', 'Frequency table mean: add an f × x column. Mean = Σfx ÷ Σf.', 'Grouped data: use the MIDPOINT of each class to estimate the mean.'],
  ex: { q: 'Find the median of 9, 3, 7, 1, 8, 4', s: [['In order: 1, 3, 4, 7, 8, 9', 'Order first!'], ['6 values → middle is between the 3rd and 4th', '(6 + 1) ÷ 2 = 3.5'], ['(4 + 7) ÷ 2 = 5.5', 'Halfway']], a: '5.5' },
  wr: { wrong: 'Median of 8, 2, 5 = 2 (the middle one)', right: 'In order: 2, 5, 8 → median 5', why: 'Order the numbers first.' },
  gap: { q: 'Mean of 4, 6, 8, 10', lines: ['Total = 28', '28 ÷ 4 = ▢'], a: 7 } },

'pie-charts': { pg: '127', yt: 'pie charts',
  big: 'A pie chart shows how a whole is split into parts. The whole circle is 360°.',
  words: [['Sector', 'one slice of the pie'], ['Angle', 'how big each slice is, in degrees']],
  how: ['Find the total frequency.', 'Degrees for each one = 360 ÷ total.', 'Angle = frequency × degrees each.', 'Check the angles add up to 360°.'],
  ex: { q: '24 pupils: 9 walk. Find the angle for walking.', s: [['360 ÷ 24 = 15° per pupil', 'Degrees each'], ['9 × 15 = 135°', 'Multiply']], a: '135°' },
  wr: { wrong: '9 out of 24 → 9 ÷ 24 × 100', right: '9 ÷ 24 × 360', why: 'A pie chart is out of 360°, not 100.' },

'box-plots': { pg: '124, 134', yt: 'box plots',
  big: 'A box plot shows the spread of data in five numbers. The box holds the middle half of the data.',
  words: [['Lower quartile (LQ)', '¼ of the way through the data'], ['Upper quartile (UQ)', '¾ of the way through'], ['IQR', 'interquartile range = UQ − LQ']],
  how: ['Order the data. Find min, LQ, median, UQ, max.', 'The box goes from LQ to UQ with a line at the median.', 'Whiskers go out to the min and max.', 'Compare: median (which is higher on average?) and IQR (smaller = more consistent).'],

  wr: { wrong: 'Bigger IQR = more consistent', right: 'Smaller IQR = more consistent', why: 'A small spread means the values are close together.' },
  gap: { q: 'LQ = 14, UQ = 23', lines: ['IQR = UQ − LQ', '23 − 14 = ▢'], a: 9 } },

'cumulative-frequency': { pg: '135', yt: 'cumulative frequency',
  big: 'Cumulative frequency is a running total. The S-shaped graph lets you read off the median and quartiles.',
  words: [['Cumulative', 'adding up as you go'], ['Upper class boundary', 'the top value of each group — where you plot']],
  how: ['Add a running-total column.', 'Plot each total at the TOP of its class. Join with a smooth curve.', 'Median: read across from n ÷ 2. LQ from n ÷ 4, UQ from 3n ÷ 4.', '"More than" questions: total − the reading.'],

  wr: { wrong: 'Plot at the midpoint of each class', right: 'Plot at the upper end of each class', why: 'The running total is only complete at the END of the class.' },
  gap: { q: '80 values: where do you read the median?', lines: ['Median at n ÷ 2', '80 ÷ 2 = ▢'], a: 40 } },

histograms: { pg: '136–137', yt: 'histograms frequency density',
  big: 'In a histogram the AREA of each bar shows frequency, so bars can have different widths.',

  gap: { q: 'FD = 3, width = 5', lines: ['f = FD × width', '3 × 5 = ▢'], a: 15 } },

probability: { pg: '138–141', yt: 'probability',
  big: 'Probability measures how likely something is, from 0 (impossible) to 1 (certain).',

function diagVariant(id) { return [...DIAG.F, ...DIAG.H].find(v => v.id === id); }
function diagMarks(v) { return v.items.reduce((s, it) => s + it.m, 0); }
function diagMinutes(v) { return Math.max(20, Math.round(diagMarks(v) * 90 / 80 / 5) * 5); } // AQA rate: 90 min for 80 marks
function diagQ(it) {
  const t = TOPIC(it.t), q = { g: it.g, topic: it.t, topicName: t.name, cat: t.cat, tierLabel: tierLabel(it.g), text: it.q, steps: [it.w || ''], marks: it.m, src: it.src, mis: [], traps: [] };
  if (it.k === 'mc') { q.kind = 'mc'; q.options = MC(it.a, it.o.map(o => ({ t: o, why: 'See the worked solution.' }))); }
  else if (it.k === 'multi') { q.kind = 'multi'; q.unordered = !!it.u; q.fields = it.f.map(([label, v, dp]) => dp != null ? { label, answer: v, dp, exact: v } : { label, answer: v }); }
  else if (it.k === 'frac') { q.kind = 'frac'; q.answer = it.a; q.exactOnly = it.exactOnly; }
  else if (it.k === 'sf') { q.kind = 'sf'; q.answer = it.a; }
  else if (it.k === 'ratio') { q.kind = 'ratio'; q.text += ' <span class="small mut">(type it like 3:2)</span>'; q.answer = Array.isArray(it.a) ? it.a : String(it.a).split(':').map(Number); }
  else { q.kind = 'num'; q.answer = it.a; if (it.dp != null) { q.dp = it.dp; q.exact = it.exact != null ? it.exact : it.a; } if (it.rel) q.tol = Math.abs(it.a) * 0.01; if (it.rel3) q.tol = Math.abs(it.a) * 0.005; if (it.pre) q.pre = it.pre; if (it.unit) q.unit = it.unit; }
  if (it.pre && q.kind !== 'num') q.pre = it.pre;
  if (it.fig) q.svg = it.fig;
  return q;
}
/* Score one item: whole marks if fully right; multi-part answers earn marks per correct part */
function diagScore(q, a) {
  if (a == null) return 0;
  if (q.kind === 'multi') {
    const r = check(q, a); if (r.ok) return q.marks;
    const vals = a.map(parseValue); let right = 0;
    q.fields.forEach((f, i) => { if (vals[i] != null && numMatch(vals[i], f.answer, f).ok) right++; });
    if (q.unordered && right === 0) q.fields.forEach((f, i) => { const j = 1 - i; if (vals[j] != null && numMatch(vals[j], f.answer, f).ok) right++; });
    return Math.floor(q.marks * right / q.fields.length);
  }
  if (q.kind === 'num' && q.tol) { const v = parseValue(a); return v != null && Math.abs(v - q.answer) <= q.tol ? q.marks : 0; }
  const r = check(q, a); return r.ok ? q.marks : 0;
}

/* Name every variant by board, series and paper so the picker can group them */
['F', 'H'].forEach(t => DIAG[t].forEach(v => {
  const m = v.model.match(/(AQA|Eduqas) (\w+) (\d{4}) · (Paper|Component) (\d)/);
  v.board = m[1]; v.series = m[2] + ' ' + m[3]; v.year = +m[3]; v.sort = +m[3] * 100 + (m[2] === 'November' ? 11 : 6);
  v.plabel = m[4]; v.pnum = m[5]; v.name = `${m[1]} ${m[2].slice(0, 3)} ${m[3]} · ${m[4]} ${m[5]}`;
}));

/* =========================================================
   FIGURE LIBRARY for diagnostic questions
   Every drawing uses currentColor / CSS variables so it works
   in light mode, dark mode and colour-blind mode.
   ========================================================= */
const FG = (() => {
  const r1 = n => Math.round(n * 10) / 10;
  const sv = (w, h, body, label) => `<svg class="qsvg fig" viewBox="0 0 ${r1(w)} ${r1(h)}" role="img" aria-label="${label.replace(/"/g, '')}">${body}</svg>`;
  const T = (x, y, s, o = {}) => `<text x="${r1(x)}" y="${r1(y)}" text-anchor="${o.a || 'middle'}" class="sl${o.sm ? ' sm' : ''}${o.acc ? ' acc' : ''}"${o.rot ? ` transform="rotate(${o.rot} ${r1(x)} ${r1(y)})"` : ''}>${s}</text>`;
  const Ln = (x1, y1, x2, y2, o = {}) => `<line x1="${r1(x1)}" y1="${r1(y1)}" x2="${r1(x2)}" y2="${r1(y2)}" stroke="currentColor" stroke-width="${o.w || 2.5}"${o.dash ? ' stroke-dasharray="6 5"' : ''}${o.arrow ? ' marker-end="url(#fgArr)"' : ''}/>`;
  const PL = (pts, o = {}) => `<polygon points="${pts.map(p => r1(p[0]) + ',' + r1(p[1])).join(' ')}" fill="${o.fill || 'var(--svgfill)'}" stroke="currentColor" stroke-width="${o.w || 2.5}"${o.dash ? ' stroke-dasharray="6 5"' : ''}/>`;
  const PATH = (d, o = {}) => `<path d="${d}" fill="${o.fill || 'none'}" stroke="currentColor" stroke-width="${o.w || 2.5}"${o.dash ? ' stroke-dasharray="6 5"' : ''}/>`;
  const ARR = `<defs><marker id="fgArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>`;
  const rad = d => d * Math.PI / 180;
  const NOTE = s => s ? `<p class="small mut center" style="margin:-6px 0 12px">${s}</p>` : '';
  const nd = '<p class="small mut center" style="margin:-8px 0 12px">Not drawn accurately</p>';

  /* ---------- number machine ---------- */
  function machine(ops, inp = '', out = '') {
    const bw = 74, gap = 22, n = ops.length + 2, w = n * bw + (n - 1) * gap + 8;
    let s = ARR, x = 4;
    const cells = [{ t: inp, lab: 'INPUT' }, ...ops.map(o => ({ t: o, op: 1 })), { t: out, lab: 'OUTPUT' }];
    cells.forEach((c, i) => {
      if (c.lab) s += `<text x="${x + bw / 2}" y="18" text-anchor="middle" class="sl" style="font-size:15px">${c.lab}</text>`;
      s += `<rect x="${x}" y="26" width="${bw}" height="56" rx="${c.op ? 6 : 12}" fill="${c.op ? 'var(--svgfill)' : 'none'}" stroke="currentColor" stroke-width="3"/>`;
      s += `<text x="${x + bw / 2}" y="62" text-anchor="middle" class="sl${c.op ? '' : ' acc'}" style="font-size:${String(c.t).length > 5 ? 19 : 23}px">${c.t}</text>`;
      if (i < cells.length - 1) s += Ln(x + bw + 2, 54, x + bw + gap - 2, 54, { w: 3, arrow: 1 });
      x += bw + gap;
    });
    return sv(w, 90, s, 'Number machine: input ' + (inp || 'blank') + ', ' + ops.join(', then ') + ', output ' + (out || 'blank'));
  }

  /* ---------- general polygon with labels ----------
     pts: [[x,y],...] in any units (auto-scaled)
     o.v: vertex letters, o.s: {i: side label for side i→i+1}, o.a: {i: angle label}, o.r: [right-angle vertices],
     o.ext: {i: label} exterior angle (extends side i-1→i beyond i), o.tick: [side indexes with equal marks], o.extra: svg  */
  function poly(pts, o = {}) {
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    const mnx = Math.min(...xs), mxx = Math.max(...xs), mny = Math.min(...ys), mxy = Math.max(...ys);
    const sc = (o.size || 240) / Math.max(mxx - mnx, (mxy - mny) * 1.25, 1), pad = 56, padL = o.ext ? 110 : 56;
    const P = pts.map(p => [padL + (p[0] - mnx) * sc, pad + (p[1] - mny) * sc]);
    const W = (mxx - mnx) * sc + pad + padL + (o.ext ? 30 : 0), H = (mxy - mny) * sc + 2 * pad;
    const cx = P.reduce((a, p) => a + p[0], 0) / P.length, cy = P.reduce((a, p) => a + p[1], 0) / P.length;
    let s = PL(P, { fill: o.fill });
    const n = P.length;
    (o.v || []).forEach((l, i) => { if (!l) return; const [x, y] = P[i], dx = x - cx, dy = y - cy, d = Math.hypot(dx, dy) || 1; s += T(x + dx / d * 18, y + dy / d * 18 + 5, l); });
    Object.entries(o.s || {}).forEach(([i, l]) => { i = +i; const a = P[i], b = P[(i + 1) % n], mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2; let nx = -(b[1] - a[1]), ny = b[0] - a[0]; const d = Math.hypot(nx, ny) || 1; nx /= d; ny /= d; if ((mx + nx - cx) ** 2 + (my + ny - cy) ** 2 < (mx - cx) ** 2 + (my - cy) ** 2) { nx = -nx; ny = -ny; } s += T(mx + nx * 14, my + ny * 14 + 5 + (ny > 0.5 ? 6 : 0), l, { acc: 1, a: nx > 0.45 ? 'start' : nx < -0.45 ? 'end' : 'middle' }); });
    Object.entries(o.a || {}).forEach(([i, l]) => { i = +i; const [x, y] = P[i], a = P[(i + n - 1) % n], b = P[(i + 1) % n]; const ua = [a[0] - x, a[1] - y], ub = [b[0] - x, b[1] - y]; const la = Math.hypot(...ua), lb = Math.hypot(...ub); const bx = ua[0] / la + ub[0] / lb, by = ua[1] / la + ub[1] / lb, bd = Math.hypot(bx, by) || 1; const ang = Math.acos(Math.max(-1, Math.min(1, (ua[0] * ub[0] + ua[1] * ub[1]) / la / lb))); const rr = ang < 0.6 ? 46 : ang < 1.1 ? 36 : 30; const r0 = 18; s += PATH(`M${r1(x + ua[0] / la * r0)},${r1(y + ua[1] / la * r0)} A${r0},${r0} 0 0,${(ua[0] * ub[1] - ua[1] * ub[0]) > 0 ? 1 : 0} ${r1(x + ub[0] / lb * r0)},${r1(y + ub[1] / lb * r0)}`, { w: 1.6 }); s += T(x + bx / bd * (rr + 4), y + by / bd * (rr + 4) + 5, l, { sm: String(l).length > 7 }); });
    (o.r || []).forEach(i => { const [x, y] = P[i], a = P[(i + n - 1) % n], b = P[(i + 1) % n]; const ua = [(a[0] - x), (a[1] - y)], ub = [(b[0] - x), (b[1] - y)]; const la = Math.hypot(...ua), lb = Math.hypot(...ub), k = 14; const p1 = [x + ua[0] / la * k, y + ua[1] / la * k], p3 = [x + ub[0] / lb * k, y + ub[1] / lb * k], p2 = [p1[0] + ub[0] / lb * k, p1[1] + ub[1] / lb * k]; s += `<polyline points="${r1(p1[0])},${r1(p1[1])} ${r1(p2[0])},${r1(p2[1])} ${r1(p3[0])},${r1(p3[1])}" fill="none" stroke="currentColor" stroke-width="1.6"/>`; });
    (o.tick || []).forEach(i => { const a = P[i], b = P[(i + 1) % n], mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2; let nx = -(b[1] - a[1]), ny = b[0] - a[0]; const d = Math.hypot(nx, ny); nx /= d; ny /= d; s += Ln(mx - nx * 7, my - ny * 7, mx + nx * 7, my + ny * 7, { w: 2 }); });
    Object.entries(o.ext || {}).forEach(([i, l]) => { i = +i; const p = P[i], q = P[(i + n - 1) % n]; const ux = p[0] - q[0], uy = p[1] - q[1], d = Math.hypot(ux, uy); const e = [p[0] + ux / d * 60, p[1] + uy / d * 60]; s += Ln(p[0], p[1], e[0], e[1], { dash: 1, w: 2 }); const b = P[(i + 1) % n]; const vx = (ux / d + (b[0] - p[0]) / Math.hypot(b[0] - p[0], b[1] - p[1])), vy = (uy / d + (b[1] - p[1]) / Math.hypot(b[0] - p[0], b[1] - p[1])), vd = Math.hypot(vx, vy) || 1; s += T(p[0] + vx / vd * 30, p[1] + vy / vd * 30 + 5, l, { acc: 1 }); });
    if (o.extra) s += o.extra(P);

/* ---------- Play ---------- */
function play() {
  const q = sess.q, m = sess.cfg.mode, f = sess.fb, exam = m === 'exam';
  const M = MODES.find(x => x.id === m) || { n: sess.cfg.cat === 'Exam' ? 'Exam challenge' : 'Daily practice' };
  let hud = `<div class="hud"><button class="x" data-act="quit" aria-label="Quit">${ic('x', 20)}</button><div style="flex:1;min-width:0">`;
  if (exam) hud += `<div class="row between"><b>${TIERS[sess.cfg.tier].name} paper</b><span class="timer" id="timer" aria-label="Time left">${clock(sess.time)}</span></div>`;
  else if (sess.len !== Infinity) hud += `<div class="row between small"><b>${M.n}</b><span>${Math.min(sess.i + 1, sess.len)} of ${sess.len}</span></div><div class="bar"><i style="width:${sess.i / sess.len * 100}%"></i></div>`;
  else hud += `<div class="row between"><b>${M.n}</b>${m === 'time' ? `<span class="timer" id="timer">${clock(sess.time)}</span>` : ''}<span class="small">${sess.correct} correct</span></div>`;
  hud += `</div>${!exam && sess.combo >= 2 ? `<span class="combo">${ic('flame', 16)}${sess.combo}</span>` : ''}</div>`;
  let boss = '';
  if (m === 'boss') { const c = CAT(sess.cfg.cat); boss = `<div class="boss ${sess.bossHit ? 'hit' : ''}"><span class="tic dark">${ic('swords', 22)}</span><div style="flex:1"><div class="row between"><b>${c.boss}</b><span class="lives">${[0, 1, 2].map(i => ic('heart', 18, i < sess.lives ? 'full' : '')).join('')}</span></div><div class="hp" role="progressbar" aria-label="Boss health" aria-valuenow="${sess.hp}" aria-valuemin="0" aria-valuemax="100"><i style="width:${sess.hp}%"></i></div><div class="small">Health ${sess.hp}/100</div></div></div>`; sess.bossHit = false; }
  const dots = exam ? `<div class="qdots" role="group" aria-label="Questions">${sess.qs.map((_, i) => `<button data-act="ejump" data-arg="${i}" class="${sess.ans[i] != null ? 'done' : ''} ${i === sess.i ? 'cur' : ''}" aria-label="Question ${i + 1}${sess.ans[i] != null ? ', answered' : ''}">${i + 1}</button>`).join('')}</div>` : '';
  const tags = sess.cfg.diag ? `<div class="row wrapf tags"><span class="count">${q.marks} mark${q.marks > 1 ? 's' : ''}</span></div>` : `<div class="row wrapf tags"><span class="count">${q.topicName}</span><span class="count">${q.tierLabel}</span><span class="count">Grade ${q.g}</span>${stars(q.g)}${exam ? `<span class="count">${q.marks || marksFor(q.g)} mark${(q.marks || marksFor(q.g)) > 1 ? 's' : ''}</span>` : ''}</div>`;
  return `<main class="wrapx playw">${hud}${boss}${dots}
  <article class="card qcard">${tags}<div class="qtext" id="qtext">${exam ? `<b>${sess.i + 1}.</b> ` : ''}${q.text}</div>${q.svg || ''}
  ${answerUI(q, f, exam)}<div id="msg" class="small mut" role="alert" style="min-height:1.2em;margin-top:6px"></div>
  ${!f && !exam ? toolsUI(q, m) : ''}
  ${exam ? `<div class="row" style="margin-top:12px;gap:10px"><button class="btn sec" data-act="eprev" ${sess.i === 0 ? 'disabled' : ''}>${ic('back', 16)} Back</button><button class="btn" style="flex:1" data-act="${sess.i === sess.qs.length - 1 ? 'esubmit' : 'enext'}">${sess.i === sess.qs.length - 1 ? 'Finish and mark' : 'Save and next'}</button></div><button class="btn sec full" style="margin-top:10px" data-act="esubmit">Hand in paper (${sess.ans.filter(a => a != null).length} of ${sess.qs.length} answered)</button>` : ''}
  </article>${f ? feedbackUI(q, f, m) : ''}</main>`;
}
function answerUI(q, f, exam) {
  if (q.kind === 'mc') return `<div class="opts" role="group" aria-label="Answer options">${q.options.map((o, i) => { let cls = ''; if (f) { if (o.ok) cls = 'right'; else if (f.mc === i) cls = 'wrong'; } else if (exam && sess.ans[sess.i] === i) cls = 'sel'; return `<button class="opt ${cls}" data-act="mc" data-arg="${i}" ${f ? 'disabled' : ''} ${i === 0 && !f ? 'data-autofocus' : ''} aria-label="Option ${i + 1}"><span class="k">${String.fromCharCode(65 + i)}</span><span class="ot">${o.t}</span>${f && o.ok ? ic('check', 20) : ''}${f && !o.ok && f.mc === i ? ic('x', 20) : ''}</button>`; }).join('')}</div>`;
  const prev = exam ? sess.ans[sess.i] : null, dis = f ? 'disabled' : '';
  const keys = { frac: ['−', '/', ' '], sf: ['×10^', '−', '.'], ratio: [':'], num: ['−', '.'], multi: ['−', '/'] }[q.kind] || [];
  const keyRow = !f ? `<div class="keys">${keys.map(k => `<button type="button" data-act="key" data-arg="${esc(k)}" aria-label="Insert ${k === ' ' ? 'space' : k}">${k === ' ' ? 'space' : k}</button>`).join('')}${exam ? '' : `<button type="button" class="btn ok" data-act="submit" style="margin-left:auto">Check</button>`}</div>` : '';
  if (q.kind === 'multi') return `<div class="ansbox">${q.fields.map((fl, i) => `<label class="ans"><span>${fl.label}</span><input id="f${i}" data-field="${i}" inputmode="text" autocomplete="off" ${dis} ${i === 0 ? 'data-autofocus' : ''} value="${f ? esc(f.input[i]) : prev ? esc(prev[i]) : ''}"></label>`).join('')}</div>${keyRow}`;
  return `<label class="ans ansbox">${q.pre ? `<span>${q.pre}</span>` : ''}<input id="ans" inputmode="${q.kind === 'num' ? 'decimal' : 'text'}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${{ frac: 'e.g. 3/4', sf: 'e.g. 3.4 x 10^5', ratio: 'e.g. 2:3', num: 'Your answer' }[q.kind]}" ${dis} data-autofocus value="${f ? esc(f.input) : prev != null ? esc(prev) : ''}" aria-label="Your answer">${q.unit ? `<span>${q.unit}</span>` : ''}</label>${keyRow}`;
}
function toolsUI(q, m) {
  const a = sess.assist, lastStep = q.steps.length - 1, noSol = ['survival', 'boss', 'time'].includes(m);
  let out = `<div class="tools"><button data-act="hint" ${a.hint ? 'aria-pressed="true"' : ''}>${ic('bulb', 18)} Hint</button>${lastStep >= 1 ? `<button data-act="steps" ${a.steps >= lastStep ? 'disabled' : ''}>${ic('list', 18)} Step${a.steps ? ` ${a.steps}/${lastStep}` : 's'}</button>` : `<button data-act="relearn" data-arg="${q.topic}">${ic('book', 18)} Lesson</button>`}<button data-act="sol" ${noSol ? 'disabled title="Not available in this mode"' : ''}>${ic('eye', 18)} Solution</button></div>`;
  if (a.hint) out += `<div class="callout">${ic('bulb', 18)}<div>${q.hint}</div></div>`;

}
function feedbackUI(q, f, m) {

  const method = `<div class="fbsec"><h4>Method</h4><ol>${q.steps.map(s => `<li>${s}</li>`).join('')}</ol><div>Answer: <b>${answerHTML(q)}</b></div></div>`;
  const mis = `<div class="fbsec"><h4>Watch out for</h4><ul>${[...(q.mis || []), ...t.mis].slice(0, 3).map(x => `<li>${x}</li>`).join('')}</ul></div>`;
  if (f.ok) return `<section class="fb good" role="status" aria-live="polite"><div class="row between"><h3>${ic('check', 22)} ${P(PRAISE)}</h3><span class="count">+${f.gain} XP</span></div>
    ${sess.combo >= 3 ? `<p class="small">${sess.combo} in a row — XP ×${sess.combo >= 10 ? 3 : sess.combo >= 5 ? 2 : 1.5}</p>` : ''}${f.note ? `<p>${f.note}</p>` : ''}${m === 'boss' ? `<p>Hit — the boss loses ${sess.combo >= 3 ? 35 : 25} health.</p>` : ''}

  if (f.learned) return `<section class="fb info" role="status"><h3>${ic('eye', 22)} Worked solution</h3><p>Reading the method carefully is how it sticks. Try a similar one straight after.</p>${method}${mis}
    <div class="grid2"><button class="btn" data-act="similar">${ic('repeat', 18)} Try a similar one</button><button class="btn sec" id="nextBtn" data-act="next">${nextLbl}</button></div></section>`;

  return `<section class="fb oops" role="status" aria-live="polite"><h3>${P(KIND)}</h3>
    ${m === 'boss' ? `<p>The boss hits back — you lose a life.</p>` : ''}
    <div class="fbsec"><h4>What went wrong</h4><p style="margin:0">${why}</p></div>${method}${mis}
    ${m === 'survival' ? `<p>That ends the run on <b>${sess.correct}</b> in a row.</p>` : ''}
    ${m !== 'exam' ? `<button class="btn sec full" data-act="relearn" data-arg="${q.topic}">${ic('book', 18)} Go back over the ${t.name} lesson</button>` : ''}
    <div class="grid2" style="margin-top:10px">${m !== 'survival' ? `<button class="btn" data-act="similar">${ic('repeat', 18)} Try a similar one</button>` : ''}<button class="btn ${m === 'survival' ? '' : 'sec'}" id="nextBtn" data-act="next" style="${m === 'survival' ? 'grid-column:1/-1' : ''}">${nextLbl}</button></div></section>`;
}

/* ---------- Results ---------- */
function results() {
  const s = sess, m = s.cfg.mode, acc = s.n ? Math.round(s.correct / s.n * 100) : 0, sm = summary(s.cfg.tier);
  let head = '';
  if (m === 'exam') { const e = s.exam; head = `<h1 class="pageh">Paper marked</h1><div class="grid3 statrow"><div><div class="big">${e.grade < 1 ? 'U' : e.grade}</div><div class="small mut">Estimated grade</div></div><div><div class="big">${e.got}/${e.tot}</div><div class="small mut">Marks</div></div><div><div class="big">${e.pct}%</div><div class="small mut">Score</div></div></div><p class="small mut">Grade boundaries are approximate, based on typical AQA papers. Use this as a guide.</p>`; }
  else if (m === 'boss') head = s.won ? `<h1 class="pageh">You beat ${CAT(s.cfg.cat).boss}</h1><p>Bonus XP and 50 coins added.</p>` : `<h1 class="pageh">${CAT(s.cfg.cat).boss} got away</h1><p>You did ${100 - s.hp} damage. Go over the topics below and try again.</p>`;
  else if (m === 'survival') head = `<h1 class="pageh">Run over: ${s.correct} in a row</h1><p class="mut">Your best is ${S.survivalBest}.</p>`;

  const weakT = {}; s.log.forEach(l => { if (!l.ok) weakT[l.q.topic] = 1; });
  const review = m === 'exam' ? `<article class="card"><h2>Review your paper</h2>${s.review.map((r, i) => `<details class="acc2"><summary><b>Q${i + 1}</b> ${r.ok ? ic('check', 16) : ic('x', 16)} ${r.q.topicName} · ${r.ok ? r.mk : 0}/${r.mk}</summary><div style="margin-top:8px">${r.q.text}</div>${r.q.svg || ''}<p class="small">Your answer: <b>${r.a == null ? 'not answered' : r.q.kind === 'mc' ? r.q.options[r.a].t : Array.isArray(r.a) ? esc(r.a.join(', ')) : esc(r.a)}</b> · Correct: <b>${answerHTML(r.q)}</b></p><ol>${r.q.steps.map(x => `<li>${x}</li>`).join('')}</ol></details>`).join('')}</article>` : '';
  return `${header()}<main class="wrapx"><article class="card">${head}
    <div class="grid3 statrow"><div><div class="big">+${s.xp}</div><div class="small mut">XP</div></div><div><div class="big">+${s.coins}</div><div class="small mut">Coins</div></div><div><div class="big">${acc}%</div><div class="small mut">${s.correct} of ${s.n} right</div></div></div>
    ${s.maxCombo >= 3 ? `<p class="small">Best run this round: ${s.maxCombo} in a row.</p>` : ''}
    <p>Grade estimate (${TIERS[s.cfg.tier].name}): <b>${gradeTxt(sm.cur)}</b>. If you fix your weakest topics: <b>${gradeTxt(sm.proj)}</b>.</p>
    ${Object.keys(weakT).length ? `<div class="small mut">Go over these again</div><div class="row wrapf" style="margin-top:6px">${Object.keys(weakT).map(id => `<button class="pillbtn" data-act="lesson" data-arg="${id}">${ic('book', 14)} ${TOPIC(id).name}</button>`).join('')}</div>` : ''}
    <div class="grid2" style="margin-top:16px"><button class="btn" data-act="again">${ic('repeat', 18)} Play again</button><button class="btn sec" data-act="nav" data-arg="home">Home</button></div></article>${review}</main>`;
}
function progress() {
  const s = summary(), T = TIERS[S.tier];
  const byCat = CATS.filter(c => c.id !== 'Exam').map(c => ({ c, ts: s.list.filter(x => x.t.cat === c.id) })).filter(x => x.ts.length);
  const improve = [...s.weak, ...s.untried].slice(0, 4);
  return `${header()}<main class="wrapx"><h1 class="pageh">Progress</h1>${tierSeg()}
  <article class="card" style="margin-top:16px"><div class="grid3 statrow"><div><div class="big">${gradeTxt(s.cur)}</div><div class="small mut">Current grade</div></div><div><div class="big">${gradeTxt(s.proj)}</div><div class="small mut">If you fix 3 weak topics</div></div><div><div class="big">${s.prog}%</div><div class="small mut">Topics covered</div></div></div>
   <div class="grid3 statrow"><div><div class="big sm">${S.answered}</div><div class="small mut">Answered</div></div><div><div class="big sm">${S.answered ? Math.round(S.correct / S.answered * 100) : 0}%</div><div class="small mut">Accuracy</div></div><div><div class="big sm">${Object.keys(S.lessons || {}).length}</div><div class="small mut">Lessons done</div></div></div>
   <p class="small mut">The grade comes from how many you get right, how hard those questions were (each one is labelled with a GCSE grade) and how many topics you've covered.${S.tier === 'F' ? ' Foundation tops out at grade 5.' : ''}</p></article>

function exHTML(ex, shown, key) {

}
function lessonView() {
  const t = TOPIC(les.id), L = LESSONS[les.id], card = les.cards[les.i], n = les.cards.length;
  const names = { intro: 'The idea', how: 'How to do it', ex: 'Worked example', ex2: 'Worked example 2', wr: 'Common mistake', gap: 'Your turn', check: 'Check', done: 'Done' };

  let body = '', canNext = true;
  if (card === 'intro') body = `<article class="card"><div class="kicker">${t.cat}</div><h1 class="pageh" style="margin-top:4px">${t.name}</h1><p class="lead dark">${L.big}</p></article>

    <div class="grid2">${L.pg !== '—' ? `<article class="card">${meta('book', `<b>Revision guide</b>`)}<p class="small mut" style="margin:6px 0 0">Open your guide at page${/[–,]/.test(L.pg) ? 's' : ''} ${L.pg} and follow along.</p></article>` : ''}<article class="card">${meta('video', '<b>Prefer a video?</b>')}<p class="small mut" style="margin:6px 0 10px">Corbettmaths explains this in a few minutes.</p><a class="lnk" href="${ytLink(L.yt)}" target="_blank" rel="noopener">Watch on YouTube ${ic('arrow', 16)}</a></article></div>`;
  else if (card === 'how') body = `<article class="card"><h2>How to do it</h2><p class="small mut">Same steps every time.</p><ol class="method">${L.how.map(h => `<li>${h}</li>`).join('')}</ol></article>`;
  else if (card === 'ex') { body = exHTML(L.ex, les.step, 'ex'); canNext = les.step >= L.ex.s.length; }
  else if (card === 'ex2') { body = exHTML(L.ex2, les.step2, 'ex2'); canNext = les.step2 >= L.ex2.s.length; }
  else if (card === 'wr') body = `<article class="card"><h2>Spot the mistake</h2><div class="wr bad">${ic('x', 18)}<div><b>Wrong:</b> ${L.wr.wrong}</div></div><div class="wr good">${ic('check', 18)}<div><b>Right:</b> ${L.wr.right}</div></div><p><b>Why?</b> ${L.wr.why}</p></article>
    <details class="card acc" open><summary>Other things to watch out for ${ic('chev', 18)}</summary><ul>${t.mis.map(m => `<li>${m}</li>`).join('')}</ul></details>`;
  else if (card === 'gap') { const g = L.gap, done = les.gap && les.gap.ok;
    body = `<article class="card"><h2>Your turn</h2><p class="small mut">Most of the working is done. Find the number that goes in the box.</p><h3>${g.q}</h3><ol class="steps">${g.lines.map(l => `<li>${l.replace('▢', '<span class="gapbox">?</span>')}</li>`).join('')}</ol>
      <label class="ans ansbox"><span>? =</span><input id="gapin" inputmode="decimal" autocomplete="off" ${done ? 'disabled' : ''} data-autofocus value="${les.gap ? esc(les.gap.v) : ''}" aria-label="Missing number"></label>
      ${!done ? `<button class="btn ok full" style="margin-top:10px" data-act="lgap">Check</button>` : ''}
      ${les.gap ? `<div class="wr ${les.gap.ok ? 'good' : 'bad'}" role="status">${ic(les.gap.ok ? 'check' : 'x', 18)}<div>${les.gap.ok ? `${P(PRAISE)} It's <b>${fmt(g.a)}</b>.` : `Not quite — look at the line just above the box.${les.gap.tries >= 2 ? ` It's <b>${fmt(g.a)}</b> — can you see why?` : ''}`}</div></div>` : ''}</article>`;
    canNext = done || (les.gap && les.gap.tries >= 2); }
  else if (card === 'check') { const q = les.qc[les.qi], f = les.qfb;
    body = `<article class="card"><div class="row between"><h2 style="margin:0">Check you've got it</h2><span class="count">${les.qi + 1} of 3</span></div><p class="small mut">Easier ones first. Use "Show me how" if you get stuck.</p><div class="qtext">${q.text}</div>${q.svg || ''}${checkInput(q, f)}
      ${!f ? `<div class="tools two"><button data-act="lhint">${ic('bulb', 18)} Hint</button><button data-act="lshow">${ic('eye', 18)} Show me how</button></div>${les.qh ? `<div class="callout">${ic('bulb', 18)}<div>${q.hint}</div></div>` : ''}` : ''}
      ${f ? `<section class="fb ${f.ok ? 'good' : f.shown ? 'info' : 'oops'}"><h3>${f.ok ? ic('check', 22) + ' ' + P(PRAISE) : f.shown ? 'Here\'s how' : P(KIND)}</h3>${f.why && !f.ok ? `<p>${f.why}</p>` : ''}<div class="fbsec"><h4>Method</h4><ol>${q.steps.map(s => `<li>${s}</li>`).join('')}</ol><div>Answer: <b>${answerHTML(q)}</b></div></div></section>` : ''}</article>`;
    canNext = !!f; }
  else if (card === 'done') { const nx = nextLesson(les.id);
    body = `<section class="band small"><div class="wrapx center"><div class="badge-pill">${ic('check', 16)} Lesson done</div><h1 class="hero sm">${t.name}</h1><p class="lead">Check questions: ${les.qok} of 3. Now practise — that's what makes it stick.</p></div>${zig}</section>
      <div class="grid2"><button class="btn ok" data-act="lpractise" data-arg="quick" data-autofocus>${ic('zap', 18)} Practise 5</button><button class="btn" data-act="lpractise" data-arg="mastery">${ic('target', 18)} Mastery 20</button></div>
      ${nx ? `<article class="card" style="margin-top:16px"><div class="kicker">Next lesson</div><h3>${nx.name}</h3><p class="small mut">${LESSONS[nx.id].big}</p><div class="cardfoot">${lnk('lesson', nx.id, 'Start')}</div></article>` : ''}
      <button class="btn sec full" data-act="topic" data-arg="${t.id}">Back to ${t.name}</button>`; canNext = false; }
  const label = card === 'check' ? (les.qi < 2 ? 'Next question' : 'Finish lesson') : card === 'gap' && !canNext ? 'Try the box first' : (card === 'ex' || card === 'ex2') && !canNext ? 'Show all the steps first' : 'Next';
  const nav = card !== 'done' ? `<div class="row navrow">${les.i > 0 ? `<button class="btn sec" data-act="lprev">${ic('back', 16)} Back</button>` : ''}<button class="btn" style="flex:1" data-act="lnext" ${canNext ? '' : 'disabled'}>${label} ${canNext ? ic('arrow', 18) : ''}</button></div>` : '';

function checkInput(q, f) {
  if (q.kind === 'mc') return `<div class="opts">${q.options.map((o, i) => `<button class="opt ${f ? (o.ok ? 'right' : f.mc === i ? 'wrong' : '') : ''}" data-act="lmc" data-arg="${i}" ${f ? 'disabled' : ''} ${i === 0 && !f ? 'data-autofocus' : ''}><span class="k">${String.fromCharCode(65 + i)}</span><span class="ot">${o.t}</span></button>`).join('')}</div>`;
  const dis = f ? 'disabled' : '';
  const boxes = q.kind === 'multi' ? q.fields.map((fl, i) => `<label class="ans"><span>${fl.label}</span><input id="lf${i}" data-lfield="${i}" ${dis} ${i === 0 ? 'data-autofocus' : ''} value="${f && f.input ? esc(f.input[i] || '') : ''}"></label>`).join('')
    : `<label class="ans">${q.pre ? `<span>${q.pre}</span>` : ''}<input id="lans" ${dis} data-autofocus inputmode="${q.kind === 'num' ? 'decimal' : 'text'}" autocomplete="off" placeholder="${{ frac: 'e.g. 3/4', sf: 'e.g. 3.4 x 10^5', ratio: 'e.g. 2:3' }[q.kind] || 'Your answer'}" value="${f && f.input ? esc(f.input) : ''}">${q.unit ? `<span>${q.unit}</span>` : ''}</label>`;
  return `<div class="ansbox">${boxes}</div>${!f ? `<button class="btn ok full" style="margin-top:10px" data-act="lcheck">Check</button>` : ''}`;
}

document.getElementById('nav').innerHTML = `<div>${[['home', 'home', 'Home'], ['learn', 'book', 'Lessons'], ['challenge', 'cal', '5-day plan'], ['progress', 'chart', 'Progress'], ['settings', 'sliders', 'Settings']].map(([a, i, l]) => `<button data-act="nav" data-arg="${a}">${ic(i, 22)}<span>${l}</span></button>`).join('')}</div>`;

<script>/* =========================================================

MODES.unshift({ id: 'diag', n: 'Diagnostic test', i: '', d: 'Timed AQA or Eduqas test that sets targets', c: '' });
MODE_IC.diag = 'chart';
const LETTERS = 'ABCDEF';

function diagPick() {
  const tier = vp.tier || (S.tier === 'H' ? 'H' : 'F'), board = vp.board || S.diagBoard || 'AQA';
  const past = id => (S.diags || []).filter(d => d.vid === id);

  const order = Object.keys(groups).sort((a, b) => groups[b][0].sort - groups[a][0].sort);
  const seg = (act, opts, cur, label) => `<div class="seg" role="group" aria-label="${label}">${opts.map(([k, n]) => `<button data-act="${act}" data-arg="${k}" aria-pressed="${cur === k}">${n}</button>`).join('')}</div>`;
  return `${header()}<main class="wrapx">${backBtn('nav', 'home', 'Home')}<h1 class="pageh">Diagnostic test</h1>
  <p class="lead dark">A timed test built from real AQA and Eduqas past papers. It shows which grade you're working at, how you did in each area of maths, and the topics to work on next.</p>

    <div>${meta('target', 'Same questions as the real paper, with the numbers changed')}${meta('clock', 'Timed at exam pace. Extra time can be added at the end if you have it')}${meta('chart', 'Marked instantly, and sent to your teacher')}</div>
    <div><label class="small mut" for="dname">Your full name (required)</label><label class="ans" style="margin-top:6px"><input id="dname" autocomplete="name" placeholder="e.g. Sam Khan" value="${esc(S.diagName || '')}"></label>

  </div></article>
  <div class="center" style="margin:6px 0 8px"><div class="small mut" style="margin-bottom:6px">Exam board</div>${seg('dboard', [['AQA', 'AQA'], ['Eduqas', 'Eduqas']], board, 'Exam board')}</div>

    <div class="cardfoot">${lnk('dstart', v.id, 'Start test')}${p.length ? lnk('dopen', (S.diags || []).lastIndexOf(last), 'Last report') : ''}</div></article>`; }).join('')}</div>`).join('')}
  <article class="card note"><div><b>Teacher tip:</b> give students sitting next to each other different papers, and use a different paper for the re-test so nobody has seen the questions before.</div></article></main>`;
}

function startDiag(id) {
  const n = document.getElementById('dname'), g = document.getElementById('dgroup');
  S.diagName = n ? n.value.trim() : S.diagName || ''; S.diagGroup = g ? g.value.trim() : S.diagGroup || ''; save();
  if (!S.diagName) { toast('', 'Type your full name first, so your teacher knows whose test it is.'); if (n) n.focus(); return; }
  const v = diagVariant(id); start({ mode: 'exam', tier: v.id[0], diag: id });
}

function diagReport(rep) {
  const v = diagVariant(rep.vid), tierMax = rep.tier === 'F' ? 5 : 9, w = rep.grade;
  const target = rep.tier === 'F' ? Math.min(5, Math.max(1, w + 1)) : Math.min(9, Math.max(4, w + 1));
  const topics = Object.entries(rep.topics).map(([id, x]) => ({ id, ...x }));
  const priority = topics.filter(x => x.got < x.tot).sort((a, b) => a.minG - b.minG || (b.tot - b.got) - (a.tot - a.got)).slice(0, 5);
  const strong = topics.filter(x => x.got === x.tot && x.tot > 0).sort((a, b) => b.tot - a.tot).slice(0, 5);
  let advice = '';
  if (rep.tier === 'F' && w >= 5) advice = 'Working at the top of Foundation — worth trying a Higher variant.';
  else if (rep.tier === 'H' && w <= 3) advice = 'Higher looks hard right now — a Foundation variant may give a fairer picture.';
  return { v, target, priority, strong, advice, tierMax };
}
function diagRes() {
  const rep = (S.diags || [])[vp.i]; if (!rep) return home();
  const { v, target, priority, strong, advice } = diagReport(rep);
  const bars = Object.entries(rep.strands).filter(([, x]) => x.tot).map(([k, x]) => { const p = Math.round(x.got / x.tot * 100); return `<div class="rowline" style="display:block"><div class="row between"><b>${k}</b><span class="small">${x.got}/${x.tot} · ${p}%</span></div><span class="bar thin"><i style="width:${p}%;background:${p >= 70 ? 'var(--ok)' : p >= 40 ? 'var(--amber)' : 'var(--bad)'}"></i></span></div>`; }).join('');
  const review = v.items.map((it, i) => { const q = diagQ(it), r = rep.items[i]; return `<details class="acc2"><summary><b>${i + 1}.</b> ${r.got === it.m ? ic('check', 16) : ic('x', 16)} ${TOPIC(it.t).name} · ${r.got}/${it.m} <span class="small mut">(${v.model.split('·')[1].trim()} ${it.src})</span></summary><div style="margin-top:8px">${q.text}</div>${q.svg || ''}<p class="small">Answer given: <b>${r.a == null || r.a === '' ? 'none' : esc(r.a)}</b> · Correct: <b>${answerHTML(q)}</b></p><p class="small mut">${it.w || ''}</p></details>`; }).join('');
  return `${header()}<main class="wrapx">${backBtn('nav', 'progress', 'Progress')}
  <h1 class="pageh">Diagnostic report</h1><p class="mut">${rep.name ? `<b>${esc(rep.name)}</b> · ` : ''}${TIERS[rep.tier].name} ${v.name} (mirrors ${v.model}) · ${rep.date} · time used ${fmtTime(rep.secs)} of ${diagMinutes(v)} min</p>
