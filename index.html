<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3A10E5">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet">
<meta name="description" content="MathsQuest — learn, practise and test every AQA GCSE Maths topic, Foundation and Higher, with a 5-day revision plan.">
<title>MathsQuest — GCSE Maths Revision in 5 Days</title>
<style>:root{--cream:#FFF0E5;--surface:#fff;--ink:#0F172A;--text:#1F2937;--mut:#5B6475;--line:#000;--brand:#3A10E5;--brand-d:#2A08B3;--brand-50:#EDE8FF;--amber:#E87A00;--amber-ink:#3B1F04;--ok:#15803D;--okbg:#DCFCE7;--bad:#C2410C;--badbg:#FFEDD5;--info:#3A10E5;--infobg:#EDE8FF;--pop:3px 3px 0 var(--line);--pop2:5px 5px 0 var(--line);--r:12px;--font:"DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body.dark{--cream:#17142B;--surface:#221E3F;--ink:#F5F3FF;--text:#E7E4F7;--mut:#B3ADD1;--line:#000;--brand-50:#2E2760;--okbg:#123524;--badbg:#3D2312;--infobg:#2E2760}
body.cb{--ok:#1D4ED8;--okbg:#DBEAFE;--bad:#C2410C;--badbg:#FFEDD5}
*{box-sizing:border-box}html{font-size:100%;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--text);font-family:var(--font);line-height:1.55;-webkit-font-smoothing:antialiased}
body.dys{--font:"Comic Sans MS","Comic Neue","Lexend","Verdana",sans-serif;letter-spacing:.04em;word-spacing:.12em;line-height:1.8}
button,input{font:inherit;color:inherit}button{cursor:pointer}
a{color:var(--brand);font-weight:700}
:focus-visible{outline:3px solid var(--amber)!important;outline-offset:3px}
.i{flex:none;vertical-align:middle}
.wrapx{max-width:980px;margin:0 auto;padding:0 18px}
main.wrapx{padding-bottom:110px}
.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.wrapf{flex-wrap:wrap}.center{text-align:center}
.grid2{display:grid;gap:18px;grid-template-columns:1fr}.grid3{display:grid;gap:14px;grid-template-columns:1fr 1fr}
@media(min-width:700px){.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)}}
h1,h2,h3{color:var(--ink);line-height:1.15;letter-spacing:-.01em;font-weight:800;margin:.2em 0 .45em}
h2{font-size:1.35rem}h3{font-size:1.12rem}
.pageh{font-size:clamp(1.9rem,5vw,2.6rem);font-weight:900;margin:14px 0 8px}
.sect{font-size:1.5rem;font-weight:900;margin:34px 0 14px}
.mut{color:var(--mut)}.small{font-size:.9rem}.block{display:block}
.lead{font-size:1.12rem;max-width:620px;margin:12px auto 0}.lead.dark{margin:12px 0 18px;color:var(--text)}
/* header + strip */
.topbar{background:var(--cream);border-bottom:2px solid var(--line);position:sticky;top:0;z-index:30}
.topbar .wrapx{height:60px}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;font-size:1.25rem;color:var(--ink);font-weight:500}
.logo b{font-weight:900}.mark{width:32px;height:32px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;border:2px solid var(--line)}
.stats{gap:6px}.stat{display:inline-flex;align-items:center;gap:4px;font-weight:700;padding:6px 8px;border-radius:8px;background:none;border:0;color:var(--ink)}
.lvl{background:var(--ink);color:var(--cream);padding:2px 8px;border-radius:6px;font-size:.85rem}
.btn-ghost:hover{background:var(--brand-50)}
@media(max-width:420px){.hide-s{display:none}}
.strip{background:var(--amber);color:var(--amber-ink);border-bottom:2px solid var(--line);font-size:.9rem}
.strip .wrapx{min-height:40px;padding-top:6px;padding-bottom:6px}
.tag{border:2px solid var(--amber-ink);border-radius:999px;padding:0 8px;font-weight:900;font-size:.72rem;letter-spacing:.06em;background:#FFE7C7;white-space:nowrap}
.tagbtn{margin-left:auto;background:var(--amber-ink);color:#FFE7C7;border:0;border-radius:999px;padding:4px 12px;font-weight:700;font-size:.82rem;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
/* hero band */
.band{position:relative;background-color:var(--brand);background-image:radial-gradient(rgba(255,255,255,.18) 1px,transparent 1.2px);background-size:20px 20px;color:#fff;padding:46px 0 64px;margin-bottom:26px}
.band.small{padding:30px 0 50px;border-radius:var(--r);margin:0 0 18px;border:2px solid var(--line)}
.band .zig{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:22px}
.band.small .zig{display:none}
.hero{color:#fff;font-size:clamp(2.4rem,8vw,4.4rem);font-weight:900;line-height:1.02;margin:16px 0 6px;letter-spacing:-.02em}.hero.sm{font-size:clamp(2rem,6vw,3rem)}
.hl{background:linear-gradient(transparent 58%,#B4793F 58%,#B4793F 90%,transparent 90%);padding:0 4px}
.badge-pill{display:inline-flex;align-items:center;gap:8px;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:6px 16px;font-weight:700;font-size:.9rem;box-shadow:var(--pop)}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
.chipx{display:inline-flex;align-items:center;gap:6px;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:8px 14px;font-size:.9rem;font-weight:500;box-shadow:var(--pop)}
.chipx .i,.meta .i,.tic .i{color:var(--brand)}
/* segmented tier control (like the venue/city tabs) */
.seg{display:inline-flex;gap:4px;background:var(--brand);border:2px solid var(--line);border-radius:999px;padding:4px}
.seg button{border:0;background:transparent;color:#fff;border-radius:999px;padding:8px 18px;font-weight:700;font-size:.95rem;min-height:40px}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--brand)}
/* cards */
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:18px;box-shadow:var(--pop2)}
.grid2>.card,.grid3>.card{margin-bottom:0}
.card.hov{transition:transform .12s,box-shadow .12s}.card.hov:hover{transform:translate(-1px,-2px);box-shadow:6px 7px 0 var(--line)}
.card.focus{outline:3px solid var(--brand);outline-offset:-2px}
.card.note{display:flex;gap:14px;align-items:center;justify-content:space-between;background:var(--brand-50)}
.kicker{font-size:.75rem;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--brand)}
.meta{display:flex;align-items:center;gap:10px;margin:8px 0;font-weight:700;color:var(--ink);font-size:.97rem}
.cardfoot{border-top:1px solid #E5E0D8;margin-top:16px;padding-top:12px;display:flex;align-items:center;justify-content:space-between}
body.dark .cardfoot{border-color:#3a3460}
.lnk{background:none;border:0;padding:4px 0;color:var(--brand);font-weight:700;display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:.97rem}
body.dark .lnk,body.dark a{color:#B9A8FF}
.lnk:hover{text-decoration:underline}
.count{display:inline-flex;align-items:center;background:var(--brand-50);color:var(--brand);border-radius:999px;padding:2px 10px;font-weight:800;font-size:.8rem;white-space:nowrap}
body.dark .count{color:#CFC4FF}
.tic{width:40px;height:40px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;background:var(--brand-50);flex:none}
.tic.dark{background:var(--ink);}.tic.dark .i{color:var(--cream)}
.statrow{text-align:left;margin:6px 0 4px}.big{font-size:2.3rem;font-weight:900;color:var(--ink);line-height:1.1}.big.sm{font-size:1.6rem}
.bar{height:10px;background:var(--brand-50);border:2px solid var(--line);border-radius:999px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--brand);transition:width .5s}
.bar.thin{height:8px;border-width:1.5px;margin-top:6px;display:block}
.pillbtn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:8px;padding:6px 12px;font-weight:700;font-size:.9rem;box-shadow:var(--pop);color:var(--ink)}
.pillbtn.on{background:var(--brand);color:#fff}.pillbtn[disabled]{opacity:.45;box-shadow:none}
/* tiles (modes) */
.tile{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:18px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:var(--pop);transition:transform .1s,box-shadow .1s;color:var(--ink)}
.tile:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--line)}.tile:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.tile .tic{margin-bottom:6px}.tile b{font-size:1.05rem}.tile small{color:var(--mut)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 20px;border-radius:10px;border:2px solid var(--line);background:var(--brand);color:#fff;font-weight:700;font-size:1.02rem;box-shadow:var(--pop);transition:transform .08s,box-shadow .08s;text-decoration:none}
.btn:hover{background:var(--brand-d)}.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.btn.sec{background:var(--surface);color:var(--ink)}.btn.sec:hover{background:var(--brand-50)}
.btn.ok{background:var(--ok);color:#fff}
.btn.full{width:100%;margin-top:12px}.btn.sm{min-height:40px;padding:6px 14px;font-size:.92rem}
.btn[disabled]{opacity:.45;pointer-events:none;box-shadow:none}
a.btn{color:inherit}a.btn:not(.sec){color:#fff}
/* rows */
.rowbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid #E5E0D8;padding:12px 2px;color:var(--text)}
body.dark .rowbtn,body.dark .rowline{border-color:#3a3460}
.rowbtn:hover{background:var(--brand-50)}.rowbtn .sym{width:34px;height:34px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:.85rem;flex:none;background:var(--surface);color:var(--brand)}
.rowbtn>span:nth-child(2){flex:1;min-width:0}
.rowline{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid #E5E0D8;padding:10px 0}
/* accordion */
details.acc summary{list-style:none;display:flex;justify-content:space-between;align-items:center;font-weight:800;color:var(--ink);cursor:pointer;min-height:28px}
details.acc summary::-webkit-details-marker{display:none}details.acc[open] summary .i{transform:rotate(180deg)}
details.acc{padding:16px 20px}details.acc ul{margin:10px 0 0}
details.acc2{border-top:1px solid #E5E0D8;padding:10px 0}details.acc2 summary{cursor:pointer;font-weight:700}
/* play */
.playw{max-width:760px;padding-top:14px}
.hud{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.x{width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;box-shadow:var(--pop);flex:none;color:var(--ink)}
.combo{display:inline-flex;align-items:center;gap:3px;font-weight:900;color:var(--amber)}
.timer{font-weight:900;font-variant-numeric:tabular-nums}.timer.low{color:var(--bad)}
.qcard{padding:24px}.tags{gap:6px}
.dots5{display:inline-flex;gap:3px;margin-left:2px}.dots5 i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line);background:transparent}.dots5 i.on{background:var(--brand)}
.qtext{font-size:1.28rem;font-weight:500;color:var(--ink);margin:16px 0}.qtext small{display:block;color:var(--mut);font-size:.9rem;margin-top:6px}.qtext .big{font-size:1.45rem;margin:8px 0}
.qsvg{width:100%;max-width:360px;display:block;margin:4px auto 14px;color:var(--ink)}
.sl{fill:currentColor;font:700 15px var(--font)}.sl.sm{font-size:13.5px}.sl.acc{fill:var(--brand)}
:root{--svgfill:#EDE8FF;--acc:#3A10E5}body.dark{--svgfill:#2E2760;--acc:#B9A8FF}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;font-size:.95em}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 3px}.fr>span:last-child{padding:0 3px}
.sq>span{border-top:2px solid currentColor;padding:0 2px;margin-left:1px}
table.qt{border-collapse:collapse;margin:12px 0;font-size:.95rem;min-width:60%;background:var(--surface)}.qt th,.qt td{border:2px solid var(--line);padding:7px 12px;text-align:center}.qt th{background:var(--brand-50)}
.ansbox{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.ans{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:4px 14px;font-size:1.25rem;font-weight:700;box-shadow:var(--pop);min-width:0}
.ans:focus-within{box-shadow:0 0 0 3px var(--brand-50),var(--pop)}
.ans input{flex:1;min-width:0;border:0;background:transparent;padding:10px 2px;outline:none;color:var(--ink)}
.ans span{font-size:1rem;color:var(--mut);white-space:nowrap}
.ans input:focus-visible{outline:none!important}
.keys{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0;align-items:center}
.keys button:not(.btn){min-width:50px;min-height:42px;border-radius:8px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:1rem;box-shadow:var(--pop);color:var(--ink)}
.opts{display:grid;gap:12px}@media(min-width:600px){.opts{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;min-height:60px;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-size:1.1rem;font-weight:500;box-shadow:var(--pop);color:var(--ink);transition:transform .08s,box-shadow .08s}
.opt:hover:not([disabled]){background:var(--brand-50)}.opt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.opt .k{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--ink);color:var(--cream);font-size:.85rem;font-weight:800;flex:none}
.opt .ot{flex:1}.opt.right{background:var(--okbg);border-color:var(--ok)}.opt.right .i{color:var(--ok)}.opt.wrong{background:var(--badbg)}.opt.wrong .i{color:var(--bad)}.opt.sel{background:var(--brand-50);outline:3px solid var(--brand)}
.opt[disabled]{cursor:default}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.tools.two{grid-template-columns:1fr 1fr}
.tools button{min-height:46px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:.9rem;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink)}
.tools button:hover:not([disabled]){background:var(--brand-50)}.tools button[disabled]{opacity:.4}
.callout{display:flex;gap:10px;margin-top:12px;padding:12px 14px;border-radius:10px;background:#FFF7E8;border:2px solid var(--line)}
body.dark .callout{background:#2B2440}
.callout .i{color:var(--amber);margin-top:2px}.callout ol{margin:6px 0 0;padding-left:20px}
.fb{margin-top:18px;border-radius:var(--r);padding:20px;border:2px solid var(--line);box-shadow:var(--pop2)}
.fb.good{background:var(--okbg)}.fb.oops{background:var(--badbg)}.fb.info{background:var(--infobg)}
.fb h3{display:flex;align-items:center;gap:8px;margin:0 0 8px}.fb.good h3 .i{color:var(--ok)}
.fbsec{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:12px 16px;margin:12px 0}
.fbsec h4{margin:0 0 6px;font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--brand)}
.fbsec ol,.fbsec ul{margin:4px 0;padding-left:20px}
.boss{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r);background:var(--surface);border:2px solid var(--line);box-shadow:var(--pop);margin-bottom:14px}
.boss.hit{animation:shake .4s}.lives{display:flex;gap:2px;color:var(--bad)}.lives .full{fill:currentColor}
.hp{height:12px;background:var(--badbg);border:2px solid var(--line);border-radius:999px;overflow:hidden;margin:6px 0 2px}.hp>i{display:block;height:100%;background:var(--bad);transition:width .5s}
.qdots{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}.qdots button{width:36px;height:36px;border-radius:8px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:.85rem;color:var(--ink)}
.qdots .done{background:var(--brand);color:#fff}.qdots .cur{outline:3px solid var(--amber);outline-offset:1px}
/* lessons */
ol.steps{list-style:none;padding:0;margin:14px 0;display:grid;gap:10px;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:12px 14px 12px 50px;border:2px solid var(--line);border-radius:10px;background:var(--surface);animation:pop .25s}
ol.steps li::before{content:counter(s);position:absolute;left:12px;top:11px;width:26px;height:26px;border-radius:7px;background:var(--brand-50);color:var(--brand);font-weight:900;display:grid;place-items:center;font-size:.85rem}
.why{display:block;color:var(--mut);font-size:.9rem;margin-top:2px}
ol.method{padding:0;list-style:none;counter-reset:m;display:grid;gap:10px}
ol.method li{counter-increment:m;display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid #E5E0D8;font-size:1.05rem}
ol.method li::before{content:counter(m);flex:none;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--brand);color:#fff;font-weight:900;border:2px solid var(--line)}
.answerline{display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:10px;background:var(--okbg);border:2px solid var(--line)}.answerline .i{color:var(--ok)}
.wr{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;border:2px solid var(--line);margin:10px 0}.wr.bad{background:var(--badbg)}.wr.bad .i{color:var(--bad)}.wr.good{background:var(--okbg)}.wr.good .i{color:var(--ok)}
.gapbox{display:inline-grid;place-items:center;min-width:34px;padding:0 6px;border:2px dashed var(--amber);border-radius:6px;color:var(--amber);font-weight:900}
.navrow{gap:10px;margin:6px 0 20px}
/* plan */
.day{display:flex;gap:16px;align-items:flex-start}
.daynum{width:46px;height:46px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;font-weight:900;font-size:1.2rem;flex:none;background:var(--brand-50);color:var(--brand)}
.daynum.done{background:var(--ok);color:#fff}
.task{display:flex;align-items:center;gap:10px;margin:8px 0}
.tick{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;border:2px solid var(--line);flex:none;background:var(--surface)}.tick.y{background:var(--ok);color:#fff}
/* badges */
.bdg{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px;border-radius:var(--r);background:var(--surface);border:2px solid var(--line);box-shadow:var(--pop);color:var(--ink)}
.bdg .i{color:var(--amber)}.bdg.lock{opacity:.5;box-shadow:none}.bdg.lock .i{color:var(--mut)}
/* settings */
.toggle{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-top:1px solid #E5E0D8}.toggle:first-child{border-top:0}
.sw{width:58px;height:34px;border-radius:999px;border:2px solid var(--line);background:var(--brand-50);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);border:2px solid var(--line);transition:.15s}
.sw[aria-checked=true]{background:var(--brand)}.sw[aria-checked=true]::after{left:27px}
/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:2px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav[hidden]{display:none}.nav>div{display:grid;grid-template-columns:repeat(5,1fr);max-width:760px;width:100%;gap:4px}
.nav button{border:0;background:none;padding:6px 2px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:700;color:var(--mut);min-height:54px}
.nav button[aria-current=page]{color:var(--brand);background:var(--brand-50)}
/* toasts & misc */
.toasts{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:12px 14px;font-weight:700;box-shadow:var(--pop);animation:drop .3s,fade .4s 3.2s forwards;display:flex;gap:10px;align-items:center}.toast .i{color:var(--amber)}
.conf{position:fixed;top:-10px;width:8px;height:12px;z-index:90;pointer-events:none;animation:fall 1.5s linear forwards}
.shake{animation:shake .4s}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.modegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}

<script>/* =========================================================
   GCSE MATHS QUEST — QUESTION ENGINE
   Every question is generated fresh from templates, with
   hints, step-by-step working, common-mistake "traps" and
   an estimated GCSE grade (1–9).
   ========================================================= */
const R = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const P = a => a[Math.floor(Math.random() * a.length)];
const NZ = (a, b) => { let v; do { v = R(a, b); } while (v === 0); return v; };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; };
const lcm = (a, b) => Math.abs(a * b) / gcd(a, b);
const rnd = (x, dp = 0) => { const m = 10 ** dp; return Math.round(x * m + (x >= 0 ? 1e-9 : -1e-9)) / m; };
const DEG = Math.PI / 180;
const sum = a => a.reduce((s, x) => s + x, 0);

function fmt(x, dp) {
  if (dp != null) return Number(rnd(x, dp)).toFixed(dp).replace(/^-/, '−');
  let s;
  if (Number.isInteger(x) && Math.abs(x) >= 10000) s = x.toLocaleString('en-GB');
  else s = String(rnd(x, 6));
  return s.replace(/^-/, '−');
}
const money = x => '£' + Number(rnd(x, 2)).toFixed(2);
const sup = n => `<sup>${String(n).replace('-', '−')}</sup>`;
function simp(n, d) { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return [n / g, d / g]; }
function fr(n, d, keep) {
  if (!keep) [n, d] = simp(n, d);
  if (d === 1) return fmt(n);
  return `${n < 0 ? '−' : ''}<span class="fr"><span>${Math.abs(n)}</span><span>${d}</span></span>`;
}
function mixed(n, d) {
  [n, d] = simp(n, d);
  if (d === 1 || Math.abs(n) < d) return fr(n, d);
  const w = Math.trunc(n / d), r = Math.abs(n % d);
  return `${fr(n, d)} = ${fmt(w)}${fr(r, d)}`;
}
const sq = n => `<span class="sq">√<span>${n}</span></span>`;
const surd = (a, b) => `${a === 1 ? '' : a}${sq(b)}`;
const cop = d => { let n; do { n = R(1, d - 1); } while (gcd(n, d) !== 1); return n; };
function term(c, v, first) {
  if (c === 0) return '';
  const a = Math.abs(c), body = (v && a === 1 ? '' : a) + v;
  if (first) return (c < 0 ? '−' : '') + body;
  return ` ${c < 0 ? '−' : '+'} ${body}`;
}
function poly(terms) { let out = '', first = true; for (const [c, v] of terms) { if (c === 0) continue; out += term(c, v, first); first = false; } return out || '0'; }
const br = (terms) => `(${poly(terms)})`;
const X2 = 'x²', X3 = 'x³';
const sgn = n => (n < 0 ? `− ${Math.abs(n)}` : `+ ${n}`);
const neg = n => (n < 0 ? `(−${Math.abs(n)})` : `${n}`);
function tbl(head, rows) {
  return `<table class="qt"><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
const dpTxt = dp => `<small>Give your answer to ${dp} decimal place${dp > 1 ? 's' : ''}.</small>`;
function Q(o) { return Object.assign({ kind: 'num', steps: [], mis: [], traps: [] }, o); }
function MC(correct, wrongs) {
  const seen = new Set([correct]); const opts = [{ t: correct, ok: true }];
  for (const w of wrongs) { if (w && !seen.has(w.t)) { seen.add(w.t); opts.push({ t: w.t, ok: false, why: w.why }); } }
  return shuffle(opts);
}

/* ---------- SVG helpers (all use currentColor so they theme) ---------- */
function svgRightTri(L) { // L: {opp, adj, hyp, ang}
  return `<svg class="qsvg" viewBox="0 0 300 220" role="img" aria-label="Right-angled triangle">
  <polygon points="50,30 50,180 260,180" fill="var(--svgfill)" stroke="currentColor" stroke-width="3"/>
  <polyline points="50,162 68,162 68,180" fill="none" stroke="currentColor" stroke-width="2"/>
  ${L.ang ? `<path d="M 222 180 A 38 38 0 0 0 228 160" fill="none" stroke="var(--acc)" stroke-width="3"/><text x="196" y="172" class="sl acc">${L.ang}</text>` : ''}
  <text x="40" y="110" text-anchor="end" class="sl">${L.opp || ''}</text>
  <text x="155" y="205" text-anchor="middle" class="sl">${L.adj || ''}</text>
  <text x="165" y="95" class="sl">${L.hyp || ''}</text></svg>`;
}
function svgL(W, H, w, h) {
  const s = 200 / Math.max(W, H), x0 = 40, y0 = 20, Ws = W * s, Hs = H * s, ws = w * s, hs = h * s;
  return `<svg class="qsvg" viewBox="0 0 300 250" role="img" aria-label="L-shaped compound shape">
  <polygon points="${x0},${y0} ${x0 + Ws - ws},${y0} ${x0 + Ws - ws},${y0 + hs} ${x0 + Ws},${y0 + hs} ${x0 + Ws},${y0 + Hs} ${x0},${y0 + Hs}" fill="var(--svgfill)" stroke="currentColor" stroke-width="3"/>
  <text x="${x0 + Ws / 2}" y="${y0 + Hs + 20}" text-anchor="middle" class="sl">${W} cm</text>
  <text x="${x0 - 8}" y="${y0 + Hs / 2}" text-anchor="end" class="sl">${H} cm</text>
  <text x="${x0 + Ws - ws + ws / 2}" y="${y0 + hs - 6}" text-anchor="middle" class="sl acc">${w} cm</text>
  <text x="${x0 + Ws - ws - 6}" y="${y0 + hs / 2 + 5}" text-anchor="end" class="sl acc">${h} cm</text></svg>`;
}
function svgBox(plots, lo, hi, step) {
  const X = v => 30 + (v - lo) / (hi - lo) * 260; let y = 20, out = '';
  for (const p of plots) {
    out += `${p.label ? `<text x="4" y="${y + 22}" class="sl sm">${p.label}</text>` : ''}
    <line x1="${X(p.min)}" y1="${y + 18}" x2="${X(p.q1)}" y2="${y + 18}" stroke="currentColor" stroke-width="2"/>
    <line x1="${X(p.q3)}" y1="${y + 18}" x2="${X(p.max)}" y2="${y + 18}" stroke="currentColor" stroke-width="2"/>
    <line x1="${X(p.min)}" y1="${y + 8}" x2="${X(p.min)}" y2="${y + 28}" stroke="currentColor" stroke-width="2"/>
    <line x1="${X(p.max)}" y1="${y + 8}" x2="${X(p.max)}" y2="${y + 28}" stroke="currentColor" stroke-width="2"/>
    <rect x="${X(p.q1)}" y="${y}" width="${X(p.q3) - X(p.q1)}" height="36" fill="var(--svgfill)" stroke="currentColor" stroke-width="2"/>
    <line x1="${X(p.med)}" y1="${y}" x2="${X(p.med)}" y2="${y + 36}" stroke="var(--acc)" stroke-width="3"/>`;
    y += 56;
  }
  let ax = `<line x1="30" y1="${y}" x2="290" y2="${y}" stroke="currentColor" stroke-width="2"/>`;
  for (let v = lo; v <= hi; v += step) ax += `<line x1="${X(v)}" y1="${y}" x2="${X(v)}" y2="${y + 6}" stroke="currentColor"/><text x="${X(v)}" y="${y + 20}" text-anchor="middle" class="sl sm">${v}</text>`;
  for (let v = lo; v <= hi; v += step / 2) ax += `<line x1="${X(v)}" y1="${y}" x2="${X(v)}" y2="${y + 3}" stroke="currentColor"/>`;
  return `<svg class="qsvg" viewBox="0 0 300 ${y + 30}" role="img" aria-label="Box plot">${out}${ax}</svg>`;
}
function svgVenn(a, c, b, n, la, lb) {
  return `<svg class="qsvg" viewBox="0 0 300 200" role="img" aria-label="Venn diagram: only ${la} ${a}, both ${c}, only ${lb} ${b}, neither ${n}">
  <rect x="5" y="5" width="290" height="190" rx="10" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="14" y="26" class="sl sm">ξ</text>
  <circle cx="115" cy="105" r="70" fill="var(--svgfill)" stroke="currentColor" stroke-width="2.5"/>
  <circle cx="185" cy="105" r="70" fill="var(--svgfill)" stroke="currentColor" stroke-width="2.5"/>
  <text x="80" y="35" text-anchor="middle" class="sl sm acc">${la}</text><text x="220" y="35" text-anchor="middle" class="sl sm acc">${lb}</text>
  <text x="85" y="112" text-anchor="middle" class="sl">${a}</text><text x="150" y="112" text-anchor="middle" class="sl">${c}</text>
  <text x="215" y="112" text-anchor="middle" class="sl">${b}</text><text x="270" y="185" text-anchor="middle" class="sl">${n}</text></svg>`;
}
function svgMachine(steps) {
  const w = 300 / (steps.length + 2);
  let s = `<svg class="qsvg" viewBox="0 0 300 70" role="img" aria-label="Function machine">`;
  const lab = ['Input', ...steps, 'Output'];
  lab.forEach((t, i) => {
    const x = 4 + i * w;
    s += `<rect x="${x}" y="15" width="${w - 14}" height="40" rx="8" fill="${i === 0 || i === lab.length - 1 ? 'none' : 'var(--svgfill)'}" stroke="currentColor" stroke-width="2"/><text x="${x + (w - 14) / 2}" y="40" text-anchor="middle" class="sl sm">${t}</text>`;
    if (i < lab.length - 1) s += `<text x="${x + w - 9}" y="41" text-anchor="middle" class="sl sm">→</text>`;
  });
  return s + '</svg>';
}

/* =========================================================
   TOPICS
   ========================================================= */
const CATS = [
  { id: 'Number', icon: '🔢', color: '#8b6cff', boss: 'The Fraction Golem', bossIcon: '🗿' },
  { id: 'Algebra', icon: '🧪', color: '#18c3ff', boss: 'The Algebra Hydra', bossIcon: '🐉' },
  { id: 'Geometry', icon: '📐', color: '#ffb020', boss: 'The Geometry Titan', bossIcon: '🤖' },
  { id: 'Statistics', icon: '📊', color: '#ff5c8a', boss: 'The Stats Kraken', bossIcon: '🐙' },
  { id: 'Exam', icon: '🏆', color: '#2ee59d', boss: 'The Examiner', bossIcon: '👹', name: 'Exam Challenge' },
];

const TOPICS = [
/* ======================== NUMBER ======================== */
{ id: 'fractions', name: 'Fractions', cat: 'Number', icon: '½',
  learn: ['The bottom number (denominator) is how many equal parts. The top (numerator) is how many you have.', 'To <b>add or subtract</b>, make the denominators the same first, then add the tops.', 'To <b>multiply</b>: top × top and bottom × bottom.', 'To <b>divide</b>: Keep the first, Flip the second, Change ÷ to × (KFC).', 'Always simplify: divide top and bottom by their highest common factor.'],
  mis: ['Adding tops AND bottoms — ½ + ⅓ is NOT 2/5.', 'Forgetting to change mixed numbers into improper fractions before multiplying or dividing.', 'Not simplifying the final answer.'],
  v: [
  { g: 1, f() { const d = P([3, 4, 5, 8, 10]), n = cop(d), amt = d * R(2, 12), one = amt / d, ans = one * n;
    return Q({ text: `Work out ${fr(n, d)} of ${amt}`, answer: ans, hint: `Find ${fr(1, d)} first by dividing ${amt} by ${d}.`,
      steps: [`Divide by the bottom number: ${amt} ÷ ${d} = ${one}`, `Multiply by the top number: ${one} × ${n} = <b>${ans}</b>`],
      traps: n > 1 ? [{ v: one, why: `You found ${fr(1, d)} of ${amt}, which is ${one}. You need ${n} lots of that.` }] : [] }); } },
  { g: 2, f() { let b, d; do { b = R(2, 9); d = R(2, 9); } while (b === d); const a = cop(b), c = cop(d), L = lcm(b, d), A = a * L / b, C = c * L / d; const [n, m] = simp(A + C, L);
    return Q({ kind: 'frac', text: `Work out ${fr(a, b)} + ${fr(c, d)}<br><small>Give your answer as a fraction in its simplest form.</small>`, answer: [n, m],
      hint: `Find a number that both ${b} and ${d} go into. ${L} works!`,
      steps: [`Common denominator: ${L}`, `${fr(a, b)} = ${fr(A, L, 1)} and ${fr(c, d)} = ${fr(C, L, 1)}`, `Add the tops: ${fr(A, L, 1)} + ${fr(C, L, 1)} = ${fr(A + C, L, 1)}`, `Simplify: <b>${mixed(n, m)}</b>`],
      traps: [{ v: (a + c) / (b + d), why: 'You added the tops and the bottoms. Only add the numerators once the denominators match.' }] }); } },
  { g: 3, f() { const b = R(2, 9), d = R(3, 9), a = cop(b), c = cop(d);
    if (Math.random() < .5) { const [n, m] = simp(a * c, b * d);
      return Q({ kind: 'frac', text: `Work out ${fr(a, b)} × ${fr(c, d)}<br><small>Simplest form.</small>`, answer: [n, m], hint: 'Multiply the tops together, then the bottoms together.',
        steps: [`Tops: ${a} × ${c} = ${a * c}`, `Bottoms: ${b} × ${d} = ${b * d}`, `${fr(a * c, b * d, 1)} simplifies to <b>${fr(n, m)}</b>`],
        traps: [{ v: (a * d) / (b * c), why: 'You flipped a fraction. Flipping is only for dividing.' }] }); }
    const [n, m] = simp(a * d, b * c);
    return Q({ kind: 'frac', text: `Work out ${fr(a, b)} ÷ ${fr(c, d)}<br><small>Simplest form.</small>`, answer: [n, m], hint: 'Keep the first fraction, Flip the second, Change ÷ to ×.',
      steps: [`Keep, Flip, Change: ${fr(a, b)} × ${fr(d, c, 1)}`, `Tops: ${a} × ${d} = ${a * d}. Bottoms: ${b} × ${c} = ${b * c}`, `${fr(a * d, b * c, 1)} = <b>${mixed(n, m)}</b>`],
      traps: [{ v: (a * c) / (b * d), why: 'You multiplied straight across. For division, flip the second fraction first.' }] }); } },
  { g: 4, f() { const b = R(2, 6), d = R(2, 6), a = cop(b), c = cop(d), w1 = R(2, 5), w2 = R(1, 3); const sub = Math.random() < .5 && (w1 + a / b) > (w2 + c / d) + 0.1;
    const N1 = w1 * b + a, N2 = w2 * d + c, L = lcm(b, d), A = N1 * L / b, C = N2 * L / d, res = sub ? A - C : A + C; const [n, m] = simp(res, L);
    return Q({ kind: 'frac', text: `Work out ${w1}${fr(a, b)} ${sub ? '−' : '+'} ${w2}${fr(c, d)}<br><small>Give your answer as a mixed number or a fraction.</small>`, answer: [n, m],
      hint: 'Change both to improper (top-heavy) fractions first: whole × bottom + top.',
      steps: [`Improper fractions: ${w1}${fr(a, b)} = ${fr(N1, b, 1)} and ${w2}${fr(c, d)} = ${fr(N2, d, 1)}`, `Common denominator ${L}: ${fr(A, L, 1)} ${sub ? '−' : '+'} ${fr(C, L, 1)}`, `= ${fr(res, L, 1)} → <b>${mixed(n, m)}</b>`],
      traps: [{ v: (sub ? w1 - w2 : w1 + w2) + (sub ? (a - c) / Math.abs(b - d || 1) : (a + c) / (b + d)), why: 'It looks like the fraction parts were combined without a common denominator.' }] }); } },
  { g: 5, f() { const b = R(2, 5), d = R(2, 5), a = cop(b), c = cop(d), w1 = R(1, 4), w2 = R(1, 3), N1 = w1 * b + a, N2 = w2 * d + c; const [n, m] = simp(N1 * d, b * N2);
    return Q({ kind: 'frac', text: `Work out ${w1}${fr(a, b)} ÷ ${w2}${fr(c, d)}<br><small>Give your answer as a fraction or mixed number in its simplest form.</small>`, answer: [n, m],
      hint: 'Make them improper fractions, then Keep, Flip, Change.',
      steps: [`Improper: ${fr(N1, b, 1)} ÷ ${fr(N2, d, 1)}`, `Keep, Flip, Change: ${fr(N1, b, 1)} × ${fr(d, N2, 1)}`, `= ${fr(N1 * d, b * N2, 1)} → <b>${mixed(n, m)}</b>`],
      traps: [{ v: (N1 * N2) / (b * d), why: 'You multiplied instead of dividing — remember to flip the second fraction.' }] }); } },
  ] },

{ id: 'decimals', name: 'Decimals', cat: 'Number', icon: '0.5',
  learn: ['Multiplying by 10, 100, 1000 moves digits 1, 2, 3 places to the <b>left</b> (number gets bigger).', 'To multiply decimals: ignore the points, multiply, then put back the total number of decimal places.', 'To divide by a decimal: multiply both numbers by 10 (or 100) until you divide by a whole number.', 'Rounding: look at the next digit — 5 or more rounds up.'],
  mis: ['Thinking 0.3 × 0.4 = 1.2 (it is 0.12 — count the decimal places).', 'Moving the decimal point the wrong way when dividing by 10 or 100.', 'Rounding by chopping the digits off instead of looking at the next digit.'],
  v: [
  { g: 1, f() { const x = R(11, 999) / 10, p = P([10, 100, 1000]), mul = Math.random() < .5, ans = rnd(mul ? x * p : x / p, 6);
    return Q({ text: `Work out ${fmt(x)} ${mul ? '×' : '÷'} ${p}`, answer: ans, hint: `${mul ? 'Multiplying' : 'Dividing'} by ${p} moves each digit ${String(p).length - 1} place${p > 10 ? 's' : ''} to the ${mul ? 'left' : 'right'}.`,
      steps: [`${p} has ${String(p).length - 1} zero${p > 10 ? 's' : ''}, so move the digits ${String(p).length - 1} place${p > 10 ? 's' : ''}`, `${fmt(x)} ${mul ? '×' : '÷'} ${p} = <b>${fmt(ans)}</b>`],
      traps: [{ v: rnd(mul ? x / p : x * p, 6), why: `You moved the digits the wrong way. ${mul ? 'Multiplying makes the number bigger.' : 'Dividing makes the number smaller.'}` }] }); } },
  { g: 2, f() { const a = P([R(2, 9) / 10, R(11, 49) / 10]), b = R(2, 9) / 10, ans = rnd(a * b, 4), dps = (String(a).split('.')[1] || '').length + 1;
    return Q({ text: `Work out ${fmt(a)} × ${fmt(b)}`, answer: ans, hint: 'Multiply without the decimal points, then count how many decimal places there were altogether.',
      steps: [`Ignore the points: ${rnd(a * 10 ** (dps - 1), 0)} × ${rnd(b * 10, 0)} = ${rnd(a * b * 10 ** dps, 0)}`, `Total decimal places in the question: ${dps}`, `So the answer is <b>${fmt(ans)}</b>`],
      traps: [{ v: rnd(ans * 10, 4), why: 'The decimal point is one place out. Count the decimal places in BOTH numbers.' }] }); } },
  { g: 2, f() { const x = R(1000, 99999) / 1000, dp = P([1, 2]), ans = rnd(x, dp);
    return Q({ text: `Round ${x.toFixed(3)} to ${dp} decimal place${dp > 1 ? 's' : ''}.`, answer: ans, dp, hint: `Look at digit number ${dp + 1} after the point. 5 or more → round up.`,
      steps: [`Keep ${dp} digit${dp > 1 ? 's' : ''} after the point, look at the next one: ${x.toFixed(3)[x.toFixed(3).indexOf('.') + dp + 1]}`, `So ${x.toFixed(3)} ≈ <b>${ans.toFixed(dp)}</b>`],
      traps: [{ v: Math.trunc(x * 10 ** dp) / 10 ** dp, why: 'You chopped off the digits instead of rounding. Check the next digit — 5 or more rounds up.' }] }); } },
  { g: 3, f() { const b = R(2, 9) / 10, ans = R(2, 15), a = rnd(ans * b, 4);
    return Q({ text: `Work out ${fmt(a)} ÷ ${fmt(b)}`, answer: ans, hint: 'Multiply both numbers by 10 so you are dividing by a whole number.',
      steps: [`× 10 both: ${fmt(rnd(a * 10, 3))} ÷ ${fmt(rnd(b * 10, 2))}`, `= <b>${ans}</b>`],

  { g: 4, f() { const A = R(2, 9), B = R(2, 9) * 10, C = P([0.5, 0.2, 0.4]); const a = rnd(A + P([-0.3, -0.2, 0.1, 0.2, 0.3]) + R(0, 9) / 100, 2), b = rnd(B + P([-3, -2, -1, 1, 2, 3]) + R(1, 9) / 10, 1), c = rnd(C + P([-0.02, -0.01, 0.01, 0.02]), 2); const ans = rnd(A * B / C, 4);

      traps: [{ v: rnd(A * B * C, 4), why: `You multiplied by ${C} instead of dividing. Dividing by a number less than 1 makes it bigger.` }] }); } },
  ] },

{ id: 'percentages', name: 'Percentages', cat: 'Number', icon: '%',
  learn: ['"Per cent" means "out of 100". 10% = ÷10, 1% = ÷100.', 'Multipliers are quick: increase by 15% → × 1.15. Decrease by 15% → × 0.85.', 'Percentage change = change ÷ original × 100.', 'Reverse percentage: divide by the multiplier to get back to the original.', 'Compound interest: original × multiplier<sup>years</sup>.'],
  mis: ['Dividing by the new amount instead of the original in percentage change.', 'In reverse percentages, taking the percentage off the new price (it does not undo it).', 'Using simple interest when the question says compound.'],
  v: [
  { g: 1, f() { const p = P([10, 20, 25, 50, 5, 15, 30, 75]), y = R(2, 30) * 20, ans = p * y / 100;
    return Q({ text: `Find ${p}% of ${y}`, answer: ans, hint: '10% = ÷ 10. 1% = ÷ 100. Build up from there.', steps: [`1% of ${y} = ${fmt(y / 100)}`, `${p}% = ${fmt(y / 100)} × ${p} = <b>${fmt(ans)}</b>`],
      traps: [{ v: y / p, why: `You divided by ${p}. To find ${p}%, divide by 100 then multiply by ${p}.` }] }); } },
  { g: 3, f() { const y = R(4, 40) * 10, p = P([5, 10, 12, 15, 20, 25, 30, 35, 40]), up = Math.random() < .5, m = up ? 1 + p / 100 : 1 - p / 100, ans = rnd(y * m, 2);
    return Q({ text: `${up ? 'Increase' : 'Decrease'} £${y} by ${p}%`, answer: ans, pre: '£', hint: `Use a multiplier: ${up ? '100% + ' : '100% − '}${p}% = ${rnd(m * 100, 2)}% = ${fmt(m)}`,
      steps: [`Multiplier = ${fmt(m)}`, `£${y} × ${fmt(m)} = <b>${money(ans)}</b>`],
      traps: [{ v: rnd(y * p / 100, 2), why: `£${fmt(y * p / 100)} is just the ${p}%. You still need to ${up ? 'add it on' : 'take it away'}.` }] }); } },
  { g: 4, f() { const o = R(4, 20) * 10, p = P([5, 10, 15, 20, 25, 30, 40, 50, 60]), up = Math.random() < .5, n = rnd(o * (up ? 1 + p / 100 : 1 - p / 100), 2), ch = Math.abs(n - o);
    return Q({ text: `A price changes from £${fmt(o)} to £${fmt(n)}.<br>Work out the percentage ${up ? 'increase' : 'decrease'}.`, answer: p, unit: '%', hint: 'Percentage change = change ÷ ORIGINAL × 100',
      steps: [`Change = ${fmt(ch)}`, `${fmt(ch)} ÷ ${fmt(o)} = ${fmt(ch / o)}`, `× 100 = <b>${p}%</b>`],
      traps: [{ v: rnd(ch / n * 100, 1), why: 'You divided by the new price. Always divide by the ORIGINAL amount.' }] }); } },
  { g: 5, f() { const p = P([10, 20, 25, 15, 5, 40]), up = Math.random() < .6, orig = R(3, 30) * 20, m = up ? 1 + p / 100 : 1 - p / 100, X = rnd(orig * m, 2);
    return Q({ text: `After a ${p}% ${up ? 'increase' : 'reduction'}, a jacket costs £${fmt(X, 2)}.<br>What was the original price?`, answer: orig, pre: '£', hint: `New price = original × ${fmt(m)}. So divide to go backwards.`,
      steps: [`The new price is ${rnd(m * 100, 2)}% of the original`, `Original = ${fmt(X, 2)} ÷ ${fmt(m)}`, `= <b>£${fmt(orig, 2)}</b>`],
      traps: [{ v: rnd(X * (up ? 1 - p / 100 : 1 + p / 100), 2), why: `You took ${p}% of the NEW price. The ${p}% was of the original, so divide by ${fmt(m)} instead.` }] }); } },
  { g: 6, f() { const P0 = R(5, 50) * 100, dep = Math.random() < .4, r = dep ? P([10, 12, 15, 20]) : P([2, 3, 4, 5, 1.5, 2.5]), n = R(2, 6), m = dep ? 1 - r / 100 : 1 + r / 100, ex = P0 * m ** n, ans = rnd(ex, 2);
    return Q({ text: dep ? `A car is worth £${fmt(P0)}. Its value <b>depreciates</b> by ${r}% each year.<br>What is it worth after ${n} years?` : `£${fmt(P0)} is invested at ${r}% <b>compound</b> interest per year.<br>How much is in the account after ${n} years?`,
      answer: ans, exact: ex, dp: 2, pre: '£', hint: `Multiplier = ${fmt(m)}. Use it ${n} times: × ${fmt(m)}${sup(n)}`,
      steps: [`Multiplier = ${fmt(m)}`, `${fmt(P0)} × ${fmt(m)}${sup(n)}`, `= <b>${money(ans)}</b> (to the nearest penny)`],
      traps: [{ v: rnd(P0 * (1 + (dep ? -1 : 1) * r * n / 100), 2), why: 'That is simple interest. Compound means the percentage is taken of the NEW amount each year.' }] }); } },
  ] },

{ id: 'ratio', name: 'Ratio', cat: 'Number', icon: '⚖️',
  learn: ['Simplify a ratio by dividing every part by the same number (like fractions).', 'To share in a ratio: add the parts, find one part, then multiply.', 'If you know the difference between shares, divide it by the difference in parts to find one part.', 'Ratio a : b means fraction a/(a+b) for the first share.'],
  mis: ['Dividing by the wrong total — add the parts of the ratio first.', 'Writing a ratio as a fraction like a/b instead of a/(a+b).', 'Not simplifying fully.'],
  v: [
  { g: 2, f() { let a0, b0; do { a0 = R(1, 9); b0 = R(1, 9); } while (a0 === b0 || gcd(a0, b0) !== 1); const k = R(2, 9);
    return Q({ kind: 'ratio', text: `Write ${a0 * k} : ${b0 * k} in its simplest form.`, answer: [a0, b0], hint: `Find the highest number that divides both ${a0 * k} and ${b0 * k}.`,
      steps: [`HCF of ${a0 * k} and ${b0 * k} is ${k}`, `${a0 * k} ÷ ${k} = ${a0}, ${b0 * k} ÷ ${k} = ${b0}`, `<b>${a0} : ${b0}</b>`] }); } },
  { g: 3, f() { let a, b; do { a = R(1, 7); b = R(1, 7); } while (a === b); const k = R(2, 15) * P([1, 2, 5]), T = (a + b) * k, big = Math.max(a, b), names = P([['Ali', 'Beth'], ['Sam', 'Jo'], ['Priya', 'Tom'], ['Kai', 'Mia']]);
    return Q({ text: `${names[0]} and ${names[1]} share £${T} in the ratio ${a} : ${b}.<br>How much does ${a > b ? names[0] : names[1]} get?`, answer: big * k, pre: '£', hint: `Total parts = ${a} + ${b}. Find one part first.`,
      steps: [`Total parts: ${a} + ${b} = ${a + b}`, `One part: £${T} ÷ ${a + b} = £${k}`, `${big} parts: ${big} × £${k} = <b>£${big * k}</b>`],
      traps: [{ v: rnd(T / big, 2), why: `You divided by ${big}. Divide by the TOTAL number of parts (${a + b}).` }, { v: Math.min(a, b) * k, why: 'That is the smaller share — check which person the question asks about.' }] }); } },
  { g: 4, f() { let a, b; do { a = R(1, 6); b = R(2, 9); } while (b <= a); const k = R(3, 20), d = (b - a) * k;
    return Q({ text: `Sweets are shared between Leo and Zara in the ratio ${a} : ${b}.<br>Zara gets ${d} more sweets than Leo. How many sweets are there altogether?`, answer: (a + b) * k,
      hint: `The difference in parts is ${b} − ${a} = ${b - a}. That is worth ${d} sweets.`,
      steps: [`Difference in parts: ${b - a}`, `One part = ${d} ÷ ${b - a} = ${k}`, `Total parts = ${a + b}, so total = ${a + b} × ${k} = <b>${(a + b) * k}</b>`],
      traps: [{ v: k, why: `${k} is just ONE part. Multiply by the total number of parts (${a + b}).` }, { v: d * (a + b), why: `Divide the difference by ${b - a} first to find one part.` }] }); } },
  { g: 5, f() { let a, b; do { a = R(1, 9); b = R(1, 9); } while (a === b); const [n, m] = simp(b, a + b);
    return Q({ kind: 'frac', text: `The ratio of boys to girls in a club is ${a} : ${b}.<br>What fraction of the club are girls?`, answer: [n, m], hint: 'Fraction = girls\' parts ÷ TOTAL parts.',
      steps: [`Total parts: ${a} + ${b} = ${a + b}`, `Girls: ${fr(b, a + b, 1)} = <b>${fr(n, m)}</b>`], traps: [{ v: b / a, why: 'That compares girls to boys. A fraction of the club must use the total.' }] }); } },
  { g: 6, f() { const a = R(1, 5), b1 = R(2, 6), b2 = R(2, 6), c = R(1, 7), L = lcm(b1, b2); let A = a * L / b1, B = L, C = c * L / b2; const g = gcd(gcd(A, B), C); A /= g; B /= g; C /= g;
    return Q({ kind: 'ratio', text: `A : B = ${a} : ${b1} and B : C = ${b2} : ${c}.<br>Write A : B : C in its simplest form.`, answer: [A, B, C], hint: `Make the B parts the same. The LCM of ${b1} and ${b2} is ${L}.`,
      steps: [`Scale A : B by ${L / b1} → ${a * L / b1} : ${L}`, `Scale B : C by ${L / b2} → ${L} : ${c * L / b2}`, `Combine and simplify → <b>${A} : ${B} : ${C}</b>`] }); } },
  ] },

{ id: 'proportion', name: 'Proportion', cat: 'Number', icon: '📏',
  learn: ['Direct proportion: both go up together. Find the cost of ONE first (unitary method).', 'Inverse proportion: one goes up, the other goes down (more workers → fewer days). Total stays the same.', 'Higher: y ∝ x² means y = kx². Find k, then use it.', 'y ∝ 1/x means y = k/x.'],
  mis: ['Treating inverse proportion as direct (more workers does NOT take longer).', 'Forgetting to square x when y ∝ x².', 'Not finding the constant k first.'],
  v: [
  { g: 2, f() { const u = R(15, 95), n = R(3, 9); let m; do { m = R(2, 15); } while (m === n); const c = n * u / 100, ans = m * u / 100, item = P(['pens', 'apples', 'stickers', 'cupcakes']);
    return Q({ text: `${n} ${item} cost ${money(c)}.<br>How much do ${m} ${item} cost?`, answer: ans, pre: '£', dp: 2, exact: ans, hint: 'Find the cost of ONE first.',
      steps: [`One costs ${money(c)} ÷ ${n} = ${money(u / 100)}`, `${m} cost ${m} × ${money(u / 100)} = <b>${money(ans)}</b>`], traps: [{ v: rnd(c * m, 2), why: `You multiplied the price of ${n} by ${m}. Find the price of one first.` }] }); } },
  { g: 3, f() { const q1 = P([200, 250, 300, 400, 500]), q2 = P([600, 750, 800, 1000]), p1 = rnd(q1 * R(40, 90) / 10000, 2); let p2; do { p2 = rnd(q2 * R(40, 90) / 10000, 2); } while (Math.abs(p1 / q1 - p2 / q2) < 0.00005);
    const A = p1 / q1 * 100, B = p2 / q2 * 100, best = A < B ? 'A' : 'B';
    return Q({ kind: 'mc', text: `Which is better value?<br>Pack A: ${q1} g for ${money(p1)}<br>Pack B: ${q2} g for ${money(p2)}`, options: MC(`Pack ${best}`, [{ t: `Pack ${best === 'A' ? 'B' : 'A'}`, why: 'Compare the price for the SAME amount (e.g. per 100 g), not the total price.' }]),
      hint: 'Work out the cost of 100 g for each pack.', steps: [`A: ${money(p1)} ÷ ${q1 / 100} = ${fmt(A, 2)}p… per 100 g → £${fmt(A, 3)}`, `B: ${money(p2)} ÷ ${q2 / 100} = £${fmt(B, 3)} per 100 g`, `Lower cost per 100 g → <b>Pack ${best}</b>`] }); } },
  { g: 4, f() { const w = R(2, 8), d = R(2, 12), T = w * d; const ws = []; for (let i = 1; i <= T; i++) if (T % i === 0 && i !== w && i <= 24) ws.push(i); const w2 = P(ws.length ? ws : [1]);
    return Q({ text: `${w} builders take ${d} days to build a wall.<br>How long would ${w2} builders take, working at the same rate?`, answer: T / w2, unit: 'days', hint: 'This is INVERSE proportion. Work out the total number of "builder-days".',
      steps: [`Total work = ${w} × ${d} = ${T} builder-days`, `${T} ÷ ${w2} = <b>${fmt(T / w2)} days</b>`], traps: [{ v: rnd(d * w2 / w, 3), why: 'You used direct proportion. More builders should take LESS time.' }] }); } },
  { g: 7, f() { const k = R(2, 5), x1 = R(2, 5); let x2; do { x2 = R(2, 9); } while (x2 === x1); const y1 = k * x1 * x1;
    return Q({ text: `y is directly proportional to x².<br>When x = ${x1}, y = ${y1}.<br>Find y when x = ${x2}.`, answer: k * x2 * x2, hint: 'Write y = kx². Substitute to find k.',
      steps: [`y = kx²`, `${y1} = k × ${x1 * x1} → k = ${k}`, `y = ${k} × ${x2}² = <b>${k * x2 * x2}</b>`], traps: [{ v: rnd(y1 * x2 / x1, 3), why: 'You scaled by x, not x². Use y = kx².' }] }); } },
  { g: 7, f() { const x1 = R(2, 6), y1 = R(2, 12), k = x1 * y1; const ds = []; for (let i = 1; i <= k; i++) if (k % i === 0 && i !== x1) ds.push(i); const x2 = P(ds);
    return Q({ text: `y is inversely proportional to x.<br>When x = ${x1}, y = ${y1}.<br>Find y when x = ${x2}.`, answer: k / x2, hint: 'Write y = k ÷ x. Find k first.',
      steps: [`y = k/x`, `k = ${x1} × ${y1} = ${k}`, `y = ${k} ÷ ${x2} = <b>${fmt(k / x2)}</b>`], traps: [{ v: rnd(y1 * x2 / x1, 3), why: 'That is direct proportion. Inversely proportional means y = k/x.' }] }); } },
  { g: 8, f() { const x1 = P([1, 2, 3]), y1 = R(2, 9) * (x1 === 1 ? 4 : 1), k = y1 * x1 * x1; const opts = [1, 2, 3, 4, 6].filter(v => v !== x1 && (k / (v * v)) % 0.25 === 0); const x2 = P(opts.length ? opts : [2 * x1]);
    return Q({ text: `F is inversely proportional to the square of d.<br>When d = ${x1}, F = ${y1}.<br>Find F when d = ${x2}.`, answer: k / (x2 * x2), hint: 'F = k ÷ d². Find k.',
      steps: [`F = k/d²`, `k = ${y1} × ${x1}² = ${k}`, `F = ${k} ÷ ${x2 * x2} = <b>${fmt(k / (x2 * x2))}</b>`], traps: [{ v: rnd(k / x2, 4), why: 'Remember to square d.' }] }); } },
  ] },

{ id: 'standard-form', name: 'Standard Form', cat: 'Number', icon: '10ⁿ',
  learn: ['Standard form is A × 10<sup>n</sup> where 1 ≤ A &lt; 10.', 'Big numbers have positive powers: 34 000 = 3.4 × 10⁴.', 'Small numbers have negative powers: 0.0052 = 5.2 × 10⁻³.', 'To multiply: multiply the A numbers, ADD the powers. Then fix A if it is 10 or more.'],
  mis: ['Leaving the first number bigger than 10, e.g. 12 × 10⁵.', 'Getting the sign of the power wrong for small numbers.', 'Multiplying the powers instead of adding them.'],
  v: [
  { g: 3, f() { const m = R(11, 99) / 10, small = Math.random() < .4, e = small ? -R(2, 6) : R(3, 8);
    return Q({ kind: 'sf', text: `Write ${sfOrd(m, e)} in standard form.`, answer: { m, e }, hint: 'Place the decimal point after the first non-zero digit, then count how many places it moved.',
      steps: [`First number: ${fmt(m)}`, `The point moves ${Math.abs(e)} place${Math.abs(e) > 1 ? 's' : ''} → power ${e}`, `<b>${fmt(m)} × 10${sup(e)}</b>`] }); } },
  { g: 4, f() { const m = R(11, 99) / 10, small = Math.random() < .5, e = small ? -R(1, 5) : R(2, 6); const v = parseFloat(sfOrd(m, e).replace(/,/g, ''));
    return Q({ text: `Write ${fmt(m)} × 10${sup(e)} as an ordinary number.`, answer: v, rel: true, hint: e > 0 ? 'Positive power → the number is big. Move the digits left.' : 'Negative power → the number is small (less than 1).',
      steps: [`Move the decimal point ${Math.abs(e)} place${Math.abs(e) > 1 ? 's' : ''} ${e > 0 ? 'right' : 'left'}`, `<b>${sfOrd(m, e)}</b>`], traps: [{ v: parseFloat(sfOrd(m, -e).replace(/,/g, '')), why: 'Power sign mix-up: positive powers make BIG numbers, negative powers make SMALL numbers.' }] }); } },
  { g: 5, f() { const a = R(11, 50) / 10, b = R(11, 50) / 10, p = R(2, 8), q = R(-5, 6); let M = rnd(a * b, 4), E = p + q; if (M >= 10) { M = rnd(M / 10, 5); E += 1; }
    return Q({ kind: 'sf', text: `Work out (${fmt(a)} × 10${sup(p)}) × (${fmt(b)} × 10${sup(q)})<br><small>Give your answer in standard form.</small>`, answer: { m: M, e: E }, hint: 'Multiply the front numbers, add the powers.',
      steps: [`${fmt(a)} × ${fmt(b)} = ${fmt(rnd(a * b, 4))}`, `10${sup(p)} × 10${sup(q)} = 10${sup(p + q)}`, a * b >= 10 ? `${fmt(rnd(a * b, 4))} × 10${sup(p + q)} → adjust so first number is between 1 and 10: <b>${fmt(M)} × 10${sup(E)}</b>` : `<b>${fmt(M)} × 10${sup(E)}</b>`] }); } },
  { g: 6, f() { const am = R(11, 49) / 10, ae = R(-4, 7), b = R(2, 5), q = R(-3, 5); let A = rnd(am * b, 3), p = ae + q; if (A >= 10) { A = rnd(A / 10, 4); p += 1; }
    return Q({ kind: 'sf', text: `Work out (${fmt(A)} × 10${sup(p)}) ÷ (${b} × 10${sup(q)})<br><small>Give your answer in standard form.</small>`, answer: { m: am, e: ae }, hint: 'Divide the front numbers, subtract the powers.',
      steps: [`${fmt(A)} ÷ ${b} = ${fmt(rnd(A / b, 4))}`, `10${sup(p)} ÷ 10${sup(q)} = 10${sup(p - q)}`, `Adjust if needed → <b>${fmt(am)} × 10${sup(ae)}</b>`] }); } },
  ] },

{ id: 'bounds', name: 'Bounds', cat: 'Number', icon: '↔️',
  learn: ['A measurement rounded to the nearest 10 could be up to 5 either side.', 'Lower bound = value − half the unit. Upper bound = value + half the unit.', 'Error interval: LB ≤ x &lt; UB.', 'For the biggest answer to a division: biggest top ÷ smallest bottom.'],
  mis: ['Using the full unit instead of HALF (nearest 10 → ±5, not ±10).', 'Dividing by the upper bound when you want the biggest result.', 'Mixing up truncation with rounding.'],
  v: [
  { g: 4, f() { const u = P([1, 10, 0.1, 100]), L = u === 0.1 ? R(11, 199) / 10 : u * R(3, 99), h = u / 2;
    return Q({ kind: 'multi', text: `A length is ${fmt(L)} cm, rounded to the nearest ${fmt(u)} cm.<br>Write down the error interval.`, fields: [{ label: 'Lower bound', answer: rnd(L - h, 3) }, { label: 'Upper bound', answer: rnd(L + h, 3) }],
      hint: `Half of ${fmt(u)} is ${fmt(h)}. Go that far either side.`, steps: [`Half the unit: ${fmt(u)} ÷ 2 = ${fmt(h)}`, `Lower: ${fmt(L)} − ${fmt(h)} = ${fmt(rnd(L - h, 3))}`, `Upper: ${fmt(L)} + ${fmt(h)} = ${fmt(rnd(L + h, 3))}`, `<b>${fmt(rnd(L - h, 3))} ≤ x &lt; ${fmt(rnd(L + h, 3))}</b>`] }); } },
  { g: 5, f() { const L = R(11, 199) / 10;
    return Q({ kind: 'multi', text: `Kai's height, in metres, is <b>truncated</b> to 1 decimal place. The result is ${fmt(L)} m.<br>Write down the error interval.`, fields: [{ label: 'Lower bound', answer: L }, { label: 'Upper bound', answer: rnd(L + 0.1, 2) }],
      hint: 'Truncating chops digits off — it never rounds up.', steps: [`Truncated values start at ${fmt(L)}`, `Anything up to (but not including) ${fmt(rnd(L + 0.1, 2))} truncates to ${fmt(L)}`, `<b>${fmt(L)} ≤ h &lt; ${fmt(rnd(L + 0.1, 2))}</b>`] }); } },
  { g: 6, f() { const a = R(4, 20), b = R(3, 15), ub = (a + .5) * (b + .5);
    return Q({ text: `A rectangle measures ${a} cm by ${b} cm, each to the nearest cm.<br>Calculate the upper bound for its area.`, answer: ub, unit: 'cm²', hint: 'Use the upper bound of each side.',
      steps: [`Upper bounds: ${a + .5} cm and ${b + .5} cm`, `${a + .5} × ${b + .5} = <b>${fmt(ub)} cm²</b>`], traps: [{ v: a * b, why: 'You used the rounded values. Use the upper bounds (add 0.5 to each).' }, { v: (a + 1) * (b + 1), why: 'Nearest cm means ± 0.5, not ± 1.' }] }); } },
  { g: 7, f() { const d = R(8, 40) * 10, t = R(100, 250) / 10, ub = (d + 5) / (t - 0.05);
    return Q({ text: `A runner travels ${d} m (to the nearest 10 m) in ${fmt(t, 1)} s (to the nearest 0.1 s).<br>Calculate the upper bound for the speed.<br>${dpTxt(2)}`, answer: rnd(ub, 2), exact: ub, dp: 2, unit: 'm/s',
      hint: 'Speed = distance ÷ time. Biggest answer = biggest distance ÷ SMALLEST time.',
      steps: [`UB distance = ${d + 5} m, LB time = ${fmt(t - 0.05, 2)} s`, `${d + 5} ÷ ${fmt(t - 0.05, 2)} = <b>${fmt(ub, 2)} m/s</b>`], traps: [{ v: rnd((d + 5) / (t + 0.05), 2), why: 'To make a division as BIG as possible, divide by the SMALLEST time (lower bound).' }, { v: rnd(d / t, 2), why: 'You used the rounded values. Use bounds.' }] }); } },
  ] },

{ id: 'surds', name: 'Surds', cat: 'Number', icon: '√',
  learn: ['√(ab) = √a × √b. Use it to pull out square numbers: √50 = √25 × √2 = 5√2.', '√a × √a = a.', 'Rationalise a/√b by multiplying top and bottom by √b.', 'Expand surd brackets like normal brackets.'],
  mis: ['Writing √a + √b = √(a+b) — not true!', 'Forgetting that (√3)² = 3, not 9.', 'Not simplifying fully (√72 = 6√2, not 2√18).'],
  v: [
  { g: 6, f() { const a = R(2, 6), b = P([2, 3, 5, 6, 7]), n = a * a * b; const ws = [{ t: surd(a * a, b), why: `You took the square (${a * a}) out instead of its square root (${a}).` }, { t: surd(b, a), why: `The number outside must be the square root of the square factor (√${a * a} = ${a}).` }];

    return Q({ text: `Work out ${sq(x)} × ${sq(N / x)}`, answer: s, hint: '√a × √b = √(ab)', steps: [`${sq(x)} × ${sq(N / x)} = ${sq(N)}`, `= <b>${s}</b>`], traps: [{ v: N, why: `√${N} = ${s}. Remember to square root at the end.` }] }); } },

      hint: `Multiply top and bottom by ${sq(b)}.`, steps: [`× ${sq(b)} top and bottom`, `= <span class="fr"><span>${surd(a, b)}</span><span>${b}</span></span>`, `Simplify → <b>${ans}</b>`] }); } },
  { g: 8, f() { const a = R(2, 7), b = P([2, 3, 5, 7]), c = a * a + b, d = 2 * a;
    return Q({ kind: 'mc', text: `Expand and simplify (${a} + ${sq(b)})²`, options: MC(`${c} + ${surd(d, b)}`, [{ t: `${a * a} + ${b}`, why: 'Squaring a bracket is NOT squaring each term. Write it as two brackets.' }, { t: `${c} + ${surd(a, b)}`, why: 'You missed one of the middle terms — there are two lots of ' + surd(a, b) + '.' }, { t: `${a * a + b * b} + ${surd(d, b)}`, why: `(${sq(b)})² = ${b}.` }]),

{ id: 'recurring', name: 'Recurring Decimals', cat: 'Number', icon: '0.3̇',
  learn: ['A dot over a digit means it repeats forever: 0.3̇ = 0.333…', 'Ninths: n/9 = 0.ṅ (e.g. 4/9 = 0.4̇).', 'To convert 0.ȧḃ to a fraction: let x = 0.abab…, so 100x = ab.abab… Subtract: 99x = ab.', 'One digit before the repeat? Use 10x and 100x.'],
  mis: ['Multiplying by the wrong power of 10 (use 100 when 2 digits repeat).', 'Forgetting to simplify the final fraction.', 'Treating 0.3̇ as 3/10.'],
  v: [
  { g: 4, f() { const n = R(1, 8), d1 = `0.${n}̇`;
    return Q({ kind: 'mc', text: `Write ${fr(n, 9, 1)} as a recurring decimal.`, options: MC(d1, [{ t: `0.${n}`, why: `0.${n} = ${n}/10. Ninths recur.` }, { t: `0.0${n}̇`, why: 'The digit repeats straight after the decimal point.' }, { t: `${n}.${n}̇`, why: `${fr(n, 9)} is less than 1.` }]),
      hint: 'Try 1/9 on a calculator: 0.1111…', steps: [`1/9 = 0.111…`, `So ${n}/9 = ${n} × 0.111… = <b>${d1}</b>`] }); } },
  { g: 5, f() { const n = R(1, 10), dg = String(9 * n).padStart(2, '0'), ans = `0.${dg[0]}̇${dg[1]}̇`;
    return Q({ kind: 'mc', text: `Write ${fr(n, 11, 1)} as a recurring decimal.`, options: MC(ans, [{ t: `0.${dg}`, why: 'Elevenths repeat forever — you need dots.' }, { t: `0.${dg[0]}${dg[1]}̇`, why: 'Both digits repeat, so both need dots.' }, { t: `0.${n}̇`, why: 'Divide ' + n + ' by 11 using short division to see the pattern.' }]),
      hint: '1/11 = 0.090909…', steps: [`1/11 = 0.0̇9̇`, `${n}/11 = ${n} × 0.0909… = 0.${dg}${dg}…`, `= <b>${ans}</b>`] }); } },
  { g: 7, f() { let a, b; do { a = R(0, 9); b = R(1, 9); } while (a === b); const ab = 10 * a + b; const [n, m] = simp(ab, 99);
    return Q({ kind: 'frac', text: `Write 0.${a}̇${b}̇ as a fraction in its simplest form.`, answer: [n, m], exactOnly: true, hint: 'Let x = 0.' + a + b + a + b + '… and multiply by 100.',
      steps: [`x = 0.${a}${b}${a}${b}…`, `100x = ${ab}.${a}${b}${a}${b}…`, `Subtract: 99x = ${ab}`, `x = ${fr(ab, 99, 1)} = <b>${fr(n, m)}</b>`], traps: [{ v: ab / 100, why: 'That is 0.' + a + b + ' exactly, not recurring. Use 100x − x = 99x.' }, { v: ab / 90, why: 'Two digits repeat, so subtract to get 99x.' }] }); } },
  { g: 8, f() { const a = R(1, 9); let b; do { b = R(1, 9); } while (b === a); const top = 10 * a + b - a; const [n, m] = simp(top, 90);
    return Q({ kind: 'frac', text: `Write 0.${a}${b}̇ as a fraction in its simplest form.`, answer: [n, m], exactOnly: true, hint: 'Let x = 0.' + a + b + b + b + '… Find 10x and 100x.',
      steps: [`10x = ${a}.${b}${b}${b}…`, `100x = ${a}${b}.${b}${b}…`, `100x − 10x = 90x = ${10 * a + b} − ${a} = ${top}`, `x = ${fr(top, 90, 1)} = <b>${fr(n, m)}</b>`], traps: [{ v: (10 * a + b) / 99, why: 'Only the ' + b + ' repeats, not both digits. Use 100x − 10x.' }] }); } },
  ] },

{ id: 'simplifying', name: 'Simplifying', cat: 'Algebra', icon: 'x+x',
  learn: ['Like terms have exactly the same letters and powers: 3x and 5x are like terms; 3x and 3y are not.', 'The sign in front of a term belongs to it.', 'Index laws: xᵃ × xᵇ = xᵃ⁺ᵇ, xᵃ ÷ xᵇ = xᵃ⁻ᵇ, (xᵃ)ᵇ = xᵃᵇ.', 'x⁰ = 1, x⁻ⁿ = 1/xⁿ, x^(1/n) = ⁿ√x.'],
  mis: ['Combining unlike terms (2x + 3y ≠ 5xy).', 'Multiplying powers when you should add them.', 'Thinking a negative power gives a negative number.'],
  v: [
  { g: 1, f() { const a = R(2, 9), c = R(1, 9), b = R(2, 9); let d; do { d = R(1, 9); } while (d === b);
    const ok = poly([[a + c, 'x'], [b - d, 'y']]);
    return Q({ kind: 'mc', text: `Simplify ${poly([[a, 'x'], [b, 'y'], [c, 'x'], [-d, 'y']])}`, options: MC(ok, [{ t: `${a + b + c - d}xy`, why: 'x and y are unlike terms — they cannot be combined into one term.' }, { t: poly([[a + c, 'x'], [b + d, 'y']]), why: `The minus belongs to the ${d}y, so it is ${b}y − ${d}y.` }, { t: poly([[a - c, 'x'], [b - d, 'y']]), why: 'Both x terms are positive, so add them.' }]),
      hint: 'Group the x terms together and the y terms together.', steps: [`x terms: ${a}x + ${c}x = ${a + c}x`, `y terms: ${b}y − ${d}y = ${poly([[b - d, 'y']])}`, `<b>${ok}</b>`] }); } },
  { g: 3, f() { let p, q, a, b; do { p = R(2, 6); q = R(2, 6); a = R(2, 7); b = R(2, 7); } while (p * q === p + q || a * b === a + b);
    return Q({ kind: 'mc', text: `Simplify ${p}x${sup(a)} × ${q}x${sup(b)}`, options: MC(`${p * q}x${sup(a + b)}`, [{ t: `${p + q}x${sup(a + b)}`, why: 'Multiply the numbers in front, don\'t add them.' }, { t: `${p * q}x${sup(a * b)}`, why: 'When multiplying, ADD the powers.' }, { t: `${p + q}x${sup(a * b)}`, why: 'Multiply the numbers, add the powers.' }]),
      hint: 'Multiply the numbers. Add the powers.', steps: [`${p} × ${q} = ${p * q}`, `x${sup(a)} × x${sup(b)} = x${sup(a + b)}`, `<b>${p * q}x${sup(a + b)}</b>`] }); } },
  { g: 4, f() { const a = R(5, 12), b = R(2, a - 1);
    return Q({ text: `Simplify x${sup(a)} ÷ x${sup(b)}<br><small>Type the power only.</small>`, answer: a - b, pre: 'x^', hint: 'Dividing → subtract the powers.', steps: [`${a} − ${b} = ${a - b}`, `<b>x${sup(a - b)}</b>`], traps: [{ v: rnd(a / b, 4), why: 'Dividing powers is wrong — SUBTRACT them.' }, { v: a + b, why: 'That is for multiplying. For dividing, subtract.' }] }); } },
  { g: 5, f() { const k = R(2, 5), a = R(2, 5), n = R(2, 3);
    return Q({ kind: 'mc', text: `Simplify (${k}x${sup(a)})${sup(n)}`, options: MC(`${k ** n}x${sup(a * n)}`, [{ t: `${k}x${sup(a * n)}`, why: `Everything in the bracket gets raised to the power ${n} — including the ${k}.` }, { t: `${k ** n}x${sup(a + n)}`, why: 'Power of a power → MULTIPLY the powers.' }, { t: `${k * n}x${sup(a * n)}`, why: `${k}${sup(n)} means ${Array(n).fill(k).join(' × ')}, not ${k} × ${n}.` }]),
      hint: 'Raise the number to the power, and multiply the indices.', steps: [`${k}${sup(n)} = ${k ** n}`, `(x${sup(a)})${sup(n)} = x${sup(a * n)}`, `<b>${k ** n}x${sup(a * n)}</b>`] }); } },
  { g: 6, f() { const a = R(2, 5), n = a === 2 ? R(1, 4) : R(1, 2);
    return Q({ kind: 'frac', text: `Work out ${a}${sup('−' + n)}<br><small>Give your answer as a fraction.</small>`, answer: [1, a ** n], hint: 'A negative power means "one over".', steps: [`${a}${sup('−' + n)} = ${fr(1, `${a}${sup(n)}`, 1)}`, `= <b>${fr(1, a ** n)}</b>`], traps: [{ v: -(a ** n), why: 'A negative power does NOT make the answer negative. It means 1 over.' }, { v: -a * n, why: 'Negative powers mean reciprocal: 1 ÷ ' + a + sup(n) + '.' }] }); } },
  { g: 7, f() { const d = P([2, 3]), r = d === 2 ? R(2, 9) : R(2, 5), n = d === 2 ? R(1, 3) : R(1, 2) + (Math.random() < .5 ? 0 : 0), b = r ** d, N = n === d ? n + 1 : n;
    return Q({ text: `Work out ${b}${sup(`${N}/${d}`)}`, answer: r ** N, hint: `The bottom of the power (${d}) means ${d === 2 ? 'square' : 'cube'} root. The top (${N}) means power ${N}.`,
      steps: [`${d === 2 ? '√' : '∛'}${b} = ${r}`, `${r}${sup(N)} = <b>${r ** N}</b>`], traps: [{ v: rnd(b * N / d, 4), why: 'A fractional power is not multiplying by the fraction. Root first, then power.' }] }); } },
  { g: 9, f() { const a = R(1, 7); let b; do { b = NZ(-7, 7); } while (b === a || b === -a); const ok = `<span class="fr"><span>${poly([[1, 'x'], [-a, '']])}</span><span>${poly([[1, 'x'], [b, '']])}</span></span>`;
    return Q({ kind: 'mc', text: `Simplify fully <span class="fr"><span>${poly([[1, X2], [-a * a, '']])}</span><span>${poly([[1, X2], [a + b, 'x'], [a * b, '']])}</span></span>`, options: MC(ok, [{ t: `<span class="fr"><span>${poly([[1, 'x'], [a, '']])}</span><span>${poly([[1, 'x'], [b, '']])}</span></span>`, why: 'You cancelled the wrong bracket — factorise both fully and cancel the bracket that appears top AND bottom.' }, { t: `<span class="fr"><span>${poly([[-a * a, '']])}</span><span>${poly([[a + b, 'x'], [a * b, '']])}</span></span>`, why: 'You cannot cancel x² terms — only common FACTORS (whole brackets) cancel.' }, { t: `<span class="fr"><span>${poly([[1, 'x'], [-a, '']])}</span><span>${poly([[1, 'x'], [-b, '']])}</span></span>`, why: 'Check the signs in your factorised denominator by expanding it.' }]),
      hint: 'Factorise the top (difference of two squares) and the bottom, then cancel the common bracket.', steps: [`Top: ${br([[1, 'x'], [a, '']])}${br([[1, 'x'], [-a, '']])}`, `Bottom: ${br([[1, 'x'], [a, '']])}${br([[1, 'x'], [b, '']])}`, `Cancel ${br([[1, 'x'], [a, '']])} → <b>${ok}</b>`] }); } },
  { g: 8, f() { const d = P([2, 3]), r = d === 2 ? R(2, 7) : R(2, 4), n = d === 2 ? P([1, 3]) : P([1, 2]), b = r ** d;
    return Q({ kind: 'frac', text: `Work out ${b}${sup(`−${n}/${d}`)}<br><small>Give your answer as a fraction.</small>`, answer: [1, r ** n], hint: 'Deal with the minus first (1 over), then root, then power.',
      steps: [`${b}${sup(`−${n}/${d}`)} = 1 ÷ ${b}${sup(`${n}/${d}`)}`, `${d === 2 ? '√' : '∛'}${b} = ${r}, then ${r}${sup(n)} = ${r ** n}`, `= <b>${fr(1, r ** n)}</b>`], traps: [{ v: -(r ** n), why: 'The negative power means reciprocal, not negative.' }] }); } },
  ] },

{ id: 'expanding', name: 'Expanding Brackets', cat: 'Algebra', icon: '( )',
  learn: ['Multiply EVERYTHING inside the bracket by the term outside.', 'Double brackets: each term in the first bracket multiplies each term in the second (FOIL or the grid method).', '(x + a)² = (x + a)(x + a) = x² + 2ax + a².', 'Collect like terms at the end.'],

  { g: 3, f() { const a = R(2, 6), b = NZ(-6, 8), c = R(2, 6), d = NZ(-6, 8), ok = poly([[a + c, 'x'], [a * b + c * d, '']]);
    return Q({ kind: 'mc', text: `Expand and simplify ${a}${br([[1, 'x'], [b, '']])} + ${c}${br([[1, 'x'], [d, '']])}`, options: MC(ok, [{ t: poly([[a + c, 'x'], [b + d, '']]), why: 'Multiply the numbers inside the brackets too.' }, { t: poly([[a * c, 'x'], [a * b + c * d, '']]), why: `x terms: ${a}x + ${c}x — add them.` }, { t: poly([[a + c, 'x'], [a * b - c * d, '']]), why: 'Check the signs on the number terms.' }]),
      hint: 'Expand each bracket separately, then collect like terms.', steps: [`${poly([[a, 'x'], [a * b, '']])} + ${poly([[c, 'x'], [c * d, '']])}`, `<b>${ok}</b>`] }); } },
  { g: 4, f() { const a = NZ(-9, 9), b = NZ(-9, 9), ok = poly([[1, X2], [a + b, 'x'], [a * b, '']]);
    return Q({ kind: 'mc', text: `Expand and simplify ${br([[1, 'x'], [a, '']])}${br([[1, 'x'], [b, '']])}`, options: MC(ok, [{ t: poly([[1, X2], [a * b, '']]), why: 'You missed the middle terms. There are FOUR multiplications.' }, { t: poly([[1, X2], [a * b, 'x'], [a + b, '']]), why: 'The x term comes from ADDING ' + a + ' and ' + b + '; the number comes from multiplying.' }, { t: poly([[1, X2], [a - b, 'x'], [-a * b, '']]), why: 'Watch the signs — use a grid to keep track.' }]),
      hint: 'Use FOIL: First, Outer, Inner, Last.', steps: [`x × x = x²`, `x × ${neg(b)} + ${neg(a)} × x = ${poly([[a + b, 'x']])}`, `${neg(a)} × ${neg(b)} = ${a * b}`, `<b>${ok}</b>`] }); } },
  { g: 6, f() { let p, q, a, b; do { p = R(2, 5); q = R(1, 4); a = NZ(-7, 7); b = NZ(-7, 7); } while (p * b + q * a === 0 || p * b + q * a === a + b); const ok = poly([[p * q, X2], [p * b + q * a, 'x'], [a * b, '']]);
    return Q({ kind: 'mc', text: `Expand and simplify ${br([[p, 'x'], [a, '']])}${br([[q, 'x'], [b, '']])}`, options: MC(ok, [{ t: poly([[p * q, X2], [a + b, 'x'], [a * b, '']]), why: 'The middle term needs the coefficients: ' + p + 'x × ' + neg(b) + ' and ' + neg(a) + ' × ' + q + 'x.' }, { t: poly([[p + q, X2], [p * b + q * a, 'x'], [a * b, '']]), why: `${p}x × ${q}x = ${p * q}x².` }, { t: poly([[p * q, X2], [a * b, '']]), why: 'You missed the middle terms.' }]),
      hint: 'Grid method: put each bracket on one side of a 2 × 2 grid.', steps: [`${p}x × ${q}x = ${p * q}x²`, `${p}x × ${neg(b)} = ${poly([[p * b, 'x']])}, ${neg(a)} × ${q}x = ${poly([[q * a, 'x']])}`, `${neg(a)} × ${neg(b)} = ${a * b}`, `<b>${ok}</b>`] }); } },
  { g: 5, f() { const a = NZ(-9, 9), ok = poly([[1, X2], [2 * a, 'x'], [a * a, '']]);

      hint: `Write it as ${br([[1, 'x'], [a, '']])}${br([[1, 'x'], [a, '']])}.`, steps: [`${br([[1, 'x'], [a, '']])}${br([[1, 'x'], [a, '']])}`, `x² ${sgn(a)}x ${sgn(a)}x ${sgn(a * a)}`, `<b>${ok}</b>`] }); } },
  { g: 8, f() { const a = NZ(-4, 4), b = NZ(-4, 4), c = NZ(-4, 4), s2 = a + b + c, s1 = a * b + b * c + c * a, s0 = a * b * c, ok = poly([[1, X3], [s2, X2], [s1, 'x'], [s0, '']]);

      hint: 'Expand the first two brackets, then multiply the result by the third.', steps: [`First two: ${poly([[1, X2], [a + b, 'x'], [a * b, '']])}`, `Multiply by ${br([[1, 'x'], [c, '']])} and collect`, `<b>${ok}</b>`] }); } },
  ] },

{ id: 'factorising', name: 'Factorising', cat: 'Algebra', icon: '⊞',
  learn: ['Factorising is the reverse of expanding — put brackets back in.', 'Take out the highest common factor of every term.', 'x² + bx + c: find two numbers that MULTIPLY to c and ADD to b.', 'Difference of two squares: a² − b² = (a + b)(a − b).'],
  mis: ['Not taking out the HIGHEST common factor.', 'Picking numbers that multiply to c but don\'t add to b.', 'Getting the signs the wrong way round in the brackets.'],
  v: [
  { g: 2, f() { const k = P([2, 3, 4, 5, 6, 8, 9, 10]); let a, b; do { a = R(1, 7); b = R(1, 9); } while (gcd(a, b) !== 1); const ok = `${k}${br([[a, 'x'], [b, '']])}`; const ws = [{ t: `${k}${br([[a, 'x'], [k * b, '']])}`, why: `Divide EVERY term by ${k}.` }, { t: `${k * a}${br([[1, 'x'], [b, '']])}`, why: 'Expand to check — it doesn\'t give back the original.' }];
    for (const f of [2, 3, 5]) if (k % f === 0 && k !== f) { ws.unshift({ t: `${f}${br([[a * k / f, 'x'], [b * k / f, '']])}`, why: `Not fully factorised — ${k} is a bigger common factor.` }); break; }

{ id: 'equations', name: 'Equations', cat: 'Algebra', icon: '=',

  { g: 8, f() { const k = R(2, 9), less = Math.random() < .5;
