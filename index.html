<script>/* =========================================================
   DIAGNOSTIC EXTRAS
   - Eduqas grade boundaries
   - Extra time (25%) at the end of the test, with a log of
     every answer added or changed during it
   - Sending each finished test to the teacher's Google Sheet
   ========================================================= */

/* ---- Teacher's results link -------------------------------------------
   Paste your Google Apps Script web app URL between the quotes below
   (it starts https://script.google.com/macros/s/...). Every copy of the
   game then sends finished diagnostic tests to your Google Sheet.
   You can also set it on one device in Settings → Teacher, or share a
   link to the game ending ?results=<your URL>.                            */
const RESULTS_URL_DEFAULT = '';

const EXTRA_PCT = 25;
const extraMins = v => Math.ceil(diagMinutes(v) * EXTRA_PCT / 100);
const gTxt = g => g < 1 ? "U" : String(g);
const okResultsUrl = u => /^https:\/\/script\.google(usercontent)?\.com\//.test(u || '');
(function () { try { const p = new URLSearchParams(location.search).get('results'); if (okResultsUrl(p)) { S.resultsUrl = p; save(); } } catch (e) { } })();
const resultsUrl = () => S.resultsUrl || RESULTS_URL_DEFAULT;

/* Eduqas June 2025 qualification boundaries (out of 240) */
const DIAG_BOUNDS_EQ = { F: [[5, 141], [4, 111], [3, 81], [2, 51], [1, 21]], H: [[9, 196], [8, 155], [7, 115], [6, 85], [5, 56], [4, 27], [3, 12]] };
const _diagGrade = diagGrade;
diagGrade = function (pct, tier, board) {
  if (board !== 'Eduqas') return _diagGrade(pct, tier);
  for (const [g, m] of DIAG_BOUNDS_EQ[tier]) if (pct >= m / 240 * 100 - 1e-9) return g;
  return 0;
};

/* ---- timer: at the end of normal time, offer extra time ---- */
function diagTick() {
  return setInterval(() => {
    if (view !== 'play' || !sess || sess.done) return;
    sess.time--;
    const el = document.getElementById('timer'); if (el) { el.textContent = clock(sess.time); el.classList.toggle('low', sess.time <= (sess.extra ? 120 : 300)); }
    if (!sess.extra && sess.time === 300) toast('', '5 minutes left.');
    if (sess.extra && sess.time === 120) toast('', '2 minutes of extra time left.');
    if (sess.time <= 0) { clearInterval(tick); tick = null; sess.extra ? submitExam() : timeUp(); }
  }, 1000);
}
const _startD = start;
start = function (cfg) {
  _startD(cfg);
  if (cfg.diag && sess && sess.cfg.diag) { if (tick) clearInterval(tick); tick = diagTick(); }
};
function timeUp() { saveExamInput(); logExtra(); sess.timeUp = true; go('diagtime'); }

const cloneA = a => Array.isArray(a) ? a.slice() : a;
/* never read the answer box when it is not on screen */
const _saveExamInput = saveExamInput;
saveExamInput = function () { if (view !== 'play' || !sess || sess.done) return; _saveExamInput(); };

function diagTime() {
  if (!sess || !sess.cfg.diag || sess.done) return home();
  const v = diagVariant(sess.cfg.diag), n = sess.ans.filter(a => a != null).length;
  return `${header()}<main class="wrapx"><article class="card focus" style="text-align:center">
    <div class="kicker">Time's up</div><h1 class="pageh" style="margin-top:6px">Pens down</h1>
    <p class="lead dark" style="margin:0 auto 14px">You answered ${n} of ${sess.qs.length} questions in the normal ${diagMinutes(v)} minutes.</p>
    <div class="grid2"><button class="btn" data-act="dhandin" data-autofocus>${ic('check', 18)} Hand in my paper</button>
    <button class="btn sec" data-act="dextra">${ic('clock', 18)} I have extra time: add ${extraMins(v)} minutes</button></div>
    <p class="small mut" style="margin-top:14px">Extra time is for students with an exam access arrangement (usually 25% extra). Your teacher will see that you used it, your score at the end of normal time, and every answer you add or change during it.</p>
  </article></main>`;
}

/* ---- the extra-time log ---- */
function fmtAns(q, a) {
  if (a == null) return '(blank)';
  if (q.kind === 'mc') return String.fromCharCode(65 + a) + ': ' + String(q.options[a].t).replace(/<[^>]+>/g, '');
  return Array.isArray(a) ? a.map(x => x === '' ? '–' : x).join(' | ') : String(a);
}
function logExtra() {
  const x = sess && sess.extra; if (!x || sess.done) return;
  const v = diagVariant(sess.cfg.diag);
  sess.ans.forEach((a, i) => {
    if (JSON.stringify(a) === JSON.stringify(x.last[i])) return;
    const q = sess.qs[i];
    x.log.push({ q: i + 1, src: v.items[i].src, at: x.secs - Math.max(0, sess.time), kind: x.last[i] == null ? 'New answer' : a == null ? 'Answer removed' : 'Answer changed', before: fmtAns(q, x.last[i]), after: fmtAns(q, a) });
    x.last[i] = cloneA(a);
  });
}
const _renderD = render;
render = function () { logExtra(); _renderD(); };

/* ---- hand in: add extra-time details, then send to the teacher ---- */
const _submitD = submitExam;
submitExam = function () {
  if (!sess || !sess.cfg.diag) return _submitD();
  if (sess.done) return;
  if (view === 'play') saveExamInput();
  logExtra();
  const x = sess.extra, v = diagVariant(sess.cfg.diag);
  _submitD();
  const i = S.diags.length - 1, rep = S.diags[i];
  rep.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  rep.group = S.diagGroup || ''; rep.board = v.board;
  if (x) {
    const stdItems = sess.qs.map((q, k) => diagScore(q, x.snap[k]));
    const stdScore = stdItems.reduce((s, a) => s + a, 0);
    rep.secs = diagMinutes(v) * 60;
    rep.extra = { mins: x.mins, used: x.secs - Math.max(0, sess.time), stdItems, stdScore, stdPct: Math.round(stdScore / rep.total * 100), stdGrade: diagGrade(stdScore / rep.total * 100, rep.tier, v.board), log: x.log };

Object.assign(ACT, {
  dhandin: () => submitExam(),
  dextra: () => {
    if (!sess || sess.done || sess.extra) return;
    const v = diagVariant(sess.cfg.diag), mins = extraMins(v), snap = sess.ans.map(cloneA);

  },
  dsend: a => { sendResult(+a).then(ok => { toast('', ok ? 'Sent to your teacher.' : 'Could not send. Check the internet connection and try again.'); render(); }); render(); },
  tsave: () => { const el = document.getElementById('turl'), u = el ? el.value.trim() : ''; if (u && !okResultsUrl(u)) { toast('', 'That does not look like a Google Apps Script web app link (https://script.google.com/…).'); return; } S.resultsUrl = u; save(); toast('', u ? 'Results link saved on this device.' : 'Results link removed from this device.'); render(); },
  ttest: () => {
    const u = resultsUrl(); if (!u) { toast('', 'Save a results link first.'); return; }
    postResult(u, { test: true, id: 'test-' + Date.now().toString(36), submitted: new Date().toISOString(), name: 'TEST ROW — delete me', board: '-', tier: '-', paper: 'Connection test', score: 0, total: 0, percent: 0, grade: '-', questions: [], extraLog: [] })
      .then(ok => toast('', ok ? 'Test sent. Check your Google Sheet for a row called "TEST ROW".' : 'Could not reach the link. Check it and the internet connection.'));
  },
  tlink: () => { const u = resultsUrl(); if (!u) { toast('', 'Save a results link first.'); return; } copyText(location.origin + location.pathname + '?results=' + encodeURIComponent(u), 'Student link'); },

/* ---- sending ---- */
function postResult(url, payload) {

    paper: v.model, variant: v.id, calculator: v.calc ? 'Yes' : 'No', date: rep.date, minutesAllowed: diagMinutes(v), timeUsed: fmtTime(rep.secs),
    score: rep.score, total: rep.total, percent: rep.pct, grade: gTxt(rep.grade), target: d.target,
    extraTime: ex ? 'Yes' : 'No', extraMinutes: ex ? ex.mins : '', extraTimeUsed: ex ? fmtTime(ex.used) : '',

const _diagResD = diagRes;
diagRes = function () {
  const rep = (S.diags || [])[vp.i]; let html = _diagResD(); if (!rep) return html;
  return html.replace('<article class="card"><h2>By area of maths</h2>', `<article class="card"><h2>Your teacher</h2>${sendCard(rep, vp.i)}${rep.extra ? '' : extraCard(rep)}</article>${rep.extra ? extraCard(rep) : ''}<article class="card"><h2>By area of maths</h2>`)
    .replace(/time used [^·<]*of (\d+) min/, (m, a) => rep.extra ? `normal time ${a} min + ${rep.extra.mins} min extra time` : m);
};
const _diagTextD = diagText;
diagText = function (rep) {
  let t = _diagTextD(rep);
  if (rep.group) t = t.replace('\n', `\nGroup: ${rep.group}\n`);
  if (rep.extra) {
    const ex = rep.extra;
    t += `\n\nExtra time: ${ex.mins} min allowed, ${fmtTime(ex.used)} used.\nScore at end of normal time: ${ex.stdScore}/${rep.total} (grade ${gTxt(ex.stdGrade)}). Final score: ${rep.score}/${rep.total} (grade ${gTxt(rep.grade)}).`;
    t += '\nChanges during extra time:' + (ex.log.length ? ex.log.map(l => `\n  +${clock(l.at)} Q${l.q} (${l.src}) ${l.kind}: ${l.before} → ${l.after}`).join('') : ' none');
  } else t += '\n\nExtra time: not used.';
  return t;
};

/* ---- play screen: show extra time clearly ---- */
const _playD = play;
play = function () {
  let html = _playD();
  if (sess && sess.cfg.diag && sess.extra) html = html.replace('<div class="hud">', `<div class="callout extra">${ic('clock', 18)}<div><b>Extra time</b> · ${sess.extra.mins} minutes. Answers you add or change now are logged for your teacher.</div></div><div class="hud">`);
  return html;
};

/* ---- Settings: teacher's results link ---- */
const _settingsD = settings;
settings = function () {
  const u = resultsUrl(), fromFile = !S.resultsUrl && RESULTS_URL_DEFAULT;
  const card = `<article class="card"><h2>Teacher: receive results</h2>
    <p class="small mut">Finished diagnostic tests are sent to your Google Sheet. Paste the web app link from your Google Apps Script below (or put it in the game file once, so every student's copy uses it).</p>
    <label class="small mut" for="turl">Results link</label><label class="ans" style="margin-top:6px"><input id="turl" autocomplete="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(S.resultsUrl || '')}"></label>
    ${fromFile ? '<p class="small mut">Using the link built into this copy of the game.</p>' : ''}
    <div class="row wrapf" style="gap:10px;margin-top:10px"><button class="btn sm" data-act="tsave">Save link</button><button class="btn sm sec" data-act="ttest" ${u ? '' : 'disabled'}>Send a test row</button><button class="btn sm sec" data-act="tlink" ${u ? '' : 'disabled'}>Copy student link</button></div>
    <p class="small mut" style="margin-top:8px">Status: ${u ? 'results will be sent' : 'no link set, so results stay on this device'}.</p></article>`;
  return _settingsD().replace(/<\/main>\s*$/, card + '</main>');
};
</script>
<script>/* =========================================================
   LESSON PLAYER — learn first, then practise
   ========================================================= */
let les = null;
const learned = id => !!(S.lessons && S.lessons[id]);
function lessonCards(t) {
  const L = LESSONS[t.id], c = ['intro', 'how', 'ex'];
  if (L.ex2) c.push('ex2');
  c.push('wr', 'gap', 'check', 'done'); return c;
}
function startLesson(id) {
  const t = TOPIC(id), T = TIERS[S.tier]; const avail = topicsForTier(S.tier).includes(t) ? S.tier : 'M';
  const lo = Math.max(TIERS[avail].min, Math.min(...t.v.map(v => v.g)));
  const sd = new Set(); const qc = []; for (let i = 0; i < 3; i++) { const q = generate(t, lo + (i === 2 ? 1 : 0), avail, sd); sd.add(q.key); qc.push(q); }
  les = { id, cards: lessonCards(t), i: 0, step: 0, step2: 0, gap: null, qc, qi: 0, qfb: null, qok: 0 }; go('lesson');
}
function lessonCheck(mc) {
  const q = les.qc[les.qi]; const input = q.kind === 'mc' ? mc : q.kind === 'multi' ? [...app.querySelectorAll('[data-lfield]')].map(i => i.value) : (document.getElementById('lans') || {}).value;
  const r = check(q, input); if (r.invalid) { const b = app.querySelector('.ansbox'); if (b) { b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); } return; }
  if (r.ok) { les.qok++; sound('ok'); confetti(); } else sound('bad');
  les.qfb = { ok: r.ok, why: r.why, input, mc }; render();
}
function finishLesson() {
  S.lessons = S.lessons || {}; const first = !S.lessons[les.id]; S.lessons[les.id] = today();
  if (first) { S.xp += 40; S.coins += 10; toast('🎓', `Lesson complete: ${TOPIC(les.id).name}! +40 XP`); confetti(true); }
  const t = TOPIC(les.id); if (S.ch.start) { const cc = S.ch.c[t.cat] || (S.ch.c[t.cat] = { xp: 0, n: 0 }); cc.les = cc.les || {}; cc.les[t.id] = 1; }
  checkAch(); checkDays(); save();
}
function nextLesson(after) {
  const list = topicsForTier(S.tier); const D = curDay(), cat = S.ch.start && D < 5 ? DAYS[D - 1].cat : null;
  const pool = cat ? list.filter(t => t.cat === cat) : list; const i = pool.findIndex(t => t.id === after);
  return pool.slice(i + 1).find(t => !learned(t.id)) || pool.find(t => !learned(t.id) && t.id !== after) || list.find(t => !learned(t.id) && t.id !== after) || null;
}
Object.assign(ACT, {
  lesson: a => startLesson(a),
  lquit: () => go('topic', { id: les.id }),
  lstep: a => { if (a === 'ex2') les.step2++; else les.step++; render(); },
  lnext: () => { const c = les.cards[les.i]; if (c === 'check' && les.qi < 2) { les.qi++; les.qfb = null; les.qh = false; render(); return; } les.i = Math.min(les.cards.length - 1, les.i + 1); if (les.cards[les.i] === 'done') finishLesson(); render(); window.scrollTo(0, 0); },
  lprev: () => { les.i = Math.max(0, les.i - 1); render(); window.scrollTo(0, 0); },
  lgap: () => { const v = parseValue(document.getElementById('gapin').value); if (v == null) { const b = app.querySelector('.ansbox'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); return; } const ok = Math.abs(v - LESSONS[les.id].gap.a) < 1e-9; les.gap = { v: document.getElementById('gapin').value, ok, tries: (les.gap ? les.gap.tries : 0) + 1 }; if (ok) { sound('ok'); confetti(); } render(); },
  lcheck: () => lessonCheck(), lmc: a => lessonCheck(+a), lhint: () => { les.qh = true; render(); },
  lshow: () => { S.learned++; les.qfb = { ok: false, shown: true }; render(); },
  lpractise: a => start({ mode: a, topic: les.id }),
});
document.addEventListener('keydown', e => {
  if (view !== 'lesson' || !les) return; const card = les.cards[les.i];
  if (e.key === 'Escape') { ACT.lquit(); return; }
  if (e.key !== 'Enter' || e.target.tagName === 'BUTTON') return; e.preventDefault();
  if (card === 'gap' && !(les.gap && les.gap.ok)) return ACT.lgap();
  if (card === 'check' && !les.qfb && les.qc[les.qi].kind !== 'mc') return ACT.lcheck();
  const nb = app.querySelector('[data-act=lnext]'); if (nb && !nb.disabled) ACT.lnext();
});

render();
</script>
