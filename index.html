    return Q({ kind: 'multi', text: `Solve:<br>${poly([[a1, 'x'], [b1, 'y']])} = ${fmt(c1)}<br>${poly([[a2, 'x'], [b2, 'y']])} = ${fmt(c2)}`, fields: [{ label: 'x', answer: x }, { label: 'y', answer: y }],
      hint: 'Multiply one or both equations so the x terms (or y terms) match, then eliminate.', steps: [`Multiply eq.1 by ${a2} and eq.2 by ${a1} so both have ${a1 * a2}x`, `Subtract to eliminate x: ${poly([[b1 * a2 - b2 * a1, 'y']])} = ${fmt(c1 * a2 - c2 * a1)} → y = ${fmt(y)}`, `Substitute back → x = ${fmt(x)}`, `<b>x = ${fmt(x)}, y = ${fmt(y)}</b>`] }); } },
  { g: 6, f() { const A = R(5, 15), C = R(2, 8), a1 = R(2, 4), c1 = R(1, 4), a2 = R(1, 4), c2 = R(2, 5); if (a1 * c2 === a2 * c1) return TOPIC('simultaneous').v[1].f();
    return Q({ kind: 'multi', text: `${a1} adult tickets and ${c1} child tickets cost £${a1 * A + c1 * C}.<br>${a2} adult tickets and ${c2} child tickets cost £${a2 * A + c2 * C}.<br>Find the cost of each ticket.`, fields: [{ label: 'Adult £', answer: A }, { label: 'Child £', answer: C }],
      hint: 'Let a = adult price and c = child price. Write two equations.', steps: [`${a1}a + ${c1}c = ${a1 * A + c1 * C}`, `${a2}a + ${c2}c = ${a2 * A + c2 * C}`, 'Eliminate one letter, solve, then substitute.', `<b>Adult £${A}, child £${C}</b>`] }); } },
  { g: 8, f() { const r1 = R(-4, 4); let r2; do { r2 = R(-4, 4); } while (r2 === r1); const m = r1 + r2, q = R(-5, 5), c = q - r1 * r2;
    return Q({ kind: 'multi', unordered: true, text: `Solve the simultaneous equations:<br>y = x² ${sgn(q)}<br>y = ${poly([[m, 'x'], [c, '']])}<br><small>Give both x values.</small>`.replace('+ 0', ''), fields: [{ label: 'x₁', answer: r1 }, { label: 'x₂', answer: r2 }],
      hint: 'Set the two expressions for y equal to each other, then solve the quadratic.', steps: [`x² ${sgn(q)} = ${poly([[m, 'x'], [c, '']])}`, `${poly([[1, X2], [-m, 'x'], [q - c, '']])} = 0`, `${br([[1, 'x'], [-r1, '']])}${br([[1, 'x'], [-r2, '']])} = 0`, `<b>x = ${fmt(r1)} or x = ${fmt(r2)}</b>`] }); } },
  ] },

{ id: 'quadratics', name: 'Quadratics', cat: 'Algebra', icon: 'x²',
  learn: ['A quadratic has an x² term. Rearrange to = 0 first.', 'Factorise, then set each bracket to 0: (x + 3)(x − 2) = 0 → x = −3 or x = 2.', 'Quadratic formula: x = (−b ± √(b² − 4ac)) ÷ 2a.', 'Completing the square: x² + bx + c = (x + b/2)² − (b/2)² + c. Turning point is (−b/2, …).'],
  mis: ['Getting the signs wrong: (x + 3) = 0 gives x = −3, not 3.', 'Forgetting the ± in the formula (two answers).', 'Dividing only part of the formula by 2a.'],
  v: [
  { g: 5, f() { const p = NZ(-9, 9); let q; do { q = NZ(-9, 9); } while (q === p); const b = -(p + q), c = p * q;
    return Q({ kind: 'multi', unordered: true, text: `Solve ${poly([[1, X2], [b, 'x'], [c, '']])} = 0`, fields: [{ label: 'x =', answer: p }, { label: 'or x =', answer: q }], mtraps: [{ v: [-p, -q], why: 'The signs are flipped. If (x − 3) = 0 then x = +3.' }],
      hint: `Factorise: find two numbers that multiply to ${c} and add to ${b}.`, steps: [`${br([[1, 'x'], [-p, '']])}${br([[1, 'x'], [-q, '']])} = 0`, `Each bracket = 0`, `<b>x = ${fmt(p)} or x = ${fmt(q)}</b>`] }); } },
  { g: 7, f() { let pa, r, s; do { pa = P([2, 3, 5]); r = NZ(-7, 7); s = NZ(-6, 6); } while (gcd(pa, r) !== 1); const A = pa, B = pa * s + r, C = r * s;
    return Q({ kind: 'multi', unordered: true, text: `Solve ${poly([[A, X2], [B, 'x'], [C, '']])} = 0<br><small>Fractions are fine, e.g. −3/2.</small>`, fields: [{ label: 'x =', answer: -r / pa, frac: [-r, pa] }, { label: 'or x =', answer: -s }],
      hint: 'Factorise into (' + pa + 'x ± ?)(x ± ?).', steps: [`${br([[pa, 'x'], [r, '']])}${br([[1, 'x'], [s, '']])} = 0`, `${pa}x ${sgn(r)} = 0 → x = ${fr(-r, pa)}`, `x ${sgn(s)} = 0 → x = ${fmt(-s)}`, `<b>x = ${fr(-r, pa)} or x = ${fmt(-s)}</b>`] }); } },
  { g: 7, f() { let a, b, c, D; do { a = R(1, 3); b = NZ(-9, 9); c = NZ(-9, 9); D = b * b - 4 * a * c; } while (D <= 0 || Math.sqrt(D) % 1 === 0); const x1 = (-b + Math.sqrt(D)) / (2 * a), x2 = (-b - Math.sqrt(D)) / (2 * a);
    return Q({ kind: 'multi', unordered: true, text: `Solve ${poly([[a, X2], [b, 'x'], [c, '']])} = 0<br>${dpTxt(2)}`, fields: [{ label: 'x =', answer: rnd(x1, 2), exact: x1, dp: 2 }, { label: 'or x =', answer: rnd(x2, 2), exact: x2, dp: 2 }],
      hint: 'It doesn\'t factorise — use the quadratic formula.', steps: [`a = ${a}, b = ${fmt(b)}, c = ${fmt(c)}`, `b² − 4ac = ${b * b} − ${4 * a * c} = ${D}`, `x = (${fmt(-b)} ± √${D}) ÷ ${2 * a}`, `<b>x = ${fmt(x1, 2)} or x = ${fmt(x2, 2)}</b>`] }); } },
  { g: 8, f() { const h = NZ(-6, 6), b = 2 * h, c = NZ(-12, 12), q = c - h * h;
    return Q({ kind: 'multi', text: `Write ${poly([[1, X2], [b, 'x'], [c, '']])} in the form (x + p)² + q.<br><small>Give the values of p and q.</small>`, fields: [{ label: 'p', answer: h }, { label: 'q', answer: q }],
      hint: `Halve the x coefficient: ${fmt(b)} ÷ 2 = ${fmt(h)}.`, steps: [`p = ${fmt(b)} ÷ 2 = ${fmt(h)}`, `(x ${sgn(h)})² = ${poly([[1, X2], [b, 'x'], [h * h, '']])}`, `q = ${fmt(c)} − ${h * h} = ${fmt(q)}`, `<b>(x ${sgn(h)})² ${sgn(q)}</b>`] }); } },
  { g: 8, f() { const h = NZ(-5, 5), b = 2 * h, c = NZ(-10, 10), q = c - h * h;
    return Q({ kind: 'multi', text: `Find the coordinates of the turning point of y = ${poly([[1, X2], [b, 'x'], [c, '']])}`, fields: [{ label: 'x', answer: -h }, { label: 'y', answer: q }], mtraps: [{ v: [h, q], why: 'Turning point of (x + p)² + q is at x = −p (opposite sign!).' }],
      hint: 'Complete the square: (x + p)² + q has turning point (−p, q).', steps: [`y = (x ${sgn(h)})² ${sgn(q)}`, `Turning point (${fmt(-h)}, ${fmt(q)})`, `<b>(${fmt(-h)}, ${fmt(q)})</b>`] }); } },
  ] },

{ id: 'functions', name: 'Functions', cat: 'Algebra', icon: 'f(x)',
  learn: ['f(x) is a rule: f(x) = 2x + 3 means "double, then add 3".', 'f(4) means put 4 in for x.', 'Inverse f⁻¹(x) undoes f. Swap x and y, then rearrange.', 'fg(x) means do g FIRST, then f.'],
  mis: ['Doing fg in the wrong order (g first!).', 'Thinking f⁻¹(x) means 1/f(x).', 'Running a function machine forwards when you need to go backwards.'],
  v: [
  { g: 2, f() { const a = R(2, 6), b = R(1, 15), x = R(2, 12), back = Math.random() < .5, out = a * x + b;
    return Q({ text: back ? `The output of this machine is ${out}. What was the input?` : `The input to this machine is ${x}. What is the output?`, svg: svgMachine([`× ${a}`, `+ ${b}`]), answer: back ? x : out,
      hint: back ? 'Go backwards with inverse operations: − then ÷.' : `Multiply by ${a}, then add ${b}.`,
      steps: back ? [`${out} − ${b} = ${out - b}`, `${out - b} ÷ ${a} = <b>${x}</b>`] : [`${x} × ${a} = ${a * x}`, `${a * x} + ${b} = <b>${out}</b>`], traps: back ? [{ v: rnd(out / a - b, 3), why: 'Undo in REVERSE order: subtract first, then divide.' }] : [{ v: a * (x + b), why: 'Multiply first, then add.' }] }); } },
  { g: 4, f() { const a = NZ(-6, 7), b = NZ(-10, 10), n = R(-5, 8);
    return Q({ text: `f(x) = ${poly([[a, 'x'], [b, '']])}<br>Work out f(${fmt(n)}).`, answer: a * n + b, hint: `Replace x with ${fmt(n)}.`, steps: [`f(${fmt(n)}) = ${a} × ${neg(n)} ${sgn(b)}`, `= <b>${fmt(a * n + b)}</b>`] }); } },
  { g: 6, f() { const a = R(2, 6), b = NZ(-10, 10), k = R(-3, 9), n = a * k + b;
    return Q({ text: `f(x) = ${poly([[a, 'x'], [b, '']])}<br>Work out f⁻¹(${fmt(n)}).`, answer: k, hint: 'f⁻¹ undoes f. Which x gives an output of ' + fmt(n) + '?',
      steps: [`f⁻¹(x) = <span class="fr"><span>x ${sgn(-b)}</span><span>${a}</span></span>`, `f⁻¹(${fmt(n)}) = (${fmt(n)} ${sgn(-b)}) ÷ ${a}`, `= <b>${fmt(k)}</b>`], traps: [{ v: a * n + b, why: 'That is f(' + fmt(n) + '). The inverse goes backwards.' }, { v: rnd(1 / (a * n + b), 4), why: 'f⁻¹ does not mean 1 ÷ f.' }] }); } },
  { g: 7, f() { const a = R(2, 5), b = NZ(-6, 6), c = R(1, 4), d = NZ(-5, 5), n = R(-3, 5), sq_ = Math.random() < .5;
    const g = x => sq_ ? x * x + d : c * x + d, f = x => a * x + b, gs = sq_ ? poly([[1, X2], [d, '']]) : poly([[c, 'x'], [d, '']]);
    return Q({ text: `f(x) = ${poly([[a, 'x'], [b, '']])} and g(x) = ${gs}<br>Work out fg(${fmt(n)}).`, answer: f(g(n)), hint: 'fg means do g FIRST, then put the answer into f.',
      steps: [`g(${fmt(n)}) = ${fmt(g(n))}`, `f(${fmt(g(n))}) = ${a} × ${neg(g(n))} ${sgn(b)}`, `= <b>${fmt(f(g(n)))}</b>`], traps: [{ v: g(f(n)), why: 'That is gf. For fg, apply g first.' }, { v: f(n) * g(n), why: 'fg is a composite (one after the other), not multiplying.' }] }); } },
  ] },

/* ======================== GEOMETRY ======================== */
{ id: 'angles', name: 'Angles', cat: 'Geometry', icon: '∠',
  learn: ['Angles on a straight line add to 180°. Around a point: 360°.', 'Angles in a triangle add to 180°. Quadrilateral: 360°.', 'Parallel lines: alternate angles are equal (Z), corresponding equal (F), co-interior add to 180° (C).', 'Polygon: exterior angles add to 360°. Interior + exterior = 180°.'],
  mis: ['Mixing up 180° (line/triangle) and 360° (point/quadrilateral).', 'Thinking co-interior angles are equal — they add to 180°.', 'Using (n − 2) × 180 for ONE interior angle — that is the total.'],
  v: [
  { g: 1, f() { if (Math.random() < .5) { const a = R(20, 80), b = R(20, 180 - a - 10); return Q({ text: `Three angles lie on a straight line: ${a}°, ${b}° and x°.<br>Find x.`, answer: 180 - a - b, unit: '°', hint: 'Angles on a straight line add up to 180°.', steps: [`${a} + ${b} = ${a + b}`, `x = 180 − ${a + b} = <b>${180 - a - b}°</b>`], traps: [{ v: 360 - a - b, why: 'A straight line is 180°, not 360°.' }] }); }
    const a = R(50, 150), b = R(40, 150), c = R(30, 360 - a - b - 20); return Q({ text: `Four angles meet at a point: ${a}°, ${b}°, ${c}° and x°.<br>Find x.`, answer: 360 - a - b - c, unit: '°', hint: 'Angles around a point add to 360°.', steps: [`${a} + ${b} + ${c} = ${a + b + c}`, `x = 360 − ${a + b + c} = <b>${360 - a - b - c}°</b>`], traps: [{ v: 180 - a - b - c, why: 'Around a point is 360°.' }] }); } },
  { g: 2, f() { if (Math.random() < .5) { const a = R(20, 100), b = R(20, 160 - a); return Q({ text: `Two angles in a triangle are ${a}° and ${b}°.<br>Find the third angle.`, answer: 180 - a - b, unit: '°', hint: 'Angles in a triangle add to 180°.', steps: [`180 − ${a} − ${b} = <b>${180 - a - b}°</b>`], traps: [{ v: 360 - a - b, why: 'Triangles add to 180°.' }] }); }
    const ap = R(10, 80) * 2; return Q({ text: `An isosceles triangle has a top (apex) angle of ${ap}°.<br>Find one of the two equal base angles.`, answer: (180 - ap) / 2, unit: '°', hint: 'The other two angles are equal and share what is left of 180°.', steps: [`180 − ${ap} = ${180 - ap}`, `÷ 2 = <b>${(180 - ap) / 2}°</b>`], traps: [{ v: 180 - ap, why: 'There are TWO equal base angles — halve it.' }] }); } },
  { g: 3, f() { const a = R(35, 145), t = P(['alternate', 'corresponding', 'co-interior']), ans = t === 'co-interior' ? 180 - a : a;
    return Q({ text: `Two parallel lines are crossed by a straight line. One angle is ${a}°.<br>Angle x is <b>${t}</b> to it. Find x.`, answer: ans, unit: '°', hint: t === 'co-interior' ? 'Co-interior (C-shape) angles add to 180°.' : `${t[0].toUpperCase() + t.slice(1)} angles are equal.`,
      steps: [t === 'co-interior' ? `Co-interior angles add to 180°: 180 − ${a}` : `${t[0].toUpperCase() + t.slice(1)} angles are equal`, `<b>x = ${ans}°</b>`], traps: [{ v: t === 'co-interior' ? a : 180 - a, why: t === 'co-interior' ? 'Co-interior angles are NOT equal — they add to 180°.' : `${t} angles are equal, not supplementary.` }] }); } },
  { g: 4, f() { const n = P([5, 6, 8, 9, 10, 12, 15, 18, 20]), names = { 5: 'pentagon', 6: 'hexagon', 8: 'octagon', 9: 'nonagon', 10: 'decagon', 12: 'dodecagon', 15: '15-sided polygon', 18: '18-sided polygon', 20: '20-sided polygon' }, t = R(0, 2);
    if (t === 0) return Q({ text: `Find the size of one <b>interior</b> angle of a regular ${names[n]}.`, answer: 180 * (n - 2) / n, unit: '°', hint: 'Find the exterior angle (360 ÷ n), then subtract from 180.', steps: [`Exterior = 360 ÷ ${n} = ${360 / n}°`, `Interior = 180 − ${360 / n} = <b>${180 * (n - 2) / n}°</b>`], traps: [{ v: 180 * (n - 2), why: 'That is the SUM of all interior angles. Divide by ' + n + '.' }, { v: 360 / n, why: 'That is the exterior angle.' }] });
    if (t === 1) return Q({ text: `Find the sum of the interior angles of a ${names[n]}.`, answer: 180 * (n - 2), unit: '°', hint: 'Sum = (n − 2) × 180°.', steps: [`(${n} − 2) × 180`, `= <b>${180 * (n - 2)}°</b>`], traps: [{ v: 180 * n, why: 'Use (n − 2) — the polygon splits into n − 2 triangles.' }] });
    return Q({ text: `Each exterior angle of a regular polygon is ${360 / n}°.<br>How many sides does it have?`, answer: n, hint: 'Exterior angles add to 360°.', steps: [`360 ÷ ${360 / n} = <b>${n}</b>`], traps: [{ v: rnd(180 / (360 / n), 3), why: 'Exterior angles add to 360°, not 180°.' }] }); } },
  ] },

{ id: 'area', name: 'Area', cat: 'Geometry', icon: '▭',
  learn: ['Rectangle: length × width. Triangle: ½ × base × height.', 'Parallelogram: base × perpendicular height. Trapezium: ½(a + b)h.', 'Circle: πr² (use the RADIUS).', 'Sector: (θ/360) × πr². Area units are squared (cm²).'],
  mis: ['Forgetting the ½ for triangles.', 'Using the slanted side instead of the perpendicular height.', 'Using the diameter in πr².'],
  v: [
  { g: 1, f() { const l = R(3, 20), w = R(2, 15); return Q({ text: `A rectangle is ${l} cm long and ${w} cm wide. Find its area.`, answer: l * w, unit: 'cm²', hint: 'Area = length × width.', steps: [`${l} × ${w} = <b>${l * w} cm²</b>`], traps: [{ v: 2 * (l + w), why: 'That is the perimeter. Area = length × width.' }] }); } },
  { g: 2, f() { const b = R(2, 15) * 2, h = R(3, 15); return Q({ text: `A triangle has base ${b} cm and perpendicular height ${h} cm.<br>Find its area.`, answer: b * h / 2, unit: 'cm²', hint: 'Area = ½ × base × height.', steps: [`${b} × ${h} = ${b * h}`, `÷ 2 = <b>${b * h / 2} cm²</b>`], traps: [{ v: b * h, why: 'Don\'t forget to halve it for a triangle.' }] }); } },
  { g: 3, f() { const a = R(3, 12), b = a + R(2, 8), h = R(2, 10) * 2 - (Math.random() < .5 ? 1 : 0); const A = (a + b) * h / 2;
    return Q({ text: `A trapezium has parallel sides ${a} cm and ${b} cm. The height is ${h} cm.<br>Find its area.`, answer: A, unit: 'cm²', hint: 'Area = ½(a + b) × h', steps: [`a + b = ${a + b}`, `× ${h} = ${(a + b) * h}`, `÷ 2 = <b>${fmt(A)} cm²</b>`], traps: [{ v: (a + b) * h, why: 'Remember the ½.' }, { v: a * b * h / 2, why: 'ADD the parallel sides, don\'t multiply them.' }] }); } },
  { g: 4, f() { const r = R(2, 15), dia = Math.random() < .5, ex = Math.PI * r * r;
    return Q({ text: `A circle has a ${dia ? 'diameter' : 'radius'} of ${dia ? 2 * r : r} cm.<br>Find its area. ${dpTxt(1)}`, answer: rnd(ex, 1), exact: ex, dp: 1, unit: 'cm²', hint: dia ? 'Halve the diameter to get the radius, then use πr².' : 'Area = π × r × r',
      steps: [dia ? `r = ${2 * r} ÷ 2 = ${r}` : `r = ${r}`, `π × ${r}² = π × ${r * r}`, `= <b>${fmt(ex, 1)} cm²</b>`], traps: [{ v: rnd(2 * Math.PI * r, 1), why: 'That is the circumference (2πr). Area is πr².' }, ...(dia ? [{ v: rnd(Math.PI * 4 * r * r, 1), why: 'You used the diameter. Halve it first to get the radius.' }] : [])] }); } },
  { g: 5, f() { const W = R(8, 16), H = R(8, 16), w = R(2, W - 3), h = R(2, H - 3), A = W * H - w * h;
    return Q({ text: `This L-shape is a ${W} cm by ${H} cm rectangle with a ${w} cm by ${h} cm rectangle cut out of the corner.<br>Find its area.`, svg: svgL(W, H, w, h), answer: A, unit: 'cm²', hint: 'Big rectangle minus the missing rectangle.',
      steps: [`Big rectangle: ${W} × ${H} = ${W * H}`, `Cut-out: ${w} × ${h} = ${w * h}`, `${W * H} − ${w * h} = <b>${A} cm²</b>`], traps: [{ v: W * H, why: 'Subtract the cut-out corner.' }] }); } },
  { g: 6, f() { const r = R(3, 15), th = P([30, 40, 45, 60, 72, 80, 90, 100, 120, 135, 150]), ex = th / 360 * Math.PI * r * r;
    return Q({ text: `A sector has radius ${r} cm and angle ${th}°.<br>Find its area. ${dpTxt(1)}`, answer: rnd(ex, 1), exact: ex, dp: 1, unit: 'cm²', hint: 'Sector area = (angle ÷ 360) × πr²',
      steps: [`${th} ÷ 360 = ${fmt(th / 360, 4)}`, `× π × ${r}² = ${fmt(ex, 3)}`, `<b>${fmt(ex, 1)} cm²</b>`], traps: [{ v: rnd(th / 360 * 2 * Math.PI * r, 1), why: 'That is the arc length. For area use πr².' }] }); } },
  ] },

{ id: 'perimeter', name: 'Perimeter', cat: 'Geometry', icon: '⬚',
  learn: ['Perimeter is the distance all the way round — add up every side.', 'Circumference = πd = 2πr.', 'Semicircle perimeter = half the circumference + the diameter.', 'Arc length = (θ/360) × 2πr.'],
  mis: ['Adding only two sides of a rectangle.', 'Forgetting the straight edge (diameter) of a semicircle.', 'Using πr² (area) instead of 2πr.'],
  v: [
  { g: 1, f() { const l = R(3, 25), w = R(2, 20); return Q({ text: `Find the perimeter of a rectangle ${l} cm by ${w} cm.`, answer: 2 * (l + w), unit: 'cm', hint: 'Add all FOUR sides.', steps: [`${l} + ${w} + ${l} + ${w}`, `= <b>${2 * (l + w)} cm</b>`], traps: [{ v: l + w, why: 'A rectangle has four sides — add them all.' }, { v: l * w, why: 'That is the area.' }] }); } },
  { g: 2, f() { const l = R(4, 20), w = R(2, 15), Pm = 2 * (l + w); return Q({ text: `A rectangle has perimeter ${Pm} cm and length ${l} cm.<br>Find its width.`, answer: w, unit: 'cm', hint: 'Two lengths use up 2 × ' + l + ' cm.', steps: [`${Pm} − 2 × ${l} = ${Pm - 2 * l}`, `÷ 2 = <b>${w} cm</b>`], traps: [{ v: Pm - l, why: 'There are TWO lengths and TWO widths.' }, { v: Pm - 2 * l, why: 'That is two widths — halve it.' }] }); } },
  { g: 3, f() { const W = R(8, 16), H = R(8, 16), w = R(2, W - 3), h = R(2, H - 3);
    return Q({ text: `Find the perimeter of this L-shape.`, svg: svgL(W, H, w, h), answer: 2 * (W + H), unit: 'cm', hint: 'Work out any missing side lengths first, then add all 6 sides.',
      steps: [`Missing sides: ${W} − ${w} = ${W - w}, ${H} − ${h} = ${H - h}`, `${W} + ${H} + ${W - w} + ${h} + ${w} + ${H - h}`, `= <b>${2 * (W + H)} cm</b>`] }); } },
  { g: 4, f() { const r = R(2, 15), dia = Math.random() < .5, ex = 2 * Math.PI * r;
    return Q({ text: `Find the circumference of a circle with ${dia ? 'diameter' : 'radius'} ${dia ? 2 * r : r} cm. ${dpTxt(1)}`, answer: rnd(ex, 1), exact: ex, dp: 1, unit: 'cm', hint: 'C = π × diameter',
      steps: [`d = ${2 * r}`, `π × ${2 * r} = <b>${fmt(ex, 1)} cm</b>`], traps: [{ v: rnd(Math.PI * r, 1), why: 'You used the radius. C = π × DIAMETER (or 2πr).' }, { v: rnd(Math.PI * r * r, 1), why: 'That is the area.' }] }); } },
  { g: 5, f() { const d = R(4, 20) * 2, ex = Math.PI * d / 2 + d;
    return Q({ text: `A semicircle has diameter ${d} cm.<br>Find its perimeter. ${dpTxt(1)}`, answer: rnd(ex, 1), exact: ex, dp: 1, unit: 'cm', hint: 'Half the circumference PLUS the straight edge.',
      steps: [`Curved: π × ${d} ÷ 2 = ${fmt(Math.PI * d / 2, 2)}`, `+ diameter ${d}`, `= <b>${fmt(ex, 1)} cm</b>`], traps: [{ v: rnd(Math.PI * d / 2, 1), why: 'Don\'t forget the straight edge (the diameter).' }] }); } },
  { g: 7, f() { const r = R(4, 15), th = P([40, 45, 60, 72, 80, 100, 120, 135, 150]), arc = th / 360 * 2 * Math.PI * r, ex = arc + 2 * r;
    return Q({ text: `A sector has radius ${r} cm and angle ${th}°.<br>Find its perimeter. ${dpTxt(1)}`, answer: rnd(ex, 1), exact: ex, dp: 1, unit: 'cm', hint: 'Arc length + two radii.',

  { g: 6, f() { const n = R(3, 15), e = R(3, 15), south = Math.random() < .5, a = Math.atan(e / n) / DEG, ex = south ? 180 - a : a;
    return Q({ text: `A boat sails ${n} km due ${south ? 'south' : 'north'} and then ${e} km due east.<br>Find the bearing of the boat from its starting point. ${dpTxt(1)}`, answer: rnd(ex, 1), exact: ex, dp: 1, unit: '°', hint: 'Draw a right-angled triangle. Use tan to find the angle at the start.',
      steps: [`tan θ = ${e} ÷ ${n} → θ = ${fmt(a, 1)}° (from the ${south ? 'south' : 'north'} line)`, south ? `Bearing = 180 − ${fmt(a, 1)}` : 'Bearing is measured from North', `= <b>${fmt(ex, 1)}°</b>`], traps: [{ v: rnd(90 - a, 1), why: 'Measure the angle from the NORTH line, not the east line.' }] }); } },
  ] },

{ id: 'similar', name: 'Similar Shapes', cat: 'Geometry', icon: '◺◿',
  learn: ['Similar shapes: same shape, different size. All angles equal; lengths in the same ratio.', 'Length scale factor k = new length ÷ old length.', 'Area scale factor = k². Volume scale factor = k³.', 'To go from area or volume back to length: square root or cube root.'],
  mis: ['Using the length scale factor for areas or volumes.', 'Dividing the wrong way round (big ÷ small vs small ÷ big).', 'Adding the difference instead of multiplying by the scale factor.'],
  v: [
  { g: 3, f() { const k = R(2, 5), a = R(2, 9), b = R(2, 12);
    return Q({ text: `Shape B is an enlargement of shape A.<br>A side of ${a} cm on A is ${a * k} cm on B.<br>Another side on A is ${b} cm. How long is it on B?`, answer: b * k, unit: 'cm', hint: 'Find the scale factor first.', steps: [`Scale factor = ${a * k} ÷ ${a} = ${k}`, `${b} × ${k} = <b>${b * k} cm</b>`], traps: [{ v: b + a * k - a, why: 'Similar shapes MULTIPLY by the scale factor, not add.' }] }); } },
  { g: 4, f() { const k = P([1.5, 2.5, 0.5, 1.25, 3]), a = R(2, 8) * 2, b = R(2, 10) * 2;
    return Q({ text: `Triangles PQR and XYZ are similar.<br>PQ = ${a} cm and XY = ${fmt(a * k)} cm.<br>QR = ${b} cm. Find YZ.`, answer: b * k, unit: 'cm', hint: 'Scale factor = XY ÷ PQ.', steps: [`k = ${fmt(a * k)} ÷ ${a} = ${k}`, `YZ = ${b} × ${k} = <b>${fmt(b * k)} cm</b>`] }); } },
  { g: 6, f() { const a = R(1, 4), b = a + R(1, 4), A = R(2, 15) * a * a;
    return Q({ text: `Two similar shapes have lengths in the ratio ${a} : ${b}.<br>The smaller one has area ${A} cm². Find the area of the larger one.`, answer: A * b * b / (a * a), unit: 'cm²', hint: `Area scale factor = (length scale factor)².`, steps: [`Length SF = ${b}/${a}`, `Area SF = (${b}/${a})² = ${fr(b * b, a * a)}`, `${A} × ${fr(b * b, a * a)} = <b>${fmt(A * b * b / (a * a))} cm²</b>`], traps: [{ v: rnd(A * b / a, 3), why: 'For AREA, square the length scale factor.' }] }); } },
  { g: 7, f() { const a = R(1, 3), b = a + R(1, 3), h = R(2, 10) * a;
    return Q({ text: `Two similar cylinders have volumes ${a ** 3 * 10} cm³ and ${b ** 3 * 10} cm³.<br>The smaller cylinder is ${h} cm tall. How tall is the larger one?`, answer: h * b / a, unit: 'cm', hint: 'Volume scale factor = k³. Cube root it to find k.', steps: [`Volume SF = ${b ** 3 * 10} ÷ ${a ** 3 * 10} = ${fr(b ** 3, a ** 3)}`, `Length SF = ∛ = ${fr(b, a)}`, `${h} × ${fr(b, a)} = <b>${fmt(h * b / a)} cm</b>`], traps: [{ v: rnd(h * b ** 3 / a ** 3, 3), why: 'You used the volume scale factor on a length. Cube root it first.' }] }); } },
  { g: 8, f() { const a = R(1, 3), b = a + R(1, 3), Aa = 5 * a * a, Ab = 5 * b * b, Va = R(2, 6) * a ** 3;
    return Q({ text: `Two similar solids have surface areas ${Aa} cm² and ${Ab} cm².<br>The smaller solid has volume ${Va} cm³. Find the volume of the larger solid.`, answer: Va * b ** 3 / a ** 3, unit: 'cm³', hint: 'Area SF → square root → length SF → cube it → volume SF.',
      steps: [`Area SF = ${fr(Ab, Aa)}`, `Length SF = √ = ${fr(b, a)}`, `Volume SF = ${fr(b ** 3, a ** 3)}`, `${Va} × ${fr(b ** 3, a ** 3)} = <b>${fmt(Va * b ** 3 / a ** 3)} cm³</b>`], traps: [{ v: rnd(Va * Ab / Aa, 3), why: 'You used the area scale factor for volume. Find the length factor first.' }] }); } },
  ] },

{ id: 'circle-theorems', name: 'Circle Theorems', cat: 'Geometry', icon: '⭕',
  learn: ['Angle at the centre is TWICE the angle at the circumference.', 'Angle in a semicircle is 90°.', 'Opposite angles in a cyclic quadrilateral add to 180°.', 'A tangent meets a radius at 90°. Two tangents from a point are equal.', 'Angles in the same segment are equal. Alternate segment theorem: tangent–chord angle = angle in the alternate segment.'],
  mis: ['Halving when you should double (centre = 2 × circumference).', 'Forgetting that triangles with two radii are isosceles.', 'Not stating the theorem as your reason.'],
  v: [
  { g: 6, f() { const a = R(20, 80), toC = Math.random() < .5;
    return toC ? Q({ text: `Points A, B and C lie on a circle with centre O.<br>Angle ACB (at the circumference) = ${a}°.<br>Find angle AOB (at the centre).`, answer: 2 * a, unit: '°', hint: 'Angle at the centre is twice the angle at the circumference.', steps: [`AOB = 2 × ${a}`, `= <b>${2 * a}°</b>`], traps: [{ v: a / 2, why: 'The CENTRE angle is the bigger one — double it.' }] })
      : Q({ text: `Points A, B and C lie on a circle with centre O.<br>Angle AOB (at the centre) = ${2 * a}°.<br>Find angle ACB (at the circumference).`, answer: a, unit: '°', hint: 'Angle at the circumference is half the angle at the centre.', steps: [`ACB = ${2 * a} ÷ 2`, `= <b>${a}°</b>`], traps: [{ v: 4 * a, why: 'The circumference angle is HALF the centre angle.' }] }); } },
  { g: 6, f() { const a = R(15, 75); return Q({ text: `AB is a diameter of a circle. C is a point on the circumference.<br>Angle CAB = ${a}°. Find angle CBA.`, answer: 90 - a, unit: '°', hint: 'The angle in a semicircle (at C) is 90°.', steps: ['Angle ACB = 90° (angle in a semicircle)', `CBA = 180 − 90 − ${a}`, `= <b>${90 - a}°</b>`], traps: [{ v: 180 - a, why: 'The angle at C is 90° (angle in a semicircle) — include it.' }] }); } },
  { g: 6, f() { const a = R(50, 130); return Q({ text: `ABCD is a cyclic quadrilateral. Angle ABC = ${a}°.<br>Find angle ADC (opposite).`, answer: 180 - a, unit: '°', hint: 'Opposite angles in a cyclic quadrilateral add to 180°.', steps: [`ADC = 180 − ${a}`, `= <b>${180 - a}°</b>`], traps: [{ v: a, why: 'Opposite angles in a cyclic quadrilateral are SUPPLEMENTARY (add to 180°), not equal.' }, { v: 360 - a, why: 'Opposite pairs add to 180°.' }] }); } },
  { g: 7, f() { const a = R(20, 100); return Q({ text: `PA and PB are tangents to a circle with centre O, touching at A and B.<br>Angle APB = ${a}°. Find angle AOB.`, answer: 180 - a, unit: '°', hint: 'A tangent meets a radius at 90°. Use the angles in quadrilateral OAPB.', steps: ['Angles OAP and OBP = 90° (tangent ⟂ radius)', `AOB = 360 − 90 − 90 − ${a}`, `= <b>${180 - a}°</b>`], traps: [{ v: 2 * a, why: 'This isn\'t the centre/circumference rule. Use tangent ⟂ radius.' }] }); } },
  { g: 7, f() { const a = R(20, 70); return Q({ text: `A, B, C and D lie on a circle. Angle ACB = ${a}°.<br>D is on the same side of AB as C. Find angle ADB.`, answer: a, unit: '°', hint: 'Angles in the same segment are equal.', steps: ['Angles in the same segment are equal', `<b>ADB = ${a}°</b>`], traps: [{ v: 180 - a, why: 'That is for opposite angles in a cyclic quad. Here the angles stand on the same chord → equal.' }] }); } },
  { g: 8, f() { const a = R(25, 75); return Q({ text: `O is the centre of a circle. A and B are on the circle, and C is on the major arc.<br>Angle OAB = ${a}°. Find angle ACB.`, answer: 90 - a, unit: '°', hint: 'OA = OB (radii), so triangle OAB is isosceles.', steps: [`OBA = ${a}° (isosceles, OA = OB)`, `AOB = 180 − 2 × ${a} = ${180 - 2 * a}°`, `ACB = ${180 - 2 * a} ÷ 2 (centre is twice circumference)`, `= <b>${90 - a}°</b>`], traps: [{ v: 180 - 2 * a, why: 'That is the angle at the centre. Halve it for the circumference.' }] }); } },
  { g: 8, f() { const a = R(30, 80); return Q({ text: `A tangent touches a circle at A. Chord AB makes an angle of ${a}° with the tangent.<br>C is a point on the circle in the alternate segment. Find angle ACB.`, answer: a, unit: '°', hint: 'Alternate segment theorem.', steps: ['Angle between tangent and chord = angle in the alternate segment', `<b>ACB = ${a}°</b>`], traps: [{ v: 90 - a, why: 'Use the alternate segment theorem — the angles are equal.' }] }); } },
  ] },

/* ======================== STATISTICS ======================== */
{ id: 'averages', name: 'Averages', cat: 'Statistics', icon: 'x̄',
  learn: ['Mean = total ÷ how many. Median = middle value (ORDER first). Mode = most common. Range = biggest − smallest.', 'Even number of values? Median is halfway between the middle two.', 'Mean from a table: Σfx ÷ Σf.', 'Grouped data: use the midpoint of each class to ESTIMATE the mean.'],
  mis: ['Finding the median without putting the numbers in order.', 'Dividing Σfx by the number of rows instead of the total frequency.', 'Using class end-points instead of midpoints for grouped data.'],
  v: [
  { g: 1, f() { const m = R(2, 20), vals = shuffle([m, m, ...Array.from({ length: R(4, 6) }, () => R(1, 25))]); const cnt = {}; vals.forEach(v => cnt[v] = (cnt[v] || 0) + 1); const mx = Math.max(...Object.values(cnt)); const modes = Object.keys(cnt).filter(k => cnt[k] === mx);
    if (modes.length > 1 || Math.random() < .5) { const r = Math.max(...vals) - Math.min(...vals); return Q({ text: `Find the range of: ${vals.join(', ')}`, answer: r, hint: 'Range = biggest − smallest.', steps: [`Biggest ${Math.max(...vals)}, smallest ${Math.min(...vals)}`, `<b>${r}</b>`], traps: [{ v: vals[vals.length - 1] - vals[0], why: 'Use the BIGGEST and SMALLEST values, not the last and first.' }] }); }
    return Q({ text: `Find the mode of: ${vals.join(', ')}`, answer: +modes[0], hint: 'The mode is the most common value.', steps: [`${modes[0]} appears ${mx} times`, `<b>${modes[0]}</b>`] }); } },
  { g: 2, f() { const n = P([7, 8, 9]), vals = Array.from({ length: n }, () => R(1, 40)), s = [...vals].sort((a, b) => a - b), med = n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2, um = n % 2 ? vals[(n - 1) / 2] : (vals[n / 2 - 1] + vals[n / 2]) / 2;
    return Q({ text: `Find the median of: ${vals.join(', ')}`, answer: med, hint: 'Put them in order first!', steps: [`In order: ${s.join(', ')}`, n % 2 ? `Middle (${(n + 1) / 2}th) value` : `Middle two: ${s[n / 2 - 1]} and ${s[n / 2]}, halfway`, `<b>${fmt(med)}</b>`], traps: um !== med ? [{ v: um, why: 'You took the middle of the list without ordering it first.' }] : [] }); } },
  { g: 2, f() { const n = R(4, 7), mean = R(5, 30); const vals = Array.from({ length: n - 1 }, () => R(Math.max(1, mean - 10), mean + 10)); const last = mean * n - sum(vals); if (last < 0 || last > 60) return TOPIC('averages').v[1].f(); vals.push(last); const v = shuffle(vals);
    return Q({ text: `Find the mean of: ${v.join(', ')}`, answer: mean, hint: 'Add them all up, then divide by how many there are.', steps: [`Total = ${mean * n}`, `${mean * n} ÷ ${n} = <b>${mean}</b>`], traps: [{ v: rnd(mean * n / (n - 1), 2), why: `There are ${n} numbers — count them carefully.` }] }); } },
  { g: 3, f() { const n = R(4, 6), mean = R(6, 20), vals = Array.from({ length: n - 1 }, () => R(mean - 5, mean + 6)), miss = mean * n - sum(vals); if (miss < 0) return TOPIC('averages').v[2].f();
    return Q({ text: `${n} numbers have a mean of ${mean}.<br>${n - 1} of them are ${vals.join(', ')}.<br>Find the missing number.`, answer: miss, hint: 'Total of all = mean × how many.', steps: [`Total = ${mean} × ${n} = ${mean * n}`, `Known: ${sum(vals)}`, `Missing = ${mean * n} − ${sum(vals)} = <b>${miss}</b>`] }); } },
  { g: 4, f() { const xs = [0, 1, 2, 3, 4], fs = xs.map(() => R(1, 12)), F = sum(fs), FX = sum(xs.map((x, i) => x * fs[i])), ex = FX / F;
    return Q({ text: `The table shows the number of pets owned by some students.<br>${tbl(['Pets', 'Frequency'], xs.map((x, i) => [x, fs[i]]))}Work out the mean. ${dpTxt(2)}`, answer: rnd(ex, 2), exact: ex, dp: 2, hint: 'Add an f × x column. Mean = Σfx ÷ Σf.',
      steps: [`f × x: ${xs.map((x, i) => x * fs[i]).join(', ')} → Σfx = ${FX}`, `Σf = ${F}`, `${FX} ÷ ${F} = <b>${fmt(ex, 2)}</b>`], traps: [{ v: rnd(FX / 5, 2), why: 'Divide by the TOTAL FREQUENCY (number of students), not the number of rows.' }, { v: rnd(F / 5, 2), why: 'That is the mean of the frequencies. Use Σfx ÷ Σf.' }] }); } },
  { g: 5, f() { const w = 10, cls = [0, 1, 2, 3, 4], fs = cls.map(() => R(2, 15)), mids = cls.map(c => c * w + w / 2), F = sum(fs), FX = sum(mids.map((m, i) => m * fs[i])), ex = FX / F;
    return Q({ text: `Estimate the mean time.<br>${tbl(['Time t (min)', 'Frequency'], cls.map((c, i) => [`${c * w} &lt; t ≤ ${(c + 1) * w}`, fs[i]]))}${dpTxt(1)}`, answer: rnd(ex, 1), exact: ex, dp: 1, unit: 'min', hint: 'Use the midpoint of each class.',
      steps: [`Midpoints: ${mids.join(', ')}`, `Σ(f × midpoint) = ${FX}, Σf = ${F}`, `${FX} ÷ ${F} = <b>${fmt(ex, 1)}</b>`], traps: [{ v: rnd(sum(cls.map((c, i) => (c + 1) * w * fs[i])) / F, 1), why: 'Use the MIDPOINTS, not the top of each class.' }] }); } },
  ] },

{ id: 'histograms', name: 'Histograms', cat: 'Statistics', icon: '📶',
  learn: ['In a histogram, the AREA of each bar shows frequency (not the height).', 'Frequency density = frequency ÷ class width.', 'Frequency = frequency density × class width.', 'Bars can have different widths.'],
  mis: ['Plotting frequency instead of frequency density.', 'Multiplying when you should divide (FD = f ÷ w).', 'Reading the class width wrongly.'],
  v: [
  { g: 6, f() { const opts = []; for (const fd of [0.5, 1, 1.2, 1.5, 2, 2.4, 3, 3.5, 4, 5, 6]) for (const w of [2, 4, 5, 10, 20]) if ((fd * w) % 1 === 0) opts.push([fd, w]); const [fd, w] = P(opts), s = R(0, 6) * 5, f = fd * w;
    return Q({ text: `A class interval is ${s} &lt; h ≤ ${s + w} with frequency ${f}.<br>Work out the frequency density.`, answer: fd, hint: 'FD = frequency ÷ class width.', steps: [`Class width = ${w}`, `${f} ÷ ${w} = <b>${fmt(fd)}</b>`], traps: [{ v: f * w, why: 'Frequency density = frequency ÷ class width (divide, not multiply).' }] }); } },
  { g: 7, f() { const fd = P([0.4, 0.8, 1.5, 2, 2.5, 3, 4.5, 6]), w = P([5, 10, 20, 15]), s = R(1, 8) * 5;
    return Q({ text: `On a histogram, the bar for ${s} &lt; x ≤ ${s + w} has a frequency density of ${fmt(fd)}.<br>How many values are in this class?`, answer: rnd(fd * w, 4), hint: 'Frequency = frequency density × class width.', steps: [`Width = ${w}`, `${fmt(fd)} × ${w} = <b>${fmt(rnd(fd * w, 4))}</b>`], traps: [{ v: rnd(fd / w, 4), why: 'To get frequency, MULTIPLY FD by the class width.' }] }); } },
  { g: 8, f() { const B = [0, 10, 30, 40, 60], fds = [R(1, 4), R(1, 4), R(2, 6), R(1, 3)], i = R(0, 2), j = i + 1, p = B[i] + R(1, B[i + 1] - B[i] - 1), q = B[j] + R(1, B[j + 1] - B[j] - 1), est = fds[i] * (B[i + 1] - p) + fds[j] * (q - B[j]);
    return Q({ text: `${tbl(['Class', 'Frequency density'], fds.map((fd, k) => [`${B[k]} &lt; x ≤ ${B[k + 1]}`, fd]))}Estimate how many values lie between ${p} and ${q}.`, answer: est, hint: 'Find the area of the bars between ' + p + ' and ' + q + '. You need part of two bars.',
      steps: [`${p} to ${B[i + 1]}: ${fds[i]} × ${B[i + 1] - p} = ${fds[i] * (B[i + 1] - p)}`, `${B[j]} to ${q}: ${fds[j]} × ${q - B[j]} = ${fds[j] * (q - B[j])}`, `Total ≈ <b>${est}</b>`] }); } },
  ] },

{ id: 'cumulative-frequency', name: 'Cumulative Frequency', cat: 'Statistics', icon: '📈',
  learn: ['Cumulative frequency is a running total.', 'Plot CF at the UPPER end of each class.', 'Median: read across at n/2. Lower quartile at n/4, upper quartile at 3n/4.', 'IQR = UQ − LQ.'],
  mis: ['Plotting at the midpoint instead of the upper class boundary.', 'Reading the median at n + 1 ÷ 2 for large grouped data — use n ÷ 2.', 'Forgetting to subtract from the total for "more than" questions.'],
  v: [
  { g: 6, f() { const B = [0, 20, 40, 60, 80, 100], fs = [R(1, 8), R(3, 12), R(5, 18), R(3, 12), R(1, 8)], k = R(1, 4), cf = sum(fs.slice(0, k + 1));
    return Q({ text: `${tbl(['Score', 'Frequency'], fs.map((f, i) => [`${B[i]} &lt; s ≤ ${B[i + 1]}`, f]))}What is the cumulative frequency for s ≤ ${B[k + 1]}?`, answer: cf, hint: 'Add up the frequencies up to that point (running total).', steps: [`${fs.slice(0, k + 1).join(' + ')}`, `= <b>${cf}</b>`], traps: [{ v: fs[k], why: 'Cumulative means ADD UP all classes so far.' }] }); } },
  { g: 6, f() { const n = R(4, 30) * 4, q = P([['median', 2], ['lower quartile', 4], ['upper quartile', 4 / 3]]);
    return Q({ text: `A cumulative frequency graph shows the heights of ${n} plants.<br>At what cumulative frequency would you read off the <b>${q[0]}</b>?`, answer: n / q[1], hint: q[0] === 'median' ? 'Halfway: n ÷ 2' : q[0] === 'lower quartile' ? 'A quarter of the way: n ÷ 4' : 'Three quarters: 3n ÷ 4',
      steps: [`${q[0]} → ${q[0] === 'median' ? 'n ÷ 2' : q[0] === 'lower quartile' ? 'n ÷ 4' : '3n ÷ 4'}`, `= <b>${n / q[1]}</b>`] }); } },
  { g: 6, f() { const B = [0, 20, 40, 60, 80, 100], fs = [R(1, 8), R(3, 12), R(5, 18), R(3, 12), R(1, 8)], cfs = fs.map((_, i) => sum(fs.slice(0, i + 1))), n = cfs[4], k = R(0, 3);
    return Q({ text: `${tbl(['Score', 'Cumulative frequency'], cfs.map((c, i) => [`s ≤ ${B[i + 1]}`, c]))}How many scored MORE than ${B[k + 1]}?`, answer: n - cfs[k], hint: 'Total minus those at or below.', steps: [`Total = ${n}`, `${n} − ${cfs[k]} = <b>${n - cfs[k]}</b>`], traps: [{ v: cfs[k], why: 'That is how many scored AT MOST ' + B[k + 1] + '. Subtract from the total.' }] }); } },
  { g: 6, f() { const B = [0, 10, 20, 30, 40, 50], fs = [R(1, 6), R(2, 10), R(4, 15), R(2, 10), R(1, 6)], n = sum(fs), cfs = fs.map((_, i) => sum(fs.slice(0, i + 1))), m = n / 2, ci = cfs.findIndex(c => c >= m), lab = i => `${B[i]} &lt; t ≤ ${B[i + 1]}`;
    return Q({ kind: 'mc', text: `${tbl(['Time t (min)', 'Frequency'], fs.map((f, i) => [lab(i), f]))}Which class contains the median?`, options: MC(lab(ci), [0, 1, 2, 3, 4].filter(i => i !== ci).slice(0, 3).map(i => ({ t: lab(i), why: `The median is the ${fmt(m)}th value. Running totals: ${cfs.join(', ')}.` }))),
      hint: `n = ${n}. Find the class where the running total passes ${fmt(m)}.`, steps: [`n ÷ 2 = ${fmt(m)}`, `Running totals: ${cfs.join(', ')}`, `<b>${lab(ci)}</b>`] }); } },
  ] },

{ id: 'box-plots', name: 'Box Plots', cat: 'Statistics', icon: '⊏⊐',
  learn: ['A box plot shows: minimum, lower quartile (LQ), median, upper quartile (UQ), maximum.', 'The box goes from LQ to UQ. The line inside is the median.', 'IQR = UQ − LQ (the width of the box). Range = max − min.', 'Compare: median (average) and IQR (consistency — smaller IQR = more consistent).'],
  mis: ['Confusing the IQR (box) with the range (whiskers).', 'Saying "bigger IQR = more consistent" — it is the opposite.', 'Not ordering data before finding quartiles.'],
  v: [
  { g: 6, f() { const v = [R(0, 3), 0, 0, 0, 0]; for (let i = 1; i < 5; i++) v[i] = v[i - 1] + R(1, 4); const [mn, q1, md, q3, mx] = v.map(x => x * 5), ask = P(['median', 'IQR', 'range']), ans = { median: md, IQR: q3 - q1, range: mx - mn }[ask];
    return Q({ text: `The box plot shows test scores. Find the <b>${ask === 'IQR' ? 'interquartile range' : ask}</b>.`, svg: svgBox([{ min: mn, q1, med: md, q3, max: mx }], 0, 100, 10), answer: ans,
      hint: { median: 'The line inside the box.', IQR: 'Width of the box: UQ − LQ.', range: 'End of right whisker − end of left whisker.' }[ask], steps: [`Min ${mn}, LQ ${q1}, median ${md}, UQ ${q3}, max ${mx}`, `<b>${ans}</b>`], traps: ask === 'IQR' ? [{ v: mx - mn, why: 'That is the range. The IQR is just the box.' }] : ask === 'range' ? [{ v: q3 - q1, why: 'That is the IQR. Range uses the whiskers.' }] : [] }); } },
  { g: 6, f() { const s = []; let x = R(5, 15); for (let i = 0; i < 11; i++) { s.push(x); x += R(0, 6); } const q1 = s[2], md = s[5], q3 = s[8], ask = P(['lower quartile', 'upper quartile', 'interquartile range']), ans = { 'lower quartile': q1, 'upper quartile': q3, 'interquartile range': q3 - q1 }[ask];
    return Q({ text: `Here are 11 values:<br>${shuffle(s).join(', ')}<br>Find the <b>${ask}</b>.`, answer: ans, hint: 'Order the data. With 11 values: LQ is the 3rd, median the 6th, UQ the 9th.',
      steps: [`Ordered: ${s.join(', ')}`, `LQ (3rd) = ${q1}, median (6th) = ${md}, UQ (9th) = ${q3}`, `<b>${ans}</b>`], traps: [{ v: s[10] - s[0], why: 'That is the range.' }] }); } },

function sfOrd(m, e) { // ordinary-number string for m × 10^e (m has ≤2 sig. digits after point)

/* Generate a question for a topic at a target level */
function generate(topic, level, tier, seen) {
  const T = TIERS[tier]; let pool = topic.v.filter(v => v.g >= T.min && v.g <= T.max); if (!pool.length) pool = topic.v;
  let best = Infinity; pool.forEach(v => best = Math.min(best, Math.abs(v.g - level)));

  let q, tries = 0;

    return Q({ text: `Find the gradient of the line through ${pt(x1, y1)} and ${pt(x2, y2)}.`, answer: m, hint: 'Gradient = change in y ÷ change in x.', steps: [`Change in y: ${fmt(y2)} − ${neg(y1)} = ${fmt(y2 - y1)}`, `Change in x: ${fmt(x2)} − ${neg(x1)} = ${fmt(x2 - x1)}`, `${fmt(y2 - y1)} ÷ ${fmt(x2 - x1)} = <b>${fmt(m)}</b>`], traps: [{ v: rnd((x2 - x1) / (y2 - y1), 4), why: 'Upside down — it\'s change in Y over change in X.' }, { v: -m, why: 'Check the sign: subtract in the same order top and bottom.' }] }); } },
  { g: 4, f() { const x1 = R(-8, 8), y1 = R(-8, 8), x2 = x1 + 2 * R(-5, 5), y2 = y1 + 2 * R(-5, 5); return Q({ kind: 'multi', text: `Find the midpoint of ${pt(x1, y1)} and ${pt(x2, y2)}.`, fields: [{ label: 'x', answer: (x1 + x2) / 2 }, { label: 'y', answer: (y1 + y2) / 2 }], hint: 'Midpoint = the average of the x\'s and the average of the y\'s.', steps: [`x: (${fmt(x1)} + ${fmt(x2)}) ÷ 2 = ${fmt((x1 + x2) / 2)}`, `y: (${fmt(y1)} + ${fmt(y2)}) ÷ 2 = ${fmt((y1 + y2) / 2)}`, `<b>${pt((x1 + x2) / 2, (y1 + y2) / 2)}</b>`] }); } },
  { g: 5, f() { const k = P([2, 3, 4]), m = NZ(-4, 4), c = R(-6, 6); return Q({ text: `Find the gradient of the line ${k}y = ${poly([[k * m, 'x'], [k * c, '']])}`, answer: m, hint: `Divide everything by ${k} to get y = mx + c.`, steps: [`÷ ${k}: y = ${poly([[m, 'x'], [c, '']])}`, `Gradient = <b>${fmt(m)}</b>`], traps: [{ v: k * m, why: `Get y on its own first — divide everything by ${k}.` }] }); } },
  { g: 6, f() { const m = NZ(-5, 5), x1 = R(-4, 5), y1 = R(-6, 9), c = y1 - m * x1; return Q({ kind: 'mc', text: `Find the equation of the line with gradient ${fmt(m)} that passes through ${pt(x1, y1)}.`, options: MC(`y = ${poly([[m, 'x'], [c, '']])}`, [{ t: `y = ${poly([[m, 'x'], [y1, '']])}`, why: 'c is not the y-coordinate of the point. Substitute the point into y = mx + c.' }, { t: `y = ${poly([[m, 'x'], [y1 + m * x1, '']])}`, why: `Check the sign: c = ${fmt(y1)} − (${fmt(m)} × ${neg(x1)}).` }, { t: `y = ${poly([[x1, 'x'], [c, '']])}`.replace('y = 0', 'y = ' + fmt(c)), why: 'The gradient goes in front of x.' }]),
      hint: 'Put m and the point into y = mx + c, then solve for c.', steps: [`${fmt(y1)} = ${fmt(m)} × ${neg(x1)} + c`, `c = ${fmt(c)}`, `<b>y = ${poly([[m, 'x'], [c, '']])}</b>`] }); } },
  { g: 7, f() { const a = NZ(-6, 6), b = P([1, 1, 2, 3]); if (gcd(a, b) !== 1) return TOPIC('straight-line').v[4].f(); const [n, d] = simp(-b, a);
    return Q({ kind: 'frac', text: `A line has gradient ${fr(a, b)}.<br>What is the gradient of a line perpendicular to it?`, answer: [n, d], hint: 'Flip the fraction and change the sign (negative reciprocal).', steps: [`Flip: ${fr(b, a)}`, `Change sign: <b>${fr(n, d)}</b>`, `Check: ${fr(a, b)} × ${fr(n, d)} = −1`], traps: [{ v: a / b, why: 'Same gradient means PARALLEL. Perpendicular → negative reciprocal.' }, { v: b / a, why: 'You flipped it — now change the sign too.' }, { v: -a / b, why: 'You changed the sign — now flip it too.' }] }); } },

{ id: 'compound-measures', name: 'Speed, Density & Pressure', cat: 'Geometry', icon: '🚗',
  learn: ['Speed = Distance ÷ Time. Density = Mass ÷ Volume. Pressure = Force ÷ Area.', 'Use a formula triangle: cover the one you want to find.', 'Check units: km and hours give km/h; g and cm³ give g/cm³.', 'Minutes to hours: ÷ 60 (30 min = 0.5 h, 15 min = 0.25 h).'],

  { g: 3, f() { const s = P([40, 48, 60, 80, 90, 120]), mins = P([15, 30, 45, 20, 40, 90]), d = s * mins / 60; return Q({ text: `A train travels at ${s} km/h for ${mins} minutes.<br>How far does it travel?`, answer: d, unit: 'km', hint: `Change ${mins} minutes into hours first (÷ 60).`, steps: [`${mins} min = ${fmt(mins / 60)} hours`, `Distance = ${s} × ${fmt(mins / 60)}`, `= <b>${fmt(d)} km</b>`], traps: [{ v: s * mins, why: 'The speed is per HOUR — change the minutes to hours first.' }] }); } },
  { g: 4, f() { const D = P([0.5, 0.8, 1.2, 2.5, 7.8, 8.9, 11.3, 19.3, 2.7]), V = R(5, 60), m = rnd(D * V, 2), findD = Math.random() < .5;
    return findD ? Q({ text: `A metal block has mass ${fmt(m)} g and volume ${V} cm³.<br>Find its density.`, answer: D, unit: 'g/cm³', hint: 'Density = mass ÷ volume.', steps: [`${fmt(m)} ÷ ${V}`, `= <b>${fmt(D)} g/cm³</b>`], traps: [{ v: rnd(V / m, 4), why: 'Upside down — density = MASS ÷ volume.' }] })

  { g: 5, f() { const A = P([0.5, 2, 4, 5, 8, 10, 0.25]), p = R(2, 30) * 5, F = rnd(p * A, 2); return Q({ text: `A force of ${fmt(F)} N acts on an area of ${fmt(A)} m².<br>Calculate the pressure.`, answer: p, unit: 'N/m²', hint: 'Pressure = force ÷ area.', steps: [`${fmt(F)} ÷ ${fmt(A)}`, `= <b>${p} N/m²</b>`], traps: [{ v: rnd(F * A, 3), why: 'Pressure = force ÷ AREA (divide).' }] }); } },
  { g: 6, f() { const v = R(2, 30) * 5, kmh = v * 3.6, to = Math.random() < .5; return to ? Q({ text: `Convert ${v} m/s into km/h.`, answer: kmh, unit: 'km/h', hint: 'In one hour there are 3600 seconds; then ÷ 1000 for km. Overall × 3.6.', steps: [`${v} m/s × 3600 = ${v * 3600} m per hour`, `÷ 1000 = <b>${fmt(kmh)} km/h</b>`], traps: [{ v: rnd(v / 3.6, 3), why: 'km/h is a BIGGER number than m/s here — multiply by 3.6.' }] })
      : Q({ text: `Convert ${fmt(kmh)} km/h into m/s.`, answer: v, unit: 'm/s', hint: '× 1000 to get metres, ÷ 3600 to get per second. Overall ÷ 3.6.', steps: [`${fmt(kmh)} × 1000 = ${fmt(kmh * 1000)} m per hour`, `÷ 3600 = <b>${v} m/s</b>`], traps: [{ v: rnd(kmh * 3.6, 2), why: 'm/s is a smaller number — divide by 3.6.' }] }); } },

{ id: 'conversions', name: 'Unit Conversions', cat: 'Geometry', icon: '⚖️',
  learn: ['1 cm = 10 mm, 1 m = 100 cm, 1 km = 1000 m. 1 kg = 1000 g. 1 litre = 1000 ml = 1000 cm³.', 'Big unit → small unit: multiply. Small unit → big unit: divide.', 'Area: 1 m² = 100 × 100 = 10 000 cm². Volume: 1 m³ = 1 000 000 cm³.', 'Time is NOT decimal: 1 hour = 60 minutes.'],

{ id: 'pie-charts', name: 'Pie Charts', cat: 'Statistics', icon: '🥧',

{ id: 'transformations', name: 'Transformations', cat: 'Geometry', icon: '🔄',
  learn: ['Translation slides a shape. The column vector (x over y) says how far right/left and up/down.', 'Reflection flips over a mirror line, e.g. the x-axis, y-axis or y = x.', 'Rotation turns a shape: give the angle, direction and centre.', 'Enlargement changes the size: multiply distances from the centre by the scale factor.'],
  mis: ['Mixing up the x and y parts of a vector.', 'Reflecting in the x-axis but changing the x-coordinate (the y changes!).', 'Forgetting to state the centre of rotation or enlargement.'],
  v: [
  { g: 2, f() { const x = R(-6, 6), y = R(-6, 6), a = NZ(-6, 6), b = NZ(-6, 6); return Q({ kind: 'multi', text: `The point ${pt(x, y)} is translated by the vector (${fmt(a)} over ${fmt(b)}) — that is ${Math.abs(a)} ${a > 0 ? 'right' : 'left'} and ${Math.abs(b)} ${b > 0 ? 'up' : 'down'}.<br>Where does it end up?`, fields: [{ label: 'x', answer: x + a }, { label: 'y', answer: y + b }], hint: 'Add the top number to x and the bottom number to y.', steps: [`x: ${fmt(x)} + ${neg(a)} = ${fmt(x + a)}`, `y: ${fmt(y)} + ${neg(b)} = ${fmt(y + b)}`, `<b>${pt(x + a, y + b)}</b>`], mtraps: [{ v: [x + b, y + a], why: 'The TOP number of the vector moves x (left/right); the BOTTOM moves y.' }] }); } },
  { g: 3, f() { const x = NZ(-7, 7), y = NZ(-7, 7); if (x === y) return TOPIC('transformations').v[0].f(); const m = P(['the x-axis', 'the y-axis', 'the line y = x']), r = { 'the x-axis': [x, -y], 'the y-axis': [-x, y], 'the line y = x': [y, x] }[m];
    return Q({ kind: 'multi', text: `Reflect the point ${pt(x, y)} in ${m}.`, fields: [{ label: 'x', answer: r[0] }, { label: 'y', answer: r[1] }], hint: { 'the x-axis': 'Mirror in the x-axis: x stays the same, y changes sign.', 'the y-axis': 'Mirror in the y-axis: y stays the same, x changes sign.', 'the line y = x': 'Mirror in y = x: swap the coordinates.' }[m],
      steps: [{ 'the x-axis': 'x stays, y changes sign', 'the y-axis': 'y stays, x changes sign', 'the line y = x': 'swap x and y' }[m], `<b>${pt(r[0], r[1])}</b>`], mtraps: m === 'the x-axis' ? [{ v: [-x, y], why: 'Reflecting in the x-axis flips UP/DOWN, so the y-coordinate changes.' }] : m === 'the y-axis' ? [{ v: [x, -y], why: 'Reflecting in the y-axis flips LEFT/RIGHT, so the x-coordinate changes.' }] : [] }); } },
  { g: 4, f() { const x = NZ(-7, 7), y = NZ(-7, 7), t = P(['90° clockwise', '90° anticlockwise', '180°']), r = { '90° clockwise': [y, -x], '90° anticlockwise': [-y, x], '180°': [-x, -y] }[t];
    return Q({ kind: 'multi', text: `Rotate the point ${pt(x, y)} ${t} about the origin (0, 0).`, fields: [{ label: 'x', answer: r[0] }, { label: 'y', answer: r[1] }], hint: { '90° clockwise': '(x, y) → (y, −x). Or use tracing paper!', '90° anticlockwise': '(x, y) → (−y, x). Or use tracing paper!', '180°': '(x, y) → (−x, −y).' }[t],
      steps: [{ '90° clockwise': 'Rule: (x, y) → (y, −x)', '90° anticlockwise': 'Rule: (x, y) → (−y, x)', '180°': 'Rule: (x, y) → (−x, −y)' }[t], `<b>${pt(r[0], r[1])}</b>`], mtraps: t !== '180°' ? [{ v: t === '90° clockwise' ? [-y, x] : [y, -x], why: 'That is the other direction. Clockwise turns like the hands of a clock.' }] : [] }); } },
  { g: 5, f() { const k = P([2, 3, 0.5, 4]), x = R(-4, 4) * 2, y = R(-4, 4) * 2; return Q({ kind: 'multi', text: `The point ${pt(x, y)} is enlarged by scale factor ${fmt(k)}, centre (0, 0).<br>Where does it end up?`, fields: [{ label: 'x', answer: x * k }, { label: 'y', answer: y * k }], hint: 'With centre (0, 0), multiply both coordinates by the scale factor.', steps: [`${pt(x, y)} × ${fmt(k)}`, `<b>${pt(x * k, y * k)}</b>`], mtraps: [{ v: [x + k, y + k], why: 'Enlargement MULTIPLIES distances from the centre — it doesn\'t add.' }] }); } },
  { g: 6, f() { const cx = R(-3, 3), cy = R(-3, 3), k = P([2, 3, -1, -2, 0.5]), dx = R(-3, 3) * 2, dy = NZ(-3, 3) * 2, x = cx + dx, y = cy + dy, X = cx + k * dx, Y = cy + k * dy;
    return Q({ kind: 'multi', text: `The point ${pt(x, y)} is enlarged by scale factor ${fmt(k)} with centre ${pt(cx, cy)}.<br>Where does it end up?`, fields: [{ label: 'x', answer: X }, { label: 'y', answer: Y }], hint: 'Find the vector from the centre to the point, multiply it by the scale factor, then add it back on to the centre.', steps: [`Centre → point: (${fmt(dx)}, ${fmt(dy)})`, `× ${fmt(k)} → (${fmt(k * dx)}, ${fmt(k * dy)})${k < 0 ? ' — negative, so it ends up on the OTHER side of the centre' : ''}`, `Centre + that = <b>${pt(X, Y)}</b>`], mtraps: [{ v: [x * k, y * k], why: 'The centre is not (0, 0) — measure from the centre.' }] }); } },
  ] },
);
/* Order topics to follow the revision guide */
const GUIDE_ORDER = ['negatives', 'rounding', 'factors-primes', 'fractions', 'decimals', 'recurring', 'percentages', 'ratio', 'proportion', 'powers-roots', 'standard-form', 'bounds', 'surds',

  'averages', 'pie-charts', 'box-plots', 'cumulative-frequency', 'histograms', 'probability', 'tree', 'venn'];
TOPICS.sort((a, b) => GUIDE_ORDER.indexOf(a.id) - GUIDE_ORDER.indexOf(b.id));
